---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-settings
  namespace: flux-system
data:
  TIMEZONE: "America/Chicago"

  SUPERIOR: "10.40.1.1"
  HURON: "10.40.1.2"
  MICHIGAN: "10.40.1.3"
  ERIE: "10.40.1.4"
  ONTARIO: "10.40.1.5"

  # Off the node subnet (10.40.0.0/16) on purpose: that range overlaps remote
  # clients' local networks, so Tailscale refuses to route it and tailnet
  # traffic never reaches the cluster. This subnet is reached via a route on
  # the UniFi gateway pointing at the nodes.
  INTERNAL: "192.168.69.10"
  EXTERNAL: "10.40.0.30"

  KUBE_VIP: "10.40.1.0"

  NODE_CIDR_START: "10.40.0.100"
  NODE_CIDR_END: "10.40.0.245"

  JELLYFIN: "10.40.0.100"

  CRUNCHY_POSTGRES: "10.40.0.110"

  # MARIADB
  MAXSCALE: "10.40.0.120"
  MAXSCALE_GUI: "10.40.0.121"
  MARIADB: "10.40.0.122"

  # VECTOR
  VECTOR: "10.40.0.130"

  # PULSE
  PULSE: "10.40.0.135"

  # GARAGE
  GARAGE: "10.40.0.140"

  # CODE-SERVER (http + ssh services share the IP via lb-ipam-sharing-key)
  CODE_SERVER: "10.40.0.145"
