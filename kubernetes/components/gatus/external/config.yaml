endpoints:
  - name: "${APP}"
    group: External
    url: "https://${GATUS_SUBDOMAIN:=${APP}}.ewatkins.dev${GATUS_PATH:=/}"
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == ${GATUS_STATUS:=200}"
    alerts:
      - type: pushover
        minimum-reminder-interval: 4h
        provider-override:
          priority: 1
