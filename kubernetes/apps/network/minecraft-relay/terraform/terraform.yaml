---
# The relay VM's network (relay-vcn), defined in terraform/oracle-relay and
# applied by tofu-controller.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: oracle-relay
  namespace: oracle-relay
spec:
  interval: 1h
  path: ./terraform/oracle-relay
  sourceRef:
    kind: GitRepository
    name: talos-cluster
    namespace: flux-system
  # Merging is the approval: every plan from main is applied. Review it on the
  # PR first, where the branch planner posts it as a comment. Every resource
  # has prevent_destroy, so a plan that would replace or destroy one fails.
  approvePlan: auto
  # Fresh state (tfstate-default-oracle-relay-v2): the first state was
  # corrupted by a refresh that could not see the network, and is kept as
  # tfstate-default-oracle-relay. imports.tf adopts the network again.
  backendConfig:
    secretSuffix: oracle-relay-v2
    inClusterConfig: true
  branchPlanner:
    enablePathScope: true
  # The plan as text, in ConfigMap tfplan-default-oracle-relay.
  storeReadablePlan: human
  # Removing this object must never delete the relay's network.
  destroyResourcesOnDeletion: false
  serviceAccountName: oracle-relay-runner
  # The Oracle API key and the home /32, as tofu variables.
  varsFrom:
    - kind: Secret
      name: oracle-relay-secret
