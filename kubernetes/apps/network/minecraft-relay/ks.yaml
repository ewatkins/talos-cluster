---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app minecraft-relay
  namespace: flux-system
spec:
  targetNamespace: network
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: cloudflare-dns
  path: ./kubernetes/apps/network/minecraft-relay/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app oracle-relay
  namespace: flux-system
spec:
  targetNamespace: oracle-relay
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: tofu-controller
    - name: external-secrets-stores
  path: ./kubernetes/apps/network/minecraft-relay/terraform
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
