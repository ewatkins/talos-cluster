---
# Suspended: the VM (minecraft-relay) is up. Unsuspend this only to rebuild
# it after deleting the VM. The VM launches with an ephemeral IP; move the
# minecraft-relay reserved IP (170.9.242.78, which DNS points at) onto it.
#
# Free Oracle Cloud VMs are often "out of host capacity", so instead of
# retrying by hand this CronJob asks for the relay VM every 10 minutes
# until Oracle hands one over. Players join mc.ewatkins.dev, which points at
# the VM: HAProxy takes TCP 25565 (Java) and bedrock-relay.py UDP 19132 (Bedrock), and
# both forward to the home WAN IP, where the modem and UniFi port forwards
# accept only this VM's reserved IP and send it on to Velocity/Geyser on
# wing-proxy. HAProxy adds a PROXY v2 header so Velocity (haproxy-protocol =
# true) sees real player addresses. The home IP isn't in this public repo:
# launch.sh fills @HOME_WAN_IP@ in from the secret.
#
# Exactly one VM: every run first lists instances named $NAME that are
# not TERMINATED/TERMINATING and does nothing if one exists, whatever its state
# (PROVISIONING, RUNNING, STOPPED, ...). A launch shows up as PROVISIONING
# straight away, and concurrencyPolicy Forbid keeps two runs from overlapping.
# Delete the VM and the next run builds a fresh one; delete this CronJob once
# the VM is up for good. When the VM first reports RUNNING with a public IP, a
# run sends one Pushover notification and tags the instance notified=true.
#
# The network (relay-vcn) is OpenTofu, in terraform/oracle-relay; only the VM
# is launched here. us-chicago-1 offers no VM.Standard.E2.1.Micro (launching it
# returns NotAuthorizedOrNotFound), so the VM is a 1 OCPU / 6 GB
# VM.Standard.A1.Flex (ARM), inside the Always Free 4 OCPU / 24 GB allowance.
# A1.Flex is offered in every AD, so each run tries them in turn.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bedrock-relay-launcher
  namespace: network
  annotations:
    # The scripts use shell ${...} expansions, not Flux variables.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  launch.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    C="${OCI_COMPARTMENT:?}"

    TAGS='{"managed-by":"talos-cluster/bedrock-relay-launcher"}'

    notify() {
      python3 -I - "$1" <<'PY'
    import os, sys, urllib.parse, urllib.request
    data = urllib.parse.urlencode({
        "token": os.environ["PUSHOVER_TOKEN"], "user": os.environ["PUSHOVER_USER_KEY"],
        "title": "Bedrock relay VM is up", "message": sys.argv[1],
    }).encode()
    urllib.request.urlopen("https://api.pushover.net/1/messages.json", data, timeout=20).read()
    PY
    }

    existing=$(oci compute instance list --compartment-id "$C" --display-name "$NAME" --all \
      --query 'data[?"lifecycle-state"!=`TERMINATED` && "lifecycle-state"!=`TERMINATING`]' 2>/dev/null \
      | jq -r '.[] | "\(.id) \(."lifecycle-state") \(."freeform-tags".notified // "false")"')
    if [ -n "$existing" ]; then
      while read -r id state notified; do
        ip=$(oci compute instance list-vnics --instance-id "$id" --query 'data[0]."public-ip"' --raw-output 2>/dev/null || true)
        echo "$NAME already exists: $state public-ip=${ip:-none}; nothing to launch"
        # Tell the user once, when the VM is running with an address. The
        # notified tag on the instance records that it was sent; if Pushover
        # fails the tag stays unset and the next run tries again.
        if [ "$state" = RUNNING ] && [ -n "$ip" ] && [ "$notified" != true ]; then
          if notify "$NAME is RUNNING at $ip (Oracle us-chicago-1). Point mc.ewatkins.dev at it and test UDP 19132 and TCP 25565."; then
            oci compute instance update --instance-id "$id" --force \
              --freeform-tags "$(jq -c '. + {notified: "true"}' <<<"$TAGS")" >/dev/null
            echo "sent Pushover notification"
          else
            echo "Pushover notification failed; will retry next run" >&2
          fi
        fi
      done <<<"$existing"
      exit 0
    fi

    # The cloud-init names the home WAN IP; it comes from the secret so it
    # stays out of Git.
    sed "s/@HOME_WAN_IP@/${HOME_WAN_IP:?}/g" /config/cloud-init.yaml > /tmp/cloud-init.yaml

    for ad in $ADS; do
      echo "no $NAME instance; launching $SHAPE ($SHAPE_CONFIG) in $ad"
      if out=$(oci compute instance launch --compartment-id "$C" \
          --availability-domain "$ad" --shape "$SHAPE" --shape-config "$SHAPE_CONFIG" \
          --image-id "$IMAGE_ID" \
          --subnet-id "$SUBNET_ID" --assign-public-ip true \
          --display-name "$NAME" --hostname-label "$NAME" \
          --freeform-tags "$TAGS" \
          --agent-config file:///config/agent-config.json \
          --instance-options '{"areLegacyImdsEndpointsDisabled": true}' \
          --ssh-authorized-keys-file /config/ssh.pub \
          --user-data-file /tmp/cloud-init.yaml 2>&1); then
        echo "launched: $(jq -r '.data | "\(.id) \(."lifecycle-state")"' <<<"$out")"
        exit 0
      fi

      msg=$(grep -oE '"message": "[^"]*"' <<<"$out" | head -1 || true)
      # Expected while Oracle has no capacity here; try the next AD, then
      # again next run, without failing the Job. Anything else (including
      # NotAuthorizedOrNotFound, which is what a wrong shape, image or
      # subnet returns) is a setup problem and fails the Job.
      if grep -qE 'Out of host capacity|out of capacity|TooManyRequests|InternalError' <<<"$out"; then
        echo "not yet: ${msg:-$(head -c 300 <<<"$out")}"
        continue
      fi
      echo "unexpected error:" >&2
      echo "$out" >&2
      exit 1
    done
  ssh.pub: |
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJLUii06o9M7IuYRamEe5tB5GlOlB3zJu7ydmz99gHUc ewatkins@ewatkins-pc
  # Oracle Cloud Agent: keep monitoring, logs, Cloud Guard and Bastion; turn
  # off Run Command (root commands for anyone with OCI API rights) and the
  # scanners nothing reads.
  agent-config.json: |
    {"isMonitoringDisabled": false, "isManagementDisabled": false, "areAllPluginsDisabled": false,
     "pluginsConfig": [
      {"name": "Compute Instance Run Command", "desiredState": "DISABLED"},
      {"name": "Vulnerability Scanning", "desiredState": "DISABLED"},
      {"name": "OS Management Hub Agent", "desiredState": "DISABLED"},
      {"name": "Block Volume Management", "desiredState": "DISABLED"},
      {"name": "Compute Instance Monitoring", "desiredState": "ENABLED"},
      {"name": "Custom Logs Monitoring", "desiredState": "ENABLED"},
      {"name": "Cloud Guard Workload Protection", "desiredState": "ENABLED"},
      {"name": "Bastion", "desiredState": "ENABLED"}
     ]}
  cloud-init.yaml: |
    #cloud-config
    # Key-only SSH as ewatkins, like the wings; no default `ubuntu` user, no
    # root login, no passwords.
    users:
      - name: ewatkins
        shell: /bin/bash
        groups: [sudo]
        sudo: "ALL=(ALL) NOPASSWD:ALL"
        lock_passwd: true
        ssh_authorized_keys:
          - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJLUii06o9M7IuYRamEe5tB5GlOlB3zJu7ydmz99gHUc ewatkins@ewatkins-pc
    disable_root: true
    ssh_pwauth: false
    package_update: true
    package_upgrade: true
    package_reboot_if_required: true
    packages:
      - haproxy
    write_files:
      - path: /etc/haproxy/haproxy.cfg
        content: |
          # Minecraft Java relay: TCP 25565 to Velocity through the home port
          # forward (which only accepts this VM), with a PROXY v2 header so
          # Velocity (haproxy-protocol = true) sees the real player address.
          global
              log /dev/log local0 notice
              chroot /var/lib/haproxy
              user haproxy
              group haproxy
              daemon
              maxconn 2000

          defaults
              mode tcp
              log global
              option tcplog
              timeout connect 5s
              timeout client 1h
              timeout server 1h

          frontend minecraft_java
              bind :25565
              # Per-source limits, so one address cannot tie up Velocity: at
              # most 20 open connections and 30 new ones per 10 s. Everyone at
              # home shares the home IP, which stays well under this.
              stick-table type ip size 100k expire 10m store conn_cur,conn_rate(10s)
              tcp-request connection track-sc0 src
              tcp-request connection reject if { sc_conn_cur(0) gt 20 }
              tcp-request connection reject if { sc_conn_rate(0) gt 30 }
              default_backend velocity

          backend velocity
              server home @HOME_WAN_IP@:25565 send-proxy-v2
      - path: /usr/local/bin/bedrock-relay.py
        permissions: "0755"
        content: |
          #!/usr/bin/env python3
          """Relays Minecraft Bedrock (UDP 19132) to Geyser through the home port forward.

          Each client address gets its own upstream socket. The first datagram sent
          upstream for a client starts with a PROXY v2 header naming that client;
          Geyser (advanced.bedrock.use-haproxy-protocol) takes the player address from
          it and expects no header on later packets from the same upstream socket.
          """
          import os
          import selectors
          import socket
          import struct
          import time

          LISTEN = ("0.0.0.0", int(os.environ.get("LISTEN_PORT", "19132")))
          UPSTREAM = (os.environ["UPSTREAM_HOST"], int(os.environ.get("UPSTREAM_PORT", "19132")))
          IDLE = 120          # seconds without traffic before a client is dropped
          MAX_CLIENTS = 256

          SIG = b"\r\n\r\n\x00\r\nQUIT\n"


          def proxy_header(client):
              # Version 2, PROXY command; IPv4 over UDP (0x12).
              body = (socket.inet_aton(client[0]) + socket.inet_aton("0.0.0.0")
                      + struct.pack(">HH", client[1], LISTEN[1]))
              return SIG + b"\x21\x12" + struct.pack(">H", len(body)) + body


          def main():
              sel = selectors.DefaultSelector()
              listener = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
              listener.bind(LISTEN)
              listener.setblocking(False)
              sel.register(listener, selectors.EVENT_READ, None)

              clients = {}  # client address -> [upstream socket, last seen]
              print(f"relaying udp {LISTEN[1]} to {UPSTREAM[0]}:{UPSTREAM[1]} with PROXY v2", flush=True)
              last_sweep = time.monotonic()
              while True:
                  for key, _ in sel.select(timeout=5):
                      now = time.monotonic()
                      if key.data is None:
                          try:
                              data, client = listener.recvfrom(65535)
                          except BlockingIOError:
                              continue
                          entry = clients.get(client)
                          if entry is None:
                              if len(clients) >= MAX_CLIENTS:
                                  continue
                              up = socket.socket(socket.AF_INET, socket.SOCK_DGRAM)
                              up.setblocking(False)
                              up.connect(UPSTREAM)
                              sel.register(up, selectors.EVENT_READ, client)
                              entry = clients[client] = [up, now]
                              data = proxy_header(client) + data
                          entry[1] = now
                          try:
                              entry[0].send(data)
                          except OSError:
                              pass
                      else:
                          client = key.data
                          entry = clients.get(client)
                          if entry is None:
                              continue
                          try:
                              data = entry[0].recv(65535)
                          except OSError:
                              continue
                          entry[1] = now
                          try:
                              listener.sendto(data, client)
                          except OSError:
                              pass
                  now = time.monotonic()
                  if now - last_sweep >= 5:
                      last_sweep = now
                      for client, (up, seen) in list(clients.items()):
                          if now - seen > IDLE:
                              sel.unregister(up)
                              up.close()
                              del clients[client]


          if __name__ == "__main__":
              main()
      - path: /etc/systemd/system/bedrock-relay.service
        content: |
          # Relays Minecraft Bedrock (UDP 19132) to Geyser through the home port
          # forward, adding a PROXY v2 header to each client's first packet so Geyser
          # sees the real player address.
          [Unit]
          Description=Minecraft Bedrock UDP relay
          After=network-online.target
          Wants=network-online.target

          [Service]
          DynamicUser=yes
          Environment=UPSTREAM_HOST=@HOME_WAN_IP@
          ExecStart=/usr/bin/python3 -I /usr/local/bin/bedrock-relay.py
          Restart=always
          RestartSec=5
          TasksMax=16
          MemoryMax=256M
          NoNewPrivileges=yes
          CapabilityBoundingSet=
          ProtectSystem=strict
          ProtectHome=yes
          PrivateTmp=yes
          PrivateDevices=yes
          ProtectKernelTunables=yes
          ProtectKernelModules=yes
          ProtectControlGroups=yes
          RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX
          RestrictNamespaces=yes
          LockPersonality=yes
          SystemCallArchitectures=native

          [Install]
          WantedBy=multi-user.target
      - path: /etc/ssh/sshd_config.d/10-hardening.conf
        content: |
          # Key-only logins as ewatkins, nothing forwarded. Read before
          # 50-cloud-init.conf, and the first value sshd sees wins.
          AllowUsers ewatkins
          PermitRootLogin no
          PasswordAuthentication no
          KbdInteractiveAuthentication no
          AuthorizedKeysFile .ssh/authorized_keys
          MaxAuthTries 3
          LoginGraceTime 20
          X11Forwarding no
          AllowTcpForwarding no
          AllowAgentForwarding no
          AllowStreamLocalForwarding no
          PermitTunnel no
          ClientAliveInterval 300
          ClientAliveCountMax 2
      - path: /etc/sysctl.d/90-hardening.conf
        content: |
          # No ICMP redirects, drop source-routed packets, log martians.
          net.ipv4.conf.all.accept_redirects = 0
          net.ipv4.conf.default.accept_redirects = 0
          net.ipv4.conf.all.send_redirects = 0
          net.ipv4.conf.default.send_redirects = 0
          net.ipv4.conf.all.accept_source_route = 0
          net.ipv6.conf.all.accept_redirects = 0
          net.ipv6.conf.default.accept_redirects = 0
          net.ipv4.conf.all.log_martians = 1
          net.ipv4.icmp_echo_ignore_broadcasts = 1
          kernel.kptr_restrict = 2
          kernel.dmesg_restrict = 1
      - path: /etc/apt/apt.conf.d/52unattended-upgrades-local
        content: |
          // Reboot for kernel/libc updates at 10:00 UTC (05:00 Central), a quiet hour.
          Unattended-Upgrade::Automatic-Reboot "true";
          Unattended-Upgrade::Automatic-Reboot-Time "10:00";
          Unattended-Upgrade::Remove-Unused-Dependencies "true";
    runcmd:
      # Nothing here needs RPC, a modem manager or removable-disk handling.
      - DEBIAN_FRONTEND=noninteractive apt-get -y purge rpcbind modemmanager udisks2
      - sysctl --system
      # Oracle's Ubuntu images ship iptables rules that reject everything but SSH.
      - iptables -I INPUT -p udp --dport 19132 -j ACCEPT
      - iptables -I INPUT -p tcp --dport 25565 -j ACCEPT
      # The VCN has no IPv6: allow loopback, replies and ICMPv6, drop the rest.
      - ip6tables -A INPUT -i lo -j ACCEPT
      - ip6tables -A INPUT -m state --state RELATED,ESTABLISHED -j ACCEPT
      - ip6tables -A INPUT -p ipv6-icmp -j ACCEPT
      - ip6tables -P INPUT DROP
      - netfilter-persistent save
      - systemctl reload ssh
      - systemctl daemon-reload
      - systemctl enable --now bedrock-relay.service
      - systemctl restart haproxy.service
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bedrock-relay-launcher
  namespace: network
spec:
  schedule: "*/10 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 0
      activeDeadlineSeconds: 480
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: launcher
              image: ghcr.io/oracle/oci-cli:20261014@sha256:9b13656be34c1c147e5a6d68246a01ee2a7da27ae2c132f1a22d488dfede9bbe
              command: ["bash", "/config/launch.sh"]
              env:
                - { name: HOME, value: /tmp }
                - { name: OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING, value: "True" }
                # Matched by display name: renaming the VM in the console
                # makes the next run launch another one.
                - { name: NAME, value: minecraft-relay }
                - { name: SHAPE, value: VM.Standard.A1.Flex }
                - { name: SHAPE_CONFIG, value: '{"ocpus":1,"memoryInGBs":6}' }
                - { name: ADS, value: "lXFQ:US-CHICAGO-1-AD-1 lXFQ:US-CHICAGO-1-AD-2 lXFQ:US-CHICAGO-1-AD-3" }
                # Canonical-Ubuntu-24.04-Minimal-aarch64-2026.09.18-0 (A1.Flex is ARM)
                - { name: IMAGE_ID, value: ocid1.image.oc1.us-chicago-1.aaaaaaaajtdmoytnv6a7ct73vcr2sdu35gic6skc4zxde7jvskaahgqtipna }
                # relay-subnet in relay-vcn
                - { name: SUBNET_ID, value: ocid1.subnet.oc1.us-chicago-1.aaaaaaaawrch3tasud77qoiweiyukyieqmngefmqc6dss6fumq6sn4xpuaia }
              # OCI_CLI_USER/TENANCY/FINGERPRINT/REGION/KEY_CONTENT (the CLI
              # needs no config file when these are set) and PUSHOVER_*.
              envFrom:
                - secretRef:
                    name: bedrock-relay-launcher-secret
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: bedrock-relay-launcher
            - name: tmp
              emptyDir: {}
