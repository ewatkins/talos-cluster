---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/source.toolkit.fluxcd.io/ocirepository_v1.json
apiVersion: source.toolkit.fluxcd.io/v1
kind: OCIRepository
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  layerSelector:
    mediaType: application/vnd.cncf.helm.chart.content.v1.tar+gzip
    operation: copy
  ref:
    tag: 3.7.2
  url: oci://ghcr.io/k8s-gateway/charts/k8s-gateway
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: k8s-gateway
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: k8s-gateway
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    # Authoritative DNS for the internal zone. Watches HTTPRoutes/Services and
    # answers every ingress hostname with its gateway's address — no manual
    # records. Exposed straight onto the tailnet via loadBalancerClass:tailscale
    # (the tailscale-operator gives it a tailnet IP); point tailnet Split-DNS for
    # ewatkins.dev at that IP.
    domain: ewatkins.dev
    ttl: 1
    service:
      ipFamily: IPv4
      ipFamilyPolicy: SingleStack
      loadBalancerClass: tailscale
      port: 53
      type: LoadBalancer
      annotations:
        tailscale.com/hostname: k8s-gateway
    watchedResources: ["HTTPRoute", "Service"]
