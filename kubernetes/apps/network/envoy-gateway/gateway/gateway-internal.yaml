---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: network
spec:
  gatewayClassName: envoy-internal
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: ewatkins-dev-production-tls
            namespace: network
      allowedRoutes:
        namespaces:
          from: All
    # The Pterodactyl panel reaches each Wings daemon at <node fqdn>:8080, so
    # the gateway has to answer on that port as well as 443. Routes for the
    # wing hosts attach here via sectionName: wings.
    - name: wings
      protocol: HTTPS
      port: 8080
      tls:
        mode: Terminate
        certificateRefs:
          - name: ewatkins-dev-production-tls
            namespace: network
      allowedRoutes:
        namespaces:
          from: All
    - name: ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
