---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: internal
  namespace: network
spec:
  gatewayClassName: envoy-internal
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
    - name: https
      protocol: HTTPS
      port: 443
      tls:
        mode: Terminate
        certificateRefs:
          - name: ewatkins-dev-production-tls
            namespace: network
      allowedRoutes:
        namespaces:
          from: All
    # The Pterodactyl panel reaches each Wings daemon at <node fqdn>:8080, so
    # the gateway has to answer on that port as well as 443. Routes for the
    # wing hosts attach here via sectionName: wings.
    - name: wings
      protocol: HTTPS
      port: 8080
      tls:
        mode: Terminate
        certificateRefs:
          - name: ewatkins-dev-production-tls
            namespace: network
      allowedRoutes:
        namespaces:
          from: All
    # The iDRAC 8 virtual console loads its page over 443 but opens the KVM
    # websocket straight to the Remote Presence Port, which never touches the
    # 443 listener. Terminate TLS here with the same cert: the browser would
    # otherwise be handed the iDRAC's self-signed appliance cert on a
    # websocket, which it rejects with no interstitial and no click-through.
    # TLS + TLSRoute rather than TCP + TCPRoute because a TCPRoute cannot
    # reference a Backend, and a Service/EndpointSlice is the shape 8c593f59
    # backed out of.
    - name: kvm
      protocol: TLS
      port: 5900
      tls:
        mode: Terminate
        certificateRefs:
          - name: ewatkins-dev-production-tls
            namespace: network
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: TLSRoute
    - name: ssh
      protocol: TCP
      port: 22
      allowedRoutes:
        namespaces:
          from: All
        kinds:
          - group: gateway.networking.k8s.io
            kind: TCPRoute
