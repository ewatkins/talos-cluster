---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailscale-serve
  namespace: network
  labels:
    app.kubernetes.io/name: tailscale-serve
spec:
  replicas: 1
  strategy:
    type: Recreate # single tailnet identity backed by one state Secret
  selector:
    matchLabels:
      app.kubernetes.io/name: tailscale-serve
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailscale-serve
    spec:
      serviceAccountName: tailscale-serve
      containers:
        - name: tailscale
          image: tailscale/tailscale:v1.98.9
          env:
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  name: operator-oauth
                  key: client_secret
            - name: TS_EXTRA_ARGS
              value: "--advertise-tags=tag:k8s"
            - name: TS_HOSTNAME
              value: great-lakes-gw
            - name: TS_USERSPACE
              value: "true"
            - name: TS_AUTH_ONCE
              value: "true"
            - name: TS_KUBE_SECRET
              value: tailscale-serve-state
            - name: TS_SERVE_CONFIG
              value: /config/serve.json
          volumeMounts:
            - name: serve-config
              mountPath: /config
              readOnly: true
          resources:
            requests:
              cpu: 10m
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: serve-config
          configMap:
            name: tailscale-serve-config
