---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: tailscale-serve
  namespace: network
---
# containerboot persists tailscaled state in a Kubernetes Secret (TS_KUBE_SECRET)
# so the tailnet device identity + IP stay stable across restarts.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tailscale-serve
  namespace: network
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["tailscale-serve-state"]
    verbs: ["get", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tailscale-serve
  namespace: network
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: tailscale-serve
subjects:
  - kind: ServiceAccount
    name: tailscale-serve
    namespace: network
