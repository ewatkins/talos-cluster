---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: playit
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      playit:
        # One agent per secret key: a second replica would register as the
        # same agent and the two would fight over the tunnels.
        replicas: 1
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/playit-cloud/playit-agent
              tag: 1.0.10@sha256:ca4766ced6e5bcee19137337808ec8fee5867c0910ac737efbb0bb452c378521
            # The image's entrypoint reads SECRET_KEY and runs
            # `playitd --secret ... --platform-docker`. Tunnels and their
            # local targets (Velocity on wing-proxy) are set on playit.gg.
            envFrom:
              - secretRef:
                  name: playit-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
    persistence:
      # playitd opens its IPC socket at /run/playit/playitd.sock.
      run:
        type: emptyDir
        globalMounts:
          - path: /run/playit
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
