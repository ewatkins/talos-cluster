---
apiVersion: externaldns.k8s.io/v1alpha1
kind: DNSEndpoint
metadata:
  name: playit
spec:
  endpoints:
    # Players join mc.ewatkins.dev on the default ports (Java 25565, Bedrock
    # 19132). It points at the Oracle relay VM (minecraft-relay), which
    # forwards to the playit tunnels and rewrites the Java handshake hostname.
    # DNS-only: Cloudflare can't proxy Minecraft or UDP.
    - dnsName: "mc.ewatkins.dev"
      recordType: A
      targets: ["170.9.242.78"]
      providerSpecific:
        - name: cloudflare/proxied
          value: "false"
