---
# Suspended: the VM (minecraft-relay) is up. Unsuspend this only to rebuild
# it after deleting the VM. The VM launches with an ephemeral IP; move the
# minecraft-relay reserved IP (170.9.242.78, which DNS points at) onto it.
#
# Free Oracle Cloud VMs are often "out of host capacity", so instead of
# retrying by hand this CronJob asks for the relay VM every 10 minutes
# until Oracle hands one over. The relay listens on UDP 19132 and forwards to
# the playit Bedrock tunnel, so players can use mc.ewatkins.dev on the default
# port (playit's free tunnel only offers a random port). It also listens on TCP
# 25565 for Java and forwards to the Java tunnel, rewriting the handshake
# hostname, because playit resets server-list pings that name mc.ewatkins.dev.
#
# Exactly one VM: every run first lists instances named $NAME that are
# not TERMINATED/TERMINATING and does nothing if one exists, whatever its state
# (PROVISIONING, RUNNING, STOPPED, ...). A launch shows up as PROVISIONING
# straight away, and concurrencyPolicy Forbid keeps two runs from overlapping.
# Delete the VM and the next run builds a fresh one; delete this CronJob once
# the VM is up for good. When the VM first reports RUNNING with a public IP, a
# run sends one Pushover notification and tags the instance notified=true.
#
# Network (relay-vcn, relay-subnet, security list opening UDP 19132 and TCP
# 25565 to all and SSH from home only) was created by hand in us-chicago-1; only the VM is
# launched here. us-chicago-1 offers no VM.Standard.E2.1.Micro (launching it
# returns NotAuthorizedOrNotFound), so the VM is a 1 OCPU / 6 GB
# VM.Standard.A1.Flex (ARM), inside the Always Free 4 OCPU / 24 GB allowance.
# A1.Flex is offered in every AD, so each run tries them in turn.
apiVersion: v1
kind: ConfigMap
metadata:
  name: bedrock-relay-launcher
  namespace: network
  annotations:
    # The scripts use shell ${...} expansions, not Flux variables.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  launch.sh: |
    #!/usr/bin/env bash
    set -euo pipefail
    C="$OCI_CLI_TENANCY"

    TAGS='{"managed-by":"talos-cluster/bedrock-relay-launcher"}'

    notify() {
      python3 -I - "$1" <<'PY'
    import os, sys, urllib.parse, urllib.request
    data = urllib.parse.urlencode({
        "token": os.environ["PUSHOVER_TOKEN"], "user": os.environ["PUSHOVER_USER_KEY"],
        "title": "Bedrock relay VM is up", "message": sys.argv[1],
    }).encode()
    urllib.request.urlopen("https://api.pushover.net/1/messages.json", data, timeout=20).read()
    PY
    }

    existing=$(oci compute instance list --compartment-id "$C" --display-name "$NAME" --all \
      --query 'data[?"lifecycle-state"!=`TERMINATED` && "lifecycle-state"!=`TERMINATING`]' 2>/dev/null \
      | jq -r '.[] | "\(.id) \(."lifecycle-state") \(."freeform-tags".notified // "false")"')
    if [ -n "$existing" ]; then
      while read -r id state notified; do
        ip=$(oci compute instance list-vnics --instance-id "$id" --query 'data[0]."public-ip"' --raw-output 2>/dev/null || true)
        echo "$NAME already exists: $state public-ip=${ip:-none}; nothing to launch"
        # Tell the user once, when the VM is running with an address. The
        # notified tag on the instance records that it was sent; if Pushover
        # fails the tag stays unset and the next run tries again.
        if [ "$state" = RUNNING ] && [ -n "$ip" ] && [ "$notified" != true ]; then
          if notify "$NAME is RUNNING at $ip (Oracle us-chicago-1). Point mc.ewatkins.dev at it and test UDP 19132 and TCP 25565."; then
            oci compute instance update --instance-id "$id" --force \
              --freeform-tags "$(jq -c '. + {notified: "true"}' <<<"$TAGS")" >/dev/null
            echo "sent Pushover notification"
          else
            echo "Pushover notification failed; will retry next run" >&2
          fi
        fi
      done <<<"$existing"
      exit 0
    fi

    for ad in $ADS; do
      echo "no $NAME instance; launching $SHAPE ($SHAPE_CONFIG) in $ad"
      if out=$(oci compute instance launch --compartment-id "$C" \
          --availability-domain "$ad" --shape "$SHAPE" --shape-config "$SHAPE_CONFIG" \
          --image-id "$IMAGE_ID" \
          --subnet-id "$SUBNET_ID" --assign-public-ip true \
          --display-name "$NAME" --hostname-label "$NAME" \
          --freeform-tags "$TAGS" \
          --ssh-authorized-keys-file /config/ssh.pub \
          --user-data-file /config/cloud-init.yaml 2>&1); then
        echo "launched: $(jq -r '.data | "\(.id) \(."lifecycle-state")"' <<<"$out")"
        exit 0
      fi

      msg=$(grep -oE '"message": "[^"]*"' <<<"$out" | head -1 || true)
      # Expected while Oracle has no capacity here; try the next AD, then
      # again next run, without failing the Job. Anything else (including
      # NotAuthorizedOrNotFound, which is what a wrong shape, image or
      # subnet returns) is a setup problem and fails the Job.
      if grep -qE 'Out of host capacity|out of capacity|TooManyRequests|InternalError' <<<"$out"; then
        echo "not yet: ${msg:-$(head -c 300 <<<"$out")}"
        continue
      fi
      echo "unexpected error:" >&2
      echo "$out" >&2
      exit 1
    done
  ssh.pub: |
    ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIJLUii06o9M7IuYRamEe5tB5GlOlB3zJu7ydmz99gHUc ewatkins@ewatkins-pc
  cloud-init.yaml: |
    #cloud-config
    package_update: true
    packages:
      - socat
    write_files:
      - path: /etc/systemd/system/bedrock-relay.service
        content: |
          # Relays Minecraft Bedrock (UDP 19132) to the playit tunnel. socat
          # forks one child per client and resolves the tunnel hostname for
          # each, so it follows playit if the tunnel's IP changes. -T reaps a
          # child after 120 s of silence.
          [Unit]
          Description=Minecraft Bedrock UDP relay to playit
          After=network-online.target
          Wants=network-online.target

          [Service]
          DynamicUser=yes
          ExecStart=/usr/bin/socat -T 120 UDP4-LISTEN:19132,fork,reuseaddr UDP4:practically-detected.tun.ply.gg:63404
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
      - path: /usr/local/bin/java-relay.py
        permissions: "0755"
        content: |
          #!/usr/bin/env python3
          """Relays Minecraft Java (TCP 25565) to the playit tunnel.

          playit's free Minecraft Java tunnel resets any connection whose handshake
          names a host other than the tunnel's own, and the vanilla server-list ping
          sends whatever address the player typed (mc.ewatkins.dev). So the first
          packet (the handshake) is rewritten to name the tunnel; everything after it
          is copied through untouched.
          """
          import asyncio
          import os
          import struct

          LISTEN_PORT = int(os.environ.get("LISTEN_PORT", "25565"))
          TUNNEL_HOST = "practically-unclog.tun.ply.gg"
          TUNNEL_PORT = 19087


          def varint(n):
              out = b""
              while True:
                  b, n = n & 0x7F, n >> 7
                  out += bytes([b | (0x80 if n else 0)])
                  if not n:
                      return out


          def read_varint(buf, i):
              n = 0
              for shift in range(0, 35, 7):
                  b = buf[i]
                  i += 1
                  n |= (b & 0x7F) << shift
                  if not b & 0x80:
                      return n, i
              raise ValueError("varint too long")


          async def read_packet(reader):
              length = 0
              for shift in range(0, 35, 7):
                  b = (await reader.readexactly(1))[0]
                  length |= (b & 0x7F) << shift
                  if not b & 0x80:
                      break
              else:
                  raise ValueError("varint too long")
              # A handshake is a few hundred bytes at most; anything else (a pre-1.7
              # legacy ping, or not Minecraft at all) is dropped.
              if not 0 < length <= 4096:
                  raise ValueError(f"bad handshake length {length}")
              return await reader.readexactly(length)


          def rewrite_handshake(body):
              packet_id, i = read_varint(body, 0)
              if packet_id != 0:
                  raise ValueError(f"not a handshake (packet {packet_id})")
              protocol, i = read_varint(body, i)
              host_len, i = read_varint(body, i)
              host = body[i:i + host_len].decode()
              rest = body[i + host_len + 2:]  # skip the port; rest is the next state
              # Forge appends "\0FML3\0" (and similar) to the host; keep it.
              _, sep, suffix = host.partition("\0")
              new_host = (TUNNEL_HOST + sep + suffix).encode()
              out = (varint(0) + varint(protocol) + varint(len(new_host)) + new_host
                     + struct.pack(">H", TUNNEL_PORT) + rest)
              return varint(len(out)) + out


          async def pipe(reader, writer):
              try:
                  while data := await reader.read(65536):
                      writer.write(data)
                      await writer.drain()
              finally:
                  writer.close()


          async def handle(client_r, client_w):
              peer = client_w.get_extra_info("peername")
              try:
                  handshake = rewrite_handshake(await asyncio.wait_for(read_packet(client_r), 10))
                  # Resolved per connection, so this follows playit if the tunnel's IP changes.
                  tunnel_r, tunnel_w = await asyncio.wait_for(
                      asyncio.open_connection(TUNNEL_HOST, TUNNEL_PORT), 10)
              except Exception as e:
                  print(f"{peer}: dropped: {e!r}", flush=True)
                  client_w.close()
                  return
              tunnel_w.write(handshake)
              await asyncio.gather(pipe(client_r, tunnel_w), pipe(tunnel_r, client_w),
                                   return_exceptions=True)


          async def main():
              server = await asyncio.start_server(handle, port=LISTEN_PORT)
              print(f"relaying :{LISTEN_PORT} to {TUNNEL_HOST}:{TUNNEL_PORT}", flush=True)
              async with server:
                  await server.serve_forever()


          asyncio.run(main())
      - path: /etc/systemd/system/java-relay.service
        content: |
          # Relays Minecraft Java (TCP 25565) to the playit tunnel, rewriting
          # the handshake hostname so playit accepts server-list pings.
          [Unit]
          Description=Minecraft Java TCP relay to playit
          After=network-online.target
          Wants=network-online.target

          [Service]
          DynamicUser=yes
          ExecStart=/usr/bin/python3 -I /usr/local/bin/java-relay.py
          Restart=always
          RestartSec=5

          [Install]
          WantedBy=multi-user.target
    runcmd:
      # Oracle's Ubuntu images ship iptables rules that reject everything but SSH.
      - iptables -I INPUT -p udp --dport 19132 -j ACCEPT
      - iptables -I INPUT -p tcp --dport 25565 -j ACCEPT
      - netfilter-persistent save
      - systemctl daemon-reload
      - systemctl enable --now bedrock-relay.service java-relay.service
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: bedrock-relay-launcher
  namespace: network
spec:
  schedule: "*/10 * * * *"
  suspend: true
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 0
      activeDeadlineSeconds: 480
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: launcher
              image: ghcr.io/oracle/oci-cli:20261014@sha256:9b13656be34c1c147e5a6d68246a01ee2a7da27ae2c132f1a22d488dfede9bbe
              command: ["bash", "/config/launch.sh"]
              env:
                - { name: HOME, value: /tmp }
                - { name: OCI_CLI_SUPPRESS_FILE_PERMISSIONS_WARNING, value: "True" }
                # Matched by display name: renaming the VM in the console
                # makes the next run launch another one.
                - { name: NAME, value: minecraft-relay }
                - { name: SHAPE, value: VM.Standard.A1.Flex }
                - { name: SHAPE_CONFIG, value: '{"ocpus":1,"memoryInGBs":6}' }
                - { name: ADS, value: "lXFQ:US-CHICAGO-1-AD-1 lXFQ:US-CHICAGO-1-AD-2 lXFQ:US-CHICAGO-1-AD-3" }
                # Canonical-Ubuntu-24.04-Minimal-aarch64-2026.09.18-0 (A1.Flex is ARM)
                - { name: IMAGE_ID, value: ocid1.image.oc1.us-chicago-1.aaaaaaaajtdmoytnv6a7ct73vcr2sdu35gic6skc4zxde7jvskaahgqtipna }
                # relay-subnet in relay-vcn
                - { name: SUBNET_ID, value: ocid1.subnet.oc1.us-chicago-1.aaaaaaaawrch3tasud77qoiweiyukyieqmngefmqc6dss6fumq6sn4xpuaia }
              # OCI_CLI_USER/TENANCY/FINGERPRINT/REGION/KEY_CONTENT (the CLI
              # needs no config file when these are set) and PUSHOVER_*.
              envFrom:
                - secretRef:
                    name: bedrock-relay-launcher-secret
              volumeMounts:
                - { name: config, mountPath: /config, readOnly: true }
                - { name: tmp, mountPath: /tmp }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 10m
                  memory: 128Mi
                limits:
                  memory: 512Mi
          volumes:
            - name: config
              configMap:
                name: bedrock-relay-launcher
            - name: tmp
              emptyDir: {}
