apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name bedrock-relay-launcher-secret
  namespace: network
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        OCI_CLI_USER: "{{ .user }}"
        OCI_CLI_TENANCY: "{{ .tenancy }}"
        OCI_CLI_FINGERPRINT: "{{ .fingerprint }}"
        OCI_CLI_REGION: "{{ .region }}"
        OCI_CLI_KEY_CONTENT: "{{ .private_key_b64 | b64dec }}"
        # The relay forwards to the home WAN IP; the SSH rule's /32 is the same address.
        HOME_WAN_IP: "{{ .ssh_source_cidr | trimSuffix \"/32\" }}"
        PUSHOVER_TOKEN: "{{ .PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
  dataFrom:
    - extract:
        key: oci-api-secret
    - extract:
        key: pushover
