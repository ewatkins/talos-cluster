apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name oci-api-secret
  namespace: network
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        OCI_CLI_USER: "{{ .user }}"
        OCI_CLI_TENANCY: "{{ .tenancy }}"
        OCI_CLI_FINGERPRINT: "{{ .fingerprint }}"
        OCI_CLI_REGION: "{{ .region }}"
        OCI_CLI_KEY_CONTENT: "{{ .private_key_b64 | b64dec }}"
  dataFrom:
    - extract:
        key: *name
