apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name playit-secret
  namespace: network
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        SECRET_KEY: "{{ .secret_key }}"
  dataFrom:
    - extract:
        key: *name
