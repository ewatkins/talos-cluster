---
# The same Oracle API key the relay launcher uses (oci-api-secret), as the
# TF_VAR_* names the OCI provider reads. ssh_source_cidr is the home /32 for
# the relay's SSH rule, kept out of this public repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name oracle-relay-secret
  namespace: oracle-relay
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        TF_VAR_tenancy_ocid: "{{ .tenancy }}"
        TF_VAR_user_ocid: "{{ .user }}"
        TF_VAR_fingerprint: "{{ .fingerprint }}"
        TF_VAR_region: "{{ .region }}"
        TF_VAR_private_key: "{{ .private_key_b64 | b64dec }}"
        TF_VAR_ssh_source_cidr: "{{ .ssh_source_cidr }}"
  dataFrom:
    - extract:
        key: oci-api-secret
