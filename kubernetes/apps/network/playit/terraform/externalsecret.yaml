---
# The same Oracle API key the relay launcher uses (oci-api-secret), keyed by
# the variable names in terraform/oracle-relay/variables.tf; the Terraform
# object loads it with varsFrom (tofu-controller refuses TF_VAR_* env vars).
# ssh_source_cidr is the home /32 for the relay's SSH rule, kept out of this
# public repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name oracle-relay-secret
  namespace: oracle-relay
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        tenancy_ocid: "{{ .tenancy }}"
        user_ocid: "{{ .user }}"
        fingerprint: "{{ .fingerprint }}"
        region: "{{ .region }}"
        private_key: "{{ .private_key_b64 | b64dec }}"
        ssh_source_cidr: "{{ .ssh_source_cidr }}"
  dataFrom:
    - extract:
        key: oci-api-secret
