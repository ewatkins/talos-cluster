---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: atlas
  namespace: network
spec:
  endpoints:
    - ip:
        address: 192.168.50.31
        port: 8100
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlas
  namespace: network
  annotations:
    external-dns.alpha.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames: ["atlas.ewatkins.dev"]
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: atlas
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: wing-node01
  namespace: network
spec:
  endpoints:
    - ip:
        address: 192.168.50.10
        port: 8080
  # Wings serves the daemon API over TLS on 8080, so the gateway has to
  # re-originate TLS rather than send cleartext. Its cert is not verifiable
  # from here, so verification is skipped on this LAN-only hop -- the same
  # treatment caspian-idrac gets.
  tls:
    insecureSkipVerify: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wing-node01
  namespace: network
  annotations:
    external-dns.alpha.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: wings
  hostnames: ["wing-node01.ewatkins.dev"]
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: wing-node01
