---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: atlas
  namespace: network
spec:
  endpoints:
    # BlueMap's web server, which runs in the Homestead server on wing-homestead.
    - ip:
        address: 192.168.50.20
        port: 8100
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: atlas
  namespace: network
  annotations:
    external-dns.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames: ["atlas.ewatkins.dev"]
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: atlas
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: wing-node01
  namespace: network
spec:
  endpoints:
    - ip:
        address: 192.168.50.20
        port: 8080
  # Wings serves the daemon API over TLS on 8080, so the gateway has to
  # re-originate TLS rather than send cleartext. Its cert is not verifiable
  # from here, so verification is skipped on this LAN-only hop -- the same
  # treatment caspian-idrac gets.
  tls:
    insecureSkipVerify: true
    # Wings offers h2 over TLS, and a websocket upgrade (the panel console)
    # cannot ride an h2 upstream -- Envoy resets it as a protocol error.
    alpnProtocols: ["http/1.1"]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: wing-node01
  namespace: network
  annotations:
    external-dns.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: wings
  # wing-homestead is the rebuilt VM's name; wing-node01 goes once the panel
  # node uses the new one (terraform/wings, WINGS.md).
  hostnames: ["wing-node01.ewatkins.dev", "wing-homestead.ewatkins.dev"]
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: wing-node01
---
apiVersion: gateway.envoyproxy.io/v1alpha1
