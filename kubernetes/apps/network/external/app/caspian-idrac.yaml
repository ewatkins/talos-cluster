---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: caspian-idrac
  namespace: network
spec:
  endpoints:
    - ip:
        address: 192.168.255.40
        port: 443
  # The iDRAC redirects every plaintext request to https://, so the gateway has
  # to re-originate TLS or the browser ends up in a redirect loop. Its cert is
  # Dell's self-signed appliance cert (CN=idrac-F4Z5282, no SAN), which cannot
  # be verified, so verification is skipped on this LAN-only hop. Clients still
  # get the gateway's *.ewatkins.dev cert.
  tls:
    insecureSkipVerify: true
    alpnProtocols: ["http/1.1"] # the iDRAC does not negotiate ALPN
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: caspian-idrac
  namespace: network
  annotations:
    external-dns.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames: ["caspian-idrac.ewatkins.dev"]
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: caspian-idrac
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: caspian-idrac-kvm
  namespace: network
spec:
  endpoints:
    - ip:
        address: 192.168.255.40
        port: 5900
  # The Remote Presence Port speaks TLS 1.2 with the same unverifiable
  # appliance cert as 443, so the same LAN-only skip applies. Leave Video
  # Encryption enabled on the iDRAC: with it off this port is plain ws://,
  # which the browser blocks as mixed content from the HTTPS console page.
  tls:
    insecureSkipVerify: true
    # Raw websocket over TLS, not h2 -- the KVM daemon negotiates no ALPN at
    # all. An empty list disables the ALPN extension; omitting the field would
    # offer the h2/http-1.1 default instead.
    alpnProtocols: []
---
# No external-dns target annotation here: caspian-idrac.ewatkins.dev is already
# published by the HTTPRoute above, and 5900 answers on that same gateway IP.
apiVersion: gateway.networking.k8s.io/v1alpha2
kind: TLSRoute
metadata:
  name: caspian-idrac-kvm
  namespace: network
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: kvm
  hostnames: ["caspian-idrac.ewatkins.dev"]
  rules:
    - backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: caspian-idrac-kvm
