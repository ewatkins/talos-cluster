---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: Backend
metadata:
  name: caspian-idrac
  namespace: network
spec:
  endpoints:
    - ip:
        address: 192.168.255.40
        port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: caspian-idrac
  namespace: network
  annotations:
    external-dns.alpha.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames: ["caspian-idrac.ewatkins.dev"]
  rules:
    - filters:
        # The iDRAC rejects any Host header it does not recognize (HTTP 400),
        # so rewrite it to the appliance's own address.
        - type: URLRewrite
          urlRewrite:
            hostname: 192.168.255.40
      backendRefs:
        - group: gateway.envoyproxy.io
          kind: Backend
          name: caspian-idrac
