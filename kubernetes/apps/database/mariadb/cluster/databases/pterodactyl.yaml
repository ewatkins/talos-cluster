apiVersion: k8s.mariadb.com/v1alpha1
kind: Database
metadata:
  name: pterodactyl
spec:
  mariaDbRef:
    name: mariadb
  characterSet: utf8mb4
  collate: utf8mb4_unicode_ci
  # Removing this object must never drop the schema; it is dropped by hand,
  # after a final dump, once Calagopus no longer uses the pterodactyl account.
  cleanupPolicy: Skip
