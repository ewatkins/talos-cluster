---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mariadb-gatus-ep
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: mariadb
        group: Infrastructure
        url: tcp://192.168.40.120:3306
        interval: 1m
        conditions: ["[CONNECTED] == true"]
        ui:
          hide-url: true
          hide-hostname: true
        alerts:
          - type: pushover
            minimum-reminder-interval: 4h
            provider-override:
              priority: 1
