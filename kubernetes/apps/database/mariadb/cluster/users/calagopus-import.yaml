---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
# Read-only account for the Calagopus importer (`default/calagopus`). It only
# ever reads the Pterodactyl database; drop it with the Pterodactyl
# decommission.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name calagopus-import-secret
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: *name
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: calagopus-import
spec:
  mariaDbRef:
    name: mariadb

  passwordSecretKeyRef:
    name: calagopus-import-secret
    key: password

  maxUserConnections: 0
