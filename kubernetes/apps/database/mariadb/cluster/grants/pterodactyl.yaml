apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: pterodactyl
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL PRIVILEGES"
  database: "*"
  table: "*"
  username: pterodactyl
  # The panel uses this account as its database host: when a server gets a
  # database it runs CREATE USER and then GRANTs that user rights on the new
  # schema, which MariaDB refuses without GRANT OPTION.
  grantOption: true
