apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: calagopus
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL PRIVILEGES"
  database: "*"
  table: "*"
  username: calagopus
  # Database host account: for each server database the panel runs CREATE
  # USER and then GRANTs that user rights on the new schema, which MariaDB
  # refuses without GRANT OPTION.
  grantOption: true
