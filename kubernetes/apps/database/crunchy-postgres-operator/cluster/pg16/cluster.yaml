---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/postgres-operator.crunchydata.com/postgrescluster_v1beta1.json
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: &name crunchy-postgres
spec:
  metadata:
    labels:
      crunchy-userinit.ramblurr.github.com/enabled: "true"
      crunchy-userinit.ramblurr.github.com/superuser: &superuser "postgres"
  postgresVersion: 16

  monitoring:
    pgmonitor:
      exporter:
        resources:
          requests:
            cpu: 10m
            memory: 64M
          limits:
            memory: 512M

  patroni: # turn on sync writes to at least 1 other replica
    dynamicConfiguration:
      synchronous_mode: true
      synchronous_mode_strict: false
      postgresql:
        max_wal_size: 5GB
        synchronous_commit: "on"
        parameters:
          max_connections: 500
          wal_keep_size: 1024  # keep 1GB of WAL locally so replicas can stream it even if archiver lags
          archive_timeout: 300  # force WAL archiving every 5 min to prevent gaps during rapid timeline switches
        pg_hba:
          - hostnossl all all 10.96.0.0/16 md5
          - hostnossl all all 10.69.0.0/16 md5
          - hostnossl all all 192.168.40.0/24 md5
          - hostssl all all all md5

  instances:
    - name: crunchy-postgres
      metadata:
        labels:
          app.kubernetes.io/name: crunchy-postgres
      replicas: &replicas 3
      # Without requests these containers get the minimum CPU weight and lose
      # every scheduling contest to co-located workloads (e.g. unmanic on tahoe,
      # which is limited to 2 cores). Starving the primary flaps the Patroni
      # readiness probe and risks an avoidable failover.
      # No CPU limits on purpose: CFS throttling would make the probe timeouts
      # it is meant to prevent strictly worse.
      resources:
        requests:
          cpu: 500m
          memory: 1Gi
        limits:
          memory: 4Gi
      sidecars:
        replicaCertCopy:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      dataVolumeClaimSpec:
        storageClassName: nfs-fast
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 2Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: "DoNotSchedule"
          labelSelector:
            matchLabels:
              postgres-operator.crunchydata.com/cluster: *name
              postgres-operator.crunchydata.com/data: postgres

  users:
    # Superuser
    - name: *superuser
      databases: ["postgres"]
      options: "SUPERUSER"
      password: &password
        type: AlphaNumeric
    # Applications
    - name: "keycloak-admin"
      databases: ["keycloak"]
      password: *password
    - name: "forgejo-admin"
      databases: ["forgejo"]
      password: *password
    - name: "gatus-admin"
      databases: ["gatus"]
      password: *password
    - name: "grafana-admin"
      databases: ["grafana"]
      password: *password
    - name: "paperless-admin"
      databases: ["paperless"]
      password: *password
    - name: "outline-admin"
      databases: ["outline"]
      password: *password
    - name: "patchmon-admin"
      databases: ["patchmon"]
      password: *password
    - name: "netbox-admin"
      databases: ["netbox"]
      password: *password
  backups:
    pgbackrest:
      configuration: &backupConfig
        - secret:
            name: crunchy-postgres-secret
      global: &backupFlag # Global
        compress-type: "bz2"
        compress-level: "9"
        # PVC
        repo1-retention-full: "30" # days
        repo1-retention-full-type: "time"
        # Garage
        repo2-block: "y"
        repo2-bundle: "y"
        repo2-path: /crunchy-pgo
        repo2-retention-full: "30" # days
        repo2-retention-full-type: "time"
        repo2-s3-uri-style: path
        # R2
        repo3-block: "y"
        repo3-bundle: "y"
        repo3-path: /crunchy-pgo
        repo3-retention-full: "7" # days
        repo3-retention-full-type: time
        repo3-s3-uri-style: path
      jobs:
        ttlSecondsAfterFinished: 300
      # The pgbackrest sidecar on each instance runs the same "server-ping"
      # liveness probe as the repo host, with the same hardcoded 1s timeout that
      # the operator does not expose for tuning. Requests are the only lever:
      # give it enough CPU weight that the ping completes under node contention.
      sidecars:
        pgbackrest:
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
        pgbackrestConfig:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      repoHost:
        # Without requests the repo host is BestEffort and gets the minimum CPU
        # weight. Under node contention "pgbackrest server-ping" misses its
        # hardcoded 1s liveness timeout and the container is killed mid-backup.
        resources:
          requests:
            cpu: 500m
            memory: 256Mi
          limits:
            memory: 2Gi
      manual:
        repoName: repo1
        options:
          - --type=full
      metadata:
        labels:
          app.kubernetes.io/name: crunchy-postgres-backup
      repos:
        - name: repo1
          volume: &nfs
            volumeClaimSpec:
              storageClassName: nfs-csi #csi-driver-nfs
              volumeName: crunchy-postgres-nfs
              accessModes: ["ReadWriteMany"]
              resources:
                requests:
                  storage: 1Mi
          schedules:
            full: "30 1 * * 0" # Sunday at 01:30
            differential: "30 1 * * 1-6" # Mon-Sat at 01:30
            incremental: "30 3-23 * * *" # Every hour except 01:30-2:30
        - name: repo2
          s3: &garage
            bucket: crunchy-pgo
            endpoint: s3-garage.ewatkins.dev
            region: us-east-1
          schedules:
            full: "15 1 * * 0" # Sunday at 01:15
            differential: "15 1 * * 1-6" # Mon-Sat at 01:15
            incremental: "15 3-23 * * *" # Every hour except 01:30-2:30
        - name: repo3
          s3: &r2
            bucket: crunchy-pgo
            endpoint: ${SECRET_R2_ENDPOINT}
            region: us-east-1 #https://developers.cloudflare.com/r2/api/s3/api/#bucket-region
          schedules:
            full: "30 2 * * 0" # Sunday at 02:30
            incremental: "30 2 * * 1-6/2" # Mon-Sat at 02:30, every 2nd day

  dataSource:
    pgbackrest:
      stanza: db
      configuration: *backupConfig
      global: *backupFlag
      repo:
        name: repo3
  # volume: *nfs
        s3: *r2

  service:
    metadata:
      annotations:
        lbipam.cilium.io/ips: ${CRUNCHY_POSTGRES}
    type: LoadBalancer

  proxy:
    pgBouncer:
      port: 5432
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
      service:
        type: LoadBalancer
        metadata:
          annotations:
            lbipam.cilium.io/ips: ${CRUNCHY_POSTGRES_PGBOUNCER}
      replicas: *replicas
      metadata:
        labels:
          app.kubernetes.io/name: crunchy-postgres-pgbouncer
      config:
        global:
          # Grafana requires session
          # Ref: https://github.com/grafana/grafana/issues/74260
          pool_mode: session
          client_tls_sslmode: prefer
          default_pool_size: "100"
          max_client_conn: "500"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              postgres-operator.crunchydata.com/cluster: *name
              postgres-operator.crunchydata.com/role: pgbouncer
