---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name crunchy-postgres-17-secret
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        CLOUDFLARE_ACCOUNT_ID: "{{ .CF_ACCOUNT_ID }}"
        # Repo numbering differs from the PG16 cluster: Garage is repo1 and R2
        # is repo2 here, since this cluster has no NFS volume repo.
        s3.conf: |
          [global]
          repo1-s3-key={{ index . "garage-accesskey" }}
          repo1-s3-key-secret={{ index . "garage-secretkey" }}
          repo2-s3-key={{ .CF_R2_CPGO_ACCESS_KEY }}
          repo2-s3-key-secret={{ .CF_R2_CPGO_SECRET_KEY }}
  dataFrom:
    - extract:
        key: crunchy-postgres-secret
    # Garage creds live in their own item
    - extract:
        key: crunchy-bucket
