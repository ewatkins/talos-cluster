---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/postgres-operator.crunchydata.com/postgrescluster_v1beta1.json
apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: &name crunchy-postgres-17
spec:
  # Generic PG17 cluster. Dispatcharr is its first tenant because it refuses
  # to start against anything below 17, but this is intended as the migration
  # target for the apps currently on the PG16 cluster.
  metadata:
    labels:
      crunchy-userinit.ramblurr.github.com/enabled: "true"
      crunchy-userinit.ramblurr.github.com/superuser: &superuser "postgres"
  postgresVersion: 17

  monitoring:
    pgmonitor:
      exporter:
        resources:
          requests:
            cpu: 10m
            memory: 64M
          limits:
            memory: 512M

  patroni:
    dynamicConfiguration:
      synchronous_mode: true
      synchronous_mode_strict: false
      postgresql:
        max_wal_size: 5GB
        synchronous_commit: "on"
        parameters:
          max_connections: 500
          wal_keep_size: 1024  # keep 1GB of WAL locally so replicas can stream it even if archiver lags
          archive_timeout: 300  # force WAL archiving every 5 min to prevent gaps during rapid timeline switches
        pg_hba:
          - hostnossl all all 10.96.0.0/16 md5
          - hostnossl all all 10.69.0.0/16 md5
          - hostnossl all all 192.168.40.0/24 md5
          - hostssl all all all md5

  instances:
    - name: instance
      replicas: &replicas 3
      # See the PG16 cluster: without requests these containers get the minimum
      # CPU weight and are starved by co-located workloads, flapping the Patroni
      # probes. Sized below PG16 to match this cluster's lighter load.
      # No CPU limits on purpose: CFS throttling would worsen the probe timeouts
      # this is meant to prevent.
      resources:
        requests:
          cpu: 250m
          memory: 512Mi
        limits:
          memory: 2Gi
      sidecars:
        replicaCertCopy:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      dataVolumeClaimSpec:
        storageClassName: openebs-hostpath
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
      walVolumeClaimSpec:
        storageClassName: openebs-hostpath
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: "kubernetes.io/hostname"
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              postgres-operator.crunchydata.com/cluster: *name
              postgres-operator.crunchydata.com/data: postgres

  # Superuser plus one entry per application. Apps migrating off the PG16
  # cluster get their user and database added here.
  users:
    - name: *superuser
      databases: ["postgres"]
      options: "SUPERUSER"
      password: &password
        type: AlphaNumeric
    - name: "dispatcharr"
      databases: ["dispatcharr"]
      password: *password
    - name: "awx"
      databases: ["awx"]
      password: *password

  backups:
    pgbackrest:
      configuration:
        - secret:
            name: crunchy-postgres-17-secret
      global:
        compress-type: "zst"
        # Garage (local S3). Shares the crunchy-pgo bucket under its own path
        # prefix so it cannot collide with the PG16 cluster's backups.
        repo1-block: "y"
        repo1-bundle: "y"
        repo1-path: /crunchy-pgo-17
        repo1-retention-full: "30"
        repo1-retention-full-type: time
        repo1-s3-uri-style: path
        # Cloudflare R2 (offsite)
        repo2-block: "y"
        repo2-bundle: "y"
        repo2-path: /crunchy-pgo-17
        repo2-retention-full: "7"
        repo2-retention-full-type: time
        repo2-s3-uri-style: path
        archive-push-queue-max: 4GiB
      jobs:
        ttlSecondsAfterFinished: 300
      # The per-instance pgbackrest sidecar runs the same "server-ping" liveness
      # probe as the repo host, with the same hardcoded 1s timeout the operator
      # does not expose. Requests are the only lever. Not scaled down with the
      # rest of this cluster: the 1s budget is fixed regardless of cluster size.
      sidecars:
        pgbackrest:
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 256Mi
        pgbackrestConfig:
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              memory: 128Mi
      repoHost:
        # See the PG16 cluster: BestEffort repo hosts get starved of CPU and
        # miss the 1s "pgbackrest server-ping" liveness timeout.
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            memory: 1Gi
      repos:
        - name: repo1
          s3:
            bucket: crunchy-pgo
            endpoint: s3-garage.ewatkins.dev
            region: us-east-1
          schedules:
            full: "0 3 * * 0" # Sunday at 03:00
            differential: "0 3 * * 1-6" # Mon-Sat at 03:00
            incremental: "30 4-23 * * *" # Hourly outside the full/diff window
        - name: repo2
          s3:
            bucket: crunchy-pgo
            endpoint: ${SECRET_R2_ENDPOINT}
            region: us-east-1
          schedules:
            full: "30 3 * * 0" # Sunday at 03:30
            incremental: "30 3 * * 1-6" # Mon-Sat at 03:30

  proxy:
    pgBouncer:
      port: 5432
      resources:
        requests:
          cpu: 25m
          memory: 64Mi
        limits:
          memory: 128Mi
      replicas: *replicas
      metadata:
        labels:
          app.kubernetes.io/name: crunchy-postgres-17-pgbouncer
      config:
        global:
          # Session pooling, matching the PG16 cluster — Grafana in particular
          # requires it.
          pool_mode: session
          client_tls_sslmode: prefer
          default_pool_size: "100"
          max_client_conn: "500"
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              postgres-operator.crunchydata.com/cluster: *name
              postgres-operator.crunchydata.com/role: pgbouncer
