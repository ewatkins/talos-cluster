---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: crunchy-postgres-backup-rules
spec:
  groups:
    - name: crunchy-postgres.backups
      rules:
        # WAL archiving is actively failing. This is the exact failure mode
        # that broke crunchy-postgres-vector for 24 days (pgBackRest version
        # skew). Uses failed-count increase rather than time-since-archive so
        # it does not false-positive on low-traffic clusters.
        - alert: CrunchyPGWALArchiveFailing
          expr: |
            increase(ccp_archive_command_status_failed_count[10m]) > 0
          for: 15m
          labels:
            severity: critical
          annotations:
            summary: >-
              WAL archiving is failing on {{ $labels.pg_cluster }}
            description: >-
              pgBackRest archive_command has logged failures over the last
              10 minutes. WAL segments will accumulate and backups will fail
              until this is resolved.

        # The most recent backup for a repo completed with an error.
        - alert: CrunchyPGBackupError
          expr: |
            ccp_backrest_last_info_backup_error > 0
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: >-
              Last {{ $labels.backup_type }} backup errored on {{ $labels.pg_cluster }} (repo {{ $labels.repo }})

        # No successful full backup in over 8 days (full is scheduled weekly).
        # Grouped per repo, not per cluster: every repo is an independent copy,
        # so a fresh repo1 must not mask a repo3 that stopped weeks ago. min()
        # only collapses the duplicate series each replica exports for a repo.
        - alert: CrunchyPGNoRecentFullBackup
          expr: |
            min by (pg_cluster, repo) (ccp_backrest_last_full_backup_time_since_completion_seconds) > 691200
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              No full backup in over 8 days on {{ $labels.pg_cluster }} repo {{ $labels.repo }}

        # Hourly-incremental repos: repo1 (NFS) and repo2 (Garage) on every
        # cluster run `* 3-23 * * *`, so 26 hours is two missed windows plus the
        # 01:30-02:30 full/diff gap. Grouped per repo for the same reason as the
        # full-backup alert above.
        - alert: CrunchyPGNoRecentIncrBackup
          expr: |
            min by (pg_cluster, repo) (ccp_backrest_last_incr_backup_time_since_completion_seconds{repo!="3"}) > 93600
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              No incremental backup in over 26 hours on {{ $labels.pg_cluster }} repo {{ $labels.repo }}

        # repo3 (Cloudflare R2, crunchy-postgres only) runs `30 2 * * 1-6/2` —
        # Mon/Wed/Fri, so the designed maximum gap is Friday 02:30 to Monday
        # 02:30, 72 hours. A 26-hour threshold here would fire every Tuesday,
        # Thursday, Saturday and Sunday. 84h leaves 12 hours of grace for a late
        # or slow run against the off-site copy.
        - alert: CrunchyPGNoRecentIncrBackupOffsite
          expr: |
            min by (pg_cluster, repo) (ccp_backrest_last_incr_backup_time_since_completion_seconds{repo="3"}) > 302400
          for: 1h
          labels:
            severity: warning
          annotations:
            summary: >-
              No off-site (R2) incremental backup in over 84 hours on {{ $labels.pg_cluster }} repo {{ $labels.repo }}
