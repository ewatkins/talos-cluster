---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name crunchy-postgres-dispatcharr-secret
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # This cluster backs up to Garage as repo1, so the keys are numbered
        # repo1-* here rather than repo2-* as in the shared cluster's secret.
        s3.conf: |
          [global]
          repo1-s3-key={{ index . "garage-accesskey" }}
          repo1-s3-key-secret={{ index . "garage-secretkey" }}
  dataFrom:
    - extract:
        key: crunchy-bucket
