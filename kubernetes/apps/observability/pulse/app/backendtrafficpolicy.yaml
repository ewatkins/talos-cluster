---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: pulse-timeout
  namespace: observability
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: pulse
  timeout:
    http:
      requestTimeout: "300s"
      # Repeats the gateway default (upstream-idle-timeout), which this replaces.
      connectionIdleTimeout: 4s
