---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app pulse
spec:
  interval: 30m
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      pulse:
        annotations:
          reloader.stakater.com/auto: "true"
        # openebs-hostpath is RWO/node-local, so avoid a second pod racing for
        # the volume during rollouts.
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/rcourtman/pulse
              tag: 6.4.5-beta.1@sha256:e23d8a4bdd77c1c2363d0c300848e69451a50f45a96ef38e24d9d64270cfc142
            env:
              TZ: America/Chicago
              FRONTEND_PORT: 7655
              BACKEND_PORT: 7655
              PULSE_PUBLIC_URL: "https://pulse.ewatkins.dev"
              OIDC_USERNAME_CLAIM: "preferred_username"
              # pulse 6.0.4 dropped the v5 OIDC_* env contract (restored in 6.0.5),
              # so show the local login form until then
              PULSE_AUTH_HIDE_LOCAL_LOGIN: "false"
            envFrom:
              - secretRef:
                  name: pulse-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: 7655
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 100Mi
              limits:
                memory: 256Mi
        serviceAccount:
          identifier: pulse
    defaultPodOptions:
      # Proxmox advertises its cluster endpoints as bare hostnames
      # (https://pve02:8006), so add the LAN domain to the search list to let
      # them resolve against the existing pve0*.ewatkins.dev records.
      dnsConfig:
        searches:
          - ewatkins.dev
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: pulse
        annotations:
          io.cilium/lb-ipam-ips: "${PULSE}"
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        ports:
          http:
            port: 7655
    serviceMonitor:
      main:
        enabled: false
        serviceName: pulse
        endpoints:
          - port: http
    ingress:
      app:
        enabled: false
    serviceAccount:
      pulse: {}
    persistence:
      pulse-data:
        enabled: true
        # SQLite (metrics.db) on NFS caused multi-second — occasionally 60s+ —
        # commit stalls that froze the monitoring loop and tripped the deadman
        # watchdog, so this lives on node-local storage.
        existingClaim: pulse-data-local
        globalMounts:
          - path: /data
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
