apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name pulse-agent-secret
  namespace: observability
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # agent:report-scoped token, kept out of pulse-secret so the server's
        # envFrom never sees it
        PULSE_TOKEN: "{{ .PULSE_AGENT_TOKEN }}"
  dataFrom:
    - extract:
        key: pulse-secret
