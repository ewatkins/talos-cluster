apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name grafana-secret
  namespace: observability
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Database Init
        # INIT_POSTGRES_DBNAME: "{{ .GRAFANA_DB }}"
        # INIT_POSTGRES_HOST: "{{ .host }}"
        # INIT_POSTGRES_USER: "{{ .GRAFANA_USER }}"
        # INIT_POSTGRES_PASS: "{{ .GRAFANA_PASS }}"
        # INIT_POSTGRES_SUPER_PASS: "{{ .password }}"

        # Grafana Config
        GF_AUTH_GENERIC_OAUTH_ENABLED: "{{ .GF_AUTH_GENERIC_OAUTH_ENABLED }}"
        GF_AUTH_GENERIC_OAUTH_NAME: "{{ .GF_AUTH_GENERIC_OAUTH_NAME }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_ID: "{{ .GF_AUTH_GENERIC_OAUTH_CLIENT_ID }}"
        GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: "{{ .GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET }}"
        GF_AUTH_GENERIC_OAUTH_SCOPES: "{{ .GF_AUTH_GENERIC_OAUTH_SCOPES }}"
        GF_AUTH_GENERIC_OAUTH_AUTH_URL: "{{ .GF_AUTH_GENERIC_OAUTH_AUTH_URL }}"
        GF_AUTH_GENERIC_OAUTH_TOKEN_URL: "{{ .GF_AUTH_GENERIC_OAUTH_TOKEN_URL }}"
        GF_AUTH_GENERIC_OAUTH_API_URL: "{{ .GF_AUTH_GENERIC_OAUTH_API_URL }}"
        GF_AUTH_SIGNOUT_REDIRECT_URL: "{{ .GF_AUTH_SIGNOUT_REDIRECT_URL }}"
        GF_AUTH_OAUTH_AUTO_LOGIN: "{{ .GF_AUTH_OAUTH_AUTO_LOGIN }}"
        GF_AUTH_DISABLE_LOGIN_FORM: "{{ .GF_AUTH_DISABLE_LOGIN_FORM }}"
        GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: "{{ .GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH }}"
        GF_AUTH_GENERIC_OAUTH_USE_PKCE: "{{ .GF_AUTH_GENERIC_OAUTH_USE_PKCE }}"
        GF_SERVER_ROOT_URL: "{{ .GF_SERVER_ROOT_URL }}"
        GF_DATABASE_SSL_MODE: "{{ .GF_DATABASE_SSL_MODE }}"
        GF_DATABASE_TYPE: "{{ .GF_DATABASE_TYPE }}"
        GF_SECURITY_ADMIN_USER: "{{ .GF_SECURITY_ADMIN_USER }}"
        GF_SECURITY_ADMIN_PASSWORD: "{{ .GF_SECURITY_ADMIN_PASSWORD }}"
  dataFrom:
    - extract:
        key: *name
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name grafana-db-secret
  namespace: observability
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Grafana DB
        GF_DATABASE_NAME: '{{ index . "dbname" }}'
        GF_DATABASE_HOST: '{{ index . "pgbouncer-host" }}'
        GF_DATABASE_USER: '{{ index . "user" }}'
        GF_DATABASE_PASSWORD: '{{ index . "password" }}'
        GF_DATABASE_PORT: '{{ index . "pgbouncer-port" }}'
  dataFrom:
    - extract:
        key: crunchy-postgres-pguser-grafana-admin
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Env for alerting/contact-points.yaml. The Pushover app token still lives on
# the alertmanager-secret Bitwarden item from before the Grafana cutover.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name grafana-alerting-secret
  namespace: observability
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        ALERTING_PUSHOVER_API_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
        ALERTING_PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
        ALERTING_HEARTBEAT_URL: "{{ .GRAFANA_HEARTBEAT_URL }}"
  dataFrom:
    - extract:
        key: alertmanager-secret
    - extract:
        key: pushover
    - extract:
        key: grafana-alerting
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Env for the OCI Logs datasource: a read-only Oracle API user for the
# minecraft-relay logs (kubernetes/apps/network/minecraft-relay).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name grafana-oci-logs-secret
  namespace: observability
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        OCI_LOGS_USER: "{{ .user }}"
        OCI_LOGS_TENANCY: "{{ .tenancy }}"
        OCI_LOGS_FINGERPRINT: "{{ .fingerprint }}"
        OCI_LOGS_REGION: "{{ .region }}"
        OCI_LOGS_PRIVATE_KEY: "{{ .private_key_b64 | b64dec }}"
  dataFrom:
    - extract:
        key: grafana-oci-logs
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
# Minecraft dashboards for the Grafana sidecar (folder Minecraft): Analytics
# (./dashboards/minecraft-relay.json), Security and Bandwidth. The
# compartment OCID they search, and the home IP, are kept out of Git and
# filled in from oci-api-secret. The files are Go templates, so a literal
# "{{" (a LogQL label_format template) is written {{`{{`}}.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name grafana-dashboard-minecraft-relay
  namespace: observability
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        labels:
          grafana_dashboard: "1"
        annotations:
          grafana_folder: Minecraft
      templateFrom:
        - configMap:
            name: grafana-dashboard-minecraft-relay
            items:
              - key: minecraft-relay.json
                templateAs: Values
              - key: minecraft-security.json
                templateAs: Values
              - key: minecraft-bandwidth.json
                templateAs: Values
  dataFrom:
    - extract:
        key: oci-api-secret
