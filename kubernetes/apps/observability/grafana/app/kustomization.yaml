---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./httproute.yaml

configMapGenerator:
  - name: grafana-alerting
    files:
      - contact-points.yaml=./alerting/contact-points.yaml
      - mute-timings.yaml=./alerting/mute-timings.yaml
      - policies.yaml=./alerting/policies.yaml
      - templates.yaml=./alerting/templates.yaml

generatorOptions:
  disableNameSuffixHash: true
  annotations:
    # $ALERTING_* is for Grafana's provisioning interpolation, not Flux.
    kustomize.toolkit.fluxcd.io/substitute: disabled
    reloader.stakater.com/match: "true"
