      - uid: 224671ad-460a-58c3-85f8-a06305662466
        title: KubeAPIErrorBudgetBurn
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: |-
                sum by (cluster) (apiserver_request:burnrate1h) > (14.40 * 0.01000)
                and on (cluster)
                sum by (cluster) (apiserver_request:burnrate5m) > (14.40 * 0.01000)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 2m
        annotations:
          description: The Kube API server is burning too much error budget on cluster {{ $labels.cluster }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeapierrorbudgetburn
          summary: The Kube API server is burning too much error budget.
        labels:
