            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          description: pgBackRest archive_command has logged failures over the last 10 minutes. WAL segments will accumulate and backups will fail until this is resolved.
