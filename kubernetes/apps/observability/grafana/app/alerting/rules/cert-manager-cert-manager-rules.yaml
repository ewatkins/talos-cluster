---
# Generated by scripts/grafana-alert-rules.sh from PrometheusRule cert-manager/cert-manager-rules.
# Do not edit by hand; change the source rule or the script and regenerate.
apiVersion: 1
groups:
  - orgId: 1
    name: cert-manager.rules
    folder: Cluster alerts
    interval: 30s
    rules:
      - uid: fa6f9ffd-df70-584e-bf0a-28618ee493e2
        title: CertManagerCertExpiringSoon
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: |-
                (
                  certmanager_certificate_expiration_timestamp_seconds - time()
                ) / clamp_min(
                  certmanager_certificate_not_after_timestamp_seconds
                    - certmanager_certificate_not_before_timestamp_seconds,
                  1
                ) < 0.1
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 1h
        annotations:
          summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is into the last 10% of its lifetime and has not been renewed
        labels:
          severity: critical
          __converted_prometheus_rule__: "true"
          grafana_shadow: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
      - uid: 2d935edd-42f5-5f34-8fe9-39e2a33a4caa
        title: CertManagerCertRenewalOverdue
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: certmanager_certificate_renewal_timestamp_seconds < time()
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 2h
        annotations:
          summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is more than 2 hours past its scheduled renewal time
        labels:
          severity: warning
          __converted_prometheus_rule__: "true"
          grafana_shadow: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
      - uid: 7b658576-477a-5310-a868-a10231a9252a
        title: CertManagerCertNotReady
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: certmanager_certificate_ready_status{condition="True"} == 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 1h
        annotations:
          summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} has not been ready for more than an hour
        labels:
          severity: critical
          __converted_prometheus_rule__: "true"
          grafana_shadow: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
      - uid: 160e588c-5b80-5a4b-b6e1-40d190665226
        title: CertManagerClusterIssuerNotReady
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: certmanager_clusterissuer_ready_status{condition="True"} == 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          summary: ClusterIssuer {{ $labels.name }} is not ready, so no certificate can be issued or renewed
        labels:
          severity: critical
          __converted_prometheus_rule__: "true"
          grafana_shadow: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
