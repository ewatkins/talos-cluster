---
# Generated by scripts/grafana-alert-rules.sh from PrometheusRule observability/kps-kubernetes-storage.
# Do not edit by hand; change the source rule or the script and regenerate.
apiVersion: 1
groups:
  - orgId: 1
    name: kubernetes-storage
    folder: Cluster alerts
    interval: 30s
    rules:
      - uid: 18c5d591-d160-5735-aa14-f104a530d95c
        title: KubePersistentVolumeFillingUp
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: |-
                (
                  kubelet_volume_stats_available_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
                    /
                  kubelet_volume_stats_capacity_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"}
                ) < 0.03
                and
                kubelet_volume_stats_used_bytes{job="kubelet", namespace=~".*", metrics_path="/metrics"} > 0
                unless on (cluster, namespace, persistentvolumeclaim)
                kube_persistentvolumeclaim_access_mode{ access_mode="ReadOnlyMany"} == 1
                unless on (cluster, namespace, persistentvolumeclaim)
                kube_persistentvolumeclaim_labels{label_excluded_from_alerts="true"} == 1
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 1m
        annotations:
          description: The PersistentVolume claimed by {{ $labels.persistentvolumeclaim }} in Namespace {{ $labels.namespace }} {{ with $labels.cluster -}} on Cluster {{ . }} {{- end }} is only {{ $value | humanizePercentage }} free.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubepersistentvolumefillingup
          summary: PersistentVolume is filling up.
        labels:
          severity: critical
          __converted_prometheus_rule__: "true"
          grafana_shadow: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
