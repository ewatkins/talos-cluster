---
# Generated by scripts/grafana-alert-rules.sh from PrometheusRule observability/kps-kubernetes-system.
# Do not edit by hand; change the source rule or the script and regenerate.
apiVersion: 1
groups:
  - orgId: 1
    name: kubernetes-system
    folder: Kubernetes
    interval: 30s
    rules:
      - uid: d73ea543-be24-520f-a58f-30b9f2f04eb1
        title: KubeVersionMismatch
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: count by (cluster) (count by (git_version, cluster) (label_replace(kubernetes_build_info{job!~"kube-dns|coredns"},"git_version","$1","git_version","(v[0-9]*.[0-9]*).*"))) > 1
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          description: There are {{ $value }} different semantic versions of Kubernetes components running on cluster {{ $labels.cluster }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeversionmismatch
          summary: Different semantic versions of Kubernetes components running.
        labels:
          severity: warning
          __converted_prometheus_rule__: "true"
          grafana_shadow: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
      - uid: ec3e5ed2-a7fd-5972-b2dd-6bf23bcab1a1
        title: KubeClientErrors
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: |-
                (sum(rate(rest_client_requests_total{job="apiserver",code=~"5.."}[5m])) by (cluster, instance, job, namespace)
                  /
                sum(rate(rest_client_requests_total{job="apiserver"}[5m])) by (cluster, instance, job, namespace))
                > 0.01
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          description: Kubernetes API server client '{{ $labels.job }}/{{ $labels.instance }}' is experiencing {{ $value | humanizePercentage }} errors on cluster {{ $labels.cluster }}.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/kubernetes/kubeclienterrors
          summary: Kubernetes API server client is experiencing errors.
        labels:
          severity: warning
          __converted_prometheus_rule__: "true"
          grafana_shadow: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
