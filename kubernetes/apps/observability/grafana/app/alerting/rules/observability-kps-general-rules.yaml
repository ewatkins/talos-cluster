---
# Generated by scripts/grafana-alert-rules.sh from PrometheusRule observability/kps-general.rules.
# Do not edit by hand; change the source rule or the script and regenerate.
apiVersion: 1
groups:
  - orgId: 1
    name: general.rules
    folder: Monitoring
    interval: 30s
    rules:
      - uid: 9e109266-07ef-5bb7-b1f6-9be251c91e1b
        title: TargetDown
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: 100 * (count(up == 0) BY (cluster, job, namespace, service) / count(up) BY (cluster, job, namespace, service)) > 10
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          description: '{{ printf "%.4g" $value }}% of the {{ $labels.job }}/{{ $labels.service }} targets in {{ $labels.namespace }} namespace are down.'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/targetdown
          summary: One or more targets are unreachable.
        labels:
          severity: warning
          __converted_prometheus_rule__: "true"
          grafana_shadow: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
      - uid: b2ca5a5a-d7a6-55e8-8be3-62a3aca77f9b
        title: Watchdog
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: vector(1)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        annotations:
          description: |
            This is an alert meant to ensure that the entire alerting pipeline is functional.
            This alert is always firing, therefore it should always be firing in Alertmanager
            and always fire against a receiver. There are integrations with various notification
            mechanisms that send a notification when this alert is not firing. For example the
            "DeadMansSnitch" integration in PagerDuty.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/general/watchdog
          summary: An alert that should always be firing to certify that Alertmanager is working properly.
        labels:
          severity: none
          __converted_prometheus_rule__: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
