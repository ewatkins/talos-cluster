# Do not edit by hand; change the source rule or the script and regenerate.
apiVersion: 1
groups:
  - orgId: 1
    name: oom
    folder: Nodes
    interval: 30s
    rules:
      - uid: cf67bf89-1986-51f6-b0b3-c1e88261367b
        title: OOMKilled
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: (kube_pod_container_status_restarts_total - kube_pod_container_status_restarts_total offset 10m >= 1) and ignoring (reason) min_over_time(kube_pod_container_status_last_terminated_reason{reason="OOMKilled"}[10m]) == 1
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        annotations:
          summary: Container {{ $labels.container }} in pod {{ $labels.namespace }}/{{ $labels.pod }} has been OOMKilled {{ $value }} times in the last 10 minutes.
        labels:
          severity: critical
          __converted_prometheus_rule__: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
