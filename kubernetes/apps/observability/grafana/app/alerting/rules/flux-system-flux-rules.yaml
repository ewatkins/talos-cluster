---
# Generated by scripts/grafana-alert-rules.sh from PrometheusRule flux-system/flux-rules.
# Do not edit by hand; change the source rule or the script and regenerate.
apiVersion: 1
groups:
  - orgId: 1
    name: flux.rules
    folder: Cluster alerts
    interval: 30s
    rules:
      - uid: 700c6900-df0f-5e99-b605-5395dcc84a7a
        title: FluxComponentAbsent
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: absent(up{job=~".*flux-system.*"} == 1)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          summary: Flux component has disappeared from Prometheus target discovery.
        labels:
          severity: critical
          __converted_prometheus_rule__: "true"
          grafana_shadow: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
      - uid: e5e8fdf4-e247-58dd-8670-e71189ac33ff
        title: FluxReconciliationFailure
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: flux_resource_info{ready="False", suspended="False"} == 1
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 15m
        annotations:
          summary: '{{ $labels.kind }} {{ $labels.exported_namespace }}/{{ $labels.name }} reconciliation has been failing for more than 15 minutes ({{ $labels.reason }}).'
        labels:
          severity: critical
          __converted_prometheus_rule__: "true"
          grafana_shadow: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
