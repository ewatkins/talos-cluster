            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: |-
                sum without (id, metrics_path, name, image, endpoint, job, node) (
