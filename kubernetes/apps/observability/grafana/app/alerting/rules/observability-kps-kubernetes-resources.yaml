      - uid: 42fa7ef2-16d0-572e-bf05-62326cbb76c7
        title: KubeQuotaAlmostFull
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: |-
                topk by (cluster, namespace, resource, resourcequota) (1,
                  max without (instance, job, type) (
                    kube_resourcequota{job="kube-state-metrics", type="used"}
                  )
                )
                / on (cluster, namespace, resource, resourcequota) group_left()
                topk by (cluster, namespace, resource, resourcequota) (1,
                  max without (instance, job, type) (
                    kube_resourcequota{job="kube-state-metrics", type="hard"}
                  ) > 0
                )
                > 0.9 < 1
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
