        title: etcdMembersDown
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: |-
                max without (endpoint) (
                  sum without (instance, pod) (up{job=~".*etcd.*"} == bool 0)
                or
                  count without (To) (
                    sum without (instance, pod) (rate(etcd_network_peer_sent_failures_total{job=~".*etcd.*"}[120s])) > 0.01
                  )
                )
                > 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 20m
        annotations:
          description: 'etcd cluster "{{ $labels.job }}": members are down ({{ $value }}).'
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/etcd/etcdmembersdown
          summary: etcd cluster members are down.
        labels:
          severity: warning
          __converted_prometheus_rule__: "true"
          grafana_shadow: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
