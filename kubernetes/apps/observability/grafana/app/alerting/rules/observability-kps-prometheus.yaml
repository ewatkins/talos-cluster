        title: PrometheusBadConfig
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 660
              to: 60
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: |-
                # Without max_over_time, failed scrapes could create false negatives, see
                # https://www.robustperception.io/alerting-on-gauges-in-prometheus-2-0 for details.
                max_over_time(prometheus_config_last_reload_successful{job="kps-prometheus",namespace="observability"}[5m]) == 0
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: prometheus_math
            queryType: math
            datasourceUid: __expr__
            model:
              refId: prometheus_math
              type: math
              expression: is_number($query) || is_nan($query) || is_inf($query)
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: prometheus_math
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 10m
        annotations:
          description: Prometheus {{$labels.namespace}}/{{$labels.pod}} has failed to reload its configuration.
          runbook_url: https://runbooks.prometheus-operator.dev/runbooks/prometheus/prometheusbadconfig
          summary: Failed Prometheus configuration reload.
        labels:
          severity: critical
          __converted_prometheus_rule__: "true"
        isPaused: false
        missing_series_evals_to_resolve: 1
