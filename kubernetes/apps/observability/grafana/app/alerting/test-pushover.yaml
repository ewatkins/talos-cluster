---
# TEMPORARY — cutover verification only. Delete once Pushover delivery from
# Grafana is confirmed.
#
# Every rule imported from Prometheus carries grafana_shadow=true, and that
# label matches the first (always-muted) route in policies.yaml, so no
# imported alert has ever reached a Pushover contact point. This rule omits
# the label deliberately so it falls through to the severity=warning route
# and proves the delivery path end to end before Phase 3. Now set to
# critical to exercise the priority-2 (emergency) contact point.
apiVersion: 1
groups:
  - orgId: 1
    name: cutover-verification
    folder: Cluster alerts
    interval: 30s
    rules:
      - uid: aaaaaaaa-0000-4000-8000-000000000001
        title: PushoverDeliveryTest
        condition: threshold
        data:
          - refId: query
            queryType: prometheus
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              refId: query
              datasource:
                type: prometheus
                uid: prometheus
              expr: vector(1)
              instant: true
              range: false
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: threshold
            queryType: threshold
            datasourceUid: __expr__
            model:
              refId: threshold
              type: threshold
              expression: query
              conditions:
                - evaluator:
                    type: gt
                    params:
                      - 0
        noDataState: OK
        execErrState: OK
        for: 0s
        annotations:
          summary: Pushover delivery test from Grafana alerting.
          description: >-
            Temporary rule verifying that Grafana-managed alerts reach Pushover
            before the Alertmanager cutover. If you are reading this on your
            phone, the delivery path works and the rule can be removed.
        labels:
          severity: critical
