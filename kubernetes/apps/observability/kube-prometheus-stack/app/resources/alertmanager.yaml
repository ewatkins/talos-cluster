---
global:
  resolve_timeout: 5m
route:
  group_by: ["alertname", "job"]
  group_interval: 10m
  group_wait: 1m
  receiver: pushover
  repeat_interval: 12h
  routes:
    - receiver: heartbeat
      group_interval: 5m
      group_wait: 0s
      matchers:
        - alertname = "Watchdog"
      repeat_interval: 5m
    - receiver: "null"
      matchers:
        - alertname = "InfoInhibitor"
    # Informational alerts are for dashboards, not for a phone at 03:00.
    - receiver: "null"
      matchers:
        - severity = "info"
    # Severity-homogeneous routes: the pushover priority template below reads
    # .CommonLabels.severity, which is only reliable when every alert in the
    # group shares one severity.
    - receiver: pushover
      matchers:
        - severity = "critical"
      repeat_interval: 4h
    - receiver: pushover
      matchers:
        - severity = "warning"
      repeat_interval: 12h
inhibit_rules:
  - equal: ["alertname", "namespace"]
    source_matchers:
      - severity = "critical"
    target_matchers:
      - severity = "warning"
  # A node going down (including every tuppr rolling upgrade) takes its
  # node-scoped alerts with it. Only suppresses alerts that carry a `node`
  # label; pod-scoped alerts do not have one and still notify.
  - equal: ["node"]
    source_matchers:
      - alertname = "KubeNodeNotReady"
    target_matchers:
      - alertname != "KubeNodeNotReady"
      - severity =~ "critical|warning"
receivers:
  - name: heartbeat
    webhook_configs:
      - send_resolved: true
        url: "{{ .ALERTMANAGER_HEARTBEAT_URL }}"
  - name: "null"
  - name: pushover
    pushover_configs:
      - html: true
        message: |-
          {{ "{{-" }} range .Alerts {{ "}}" }}
            {{ "{{-" }} if ne .Annotations.description "" {{ "}}" }}
              {{ "{{" }} .Annotations.description {{ "}}" }}
            {{ "{{-" }} else if ne .Annotations.summary "" {{ "}}" }}
              {{ "{{" }} .Annotations.summary {{ "}}" }}
            {{ "{{-" }} else if ne .Annotations.message "" {{ "}}" }}
              {{ "{{" }} .Annotations.message {{ "}}" }}
            {{ "{{-" }} else {{ "}}" }}
              Alert description not available
            {{ "{{-" }} end {{ "}}" }}
            {{ "{{-" }} if gt (len .Labels.SortedPairs) 0 {{ "}}" }}
              <small>
              {{ "{{-" }} range .Labels.SortedPairs {{ "}}" }}
                <b>{{ "{{" }} .Name {{ "}}" }}:</b> {{ "{{" }} .Value {{ "}}" }}
              {{ "{{-" }} end {{ "}}" }}
              </small>
            {{ "{{-" }} end {{ "}}" }}
          {{ "{{-" }} end {{ "}}" }}
        # Emergency (2) for critical so Pushover retries until acknowledged;
        # retry/expire are required by the Pushover API at that priority and are
        # ignored at every other one.
        priority: |-
          {{ "{{" }} if eq .Status "resolved" {{ "}}" }}-1{{ "{{" }} else if eq .CommonLabels.severity "critical" {{ "}}" }}2{{ "{{" }} else if eq .CommonLabels.severity "warning" {{ "}}" }}0{{ "{{" }} else {{ "}}" }}-1{{ "{{" }} end {{ "}}" }}
        retry: 5m
        expire: 1h
        send_resolved: true
        sound: gamelan
        title: >-
          [{{ "{{" }} .Status | toUpper {{ "}}" }}{{ "{{" }} if eq .Status "firing" {{ "}}" }}:{{ "{{" }} .Alerts.Firing | len {{ "}}" }}{{ "{{" }} end {{ "}}" }}]
          {{ "{{" }} .CommonLabels.alertname {{ "}}" }}
        token: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
        url_title: View in Alertmanager
        user_key: "{{ .PUSHOVER_USER_KEY }}"
