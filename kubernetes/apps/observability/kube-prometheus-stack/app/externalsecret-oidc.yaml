---
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/external-secrets.io/externalsecret_v1beta1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name alertmanager-oidc-secret
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Consumed by the alertmanager-oidc SecurityPolicy. Kept separate from
        # alertmanager-secret so a render failure here cannot break the
        # Alertmanager config secret and take down alerting.
        client-secret: "{{ .ALERTMANAGER_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: alertmanager-secret
