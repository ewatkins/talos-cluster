---
# Push-only, LAN-only route into Loki for log shippers outside the cluster
# (Alloy on wing-proxy, terraform/wings). Loki runs without auth, so
# nothing else (queries, rules, admin) is routed.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: loki-push
  namespace: observability
  annotations:
    external-dns.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - "loki.ewatkins.dev"
  rules:
    - matches:
        - method: POST
          path:
            type: Exact
            value: /loki/api/v1/push
      backendRefs:
        - name: loki
          port: 3100
