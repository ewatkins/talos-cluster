---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name nodecast-tv-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # server/auth.js falls back to the literal string
        # 'nodecast-tv-secret-key-change-in-production' when this is unset, and
        # that constant is public in the upstream repo. Anyone who can reach the
        # internal gateway could forge an admin JWT with it. Any long random
        # string works; rotating it just invalidates existing 24h sessions.
        #
        # It doubles as the express-session secret (server/index.js), which is
        # what carries OIDC state across the Keycloak round trip.
        JWT_SECRET: "{{ .JWT_SECRET }}"
        # Keycloak client secret for the `nodecast` client. SSO stays silently
        # off if this is missing — configureOidcStrategy() logs "OIDC
        # configuration missing - SSO disabled" and returns.
        OIDC_CLIENT_SECRET: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: *name
