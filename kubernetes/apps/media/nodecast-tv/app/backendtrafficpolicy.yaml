---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: nodecast-tv-timeout
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: nodecast-tv
  timeout:
    http:
      # /api/remux pipes ffmpeg's stdout straight into the response
      # (server/routes/remux.js), so watching a channel is one HTTP request held
      # open for the whole session. Envoy's 15s default would cut playback at 15
      # seconds. Same reasoning — and same value — as Dispatcharr's own policy.
      requestTimeout: "0s"
