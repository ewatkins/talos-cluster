---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app nodecast-tv
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/media
  # Reads Dispatcharr's /output/m3u and /output/epg, and proxies every stream
  # back out of Dispatcharr's /proxy/ts endpoint. Useless without it.
  dependsOn:
    - name: dispatcharr
  wait: false
  path: ./kubernetes/apps/media/nodecast-tv/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: tv
