---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name bookorbit-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        # Encrypts stored podcast feed URLs; must stay independent of JWT_SECRET.
        PODCAST_ENCRYPTION_KEY: "{{ .podcast_encryption_key }}"
        # Gates the one-time /auth/setup call that creates the first admin.
        SETUP_BOOTSTRAP_TOKEN: "{{ .setup_bootstrap_token }}"
        # Encrypts stored SMTP credentials; changing it later leaves them
        # undecryptable.
        EMAIL_ENCRYPTION_KEY: "{{ .email_encryption_key }}"
  dataFrom:
    - extract:
        key: *name
---
# Database credentials come from the operator-generated pguser secret on the
# PG17 cluster, via pgbouncer (session pooling).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name bookorbit-db-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        POSTGRES_HOST: '{{ index . "pgbouncer-host" }}'
        POSTGRES_PORT: '{{ index . "pgbouncer-port" }}'
        POSTGRES_USER: '{{ index . "user" }}'
        POSTGRES_PASSWORD: '{{ index . "password" }}'
        POSTGRES_DB: '{{ index . "dbname" }}'
  dataFrom:
    - extract:
        key: crunchy-postgres-17-pguser-bookorbit
