---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dispatcharr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      dispatcharr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.28.2
            env: &env
              # Modular mode: Postgres and Redis are external, and Celery runs
              # as its own container rather than being bundled by the AIO image.
              DISPATCHARR_ENV: modular
              DISPATCHARR_PORT: &port 9191
              DISPATCHARR_LOG_LEVEL: info
              REDIS_HOST: dragonfly.database.svc.cluster.local
              REDIS_PORT: "6379"
              TZ: "${TIMEZONE}"
            envFrom: &envFrom
              - secretRef:
                  name: dispatcharr-db-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 4Gi
          # Background worker for EPG refresh, stream checks and other periodic
          # tasks. Same image, different entrypoint, shares the /data volume.
          celery:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.28.2
            command: ["/app/docker/entrypoint.celery.sh"]
            env:
              DISPATCHARR_ENV: modular
              DISPATCHARR_PORT: *port
              DISPATCHARR_LOG_LEVEL: info
              REDIS_HOST: dragonfly.database.svc.cluster.local
              REDIS_PORT: "6379"
              TZ: "${TIMEZONE}"
              DJANGO_SETTINGS_MODULE: dispatcharr.settings
              PYTHONUNBUFFERED: "1"
            envFrom: *envFrom
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 2Gi
        pod:
          securityContext:
            fsGroup: 1000
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: dispatcharr
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: dispatcharr-data
        advancedMounts:
          dispatcharr:
            app:
              - path: /data
            celery:
              - path: /data
