---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app dispatcharr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      dispatcharr:
        annotations:
          reloader.stakater.com/auto: "true"
        # dispatcharr-data and teamarr-data are both ReadWriteOnce, so a second
        # pod could never mount them alongside the first. Recreate is
        # app-template's default for a Deployment; it is spelled out here so it
        # does not get switched to RollingUpdate.
        strategy: Recreate
        containers:
          app:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.30.0
            env: &env
              # Modular mode: Postgres and Redis are external, and Celery runs
              # as its own container rather than being bundled by the AIO image.
              DISPATCHARR_ENV: modular
              DISPATCHARR_PORT: &port 9191
              DISPATCHARR_LOG_LEVEL: info
              REDIS_HOST: dragonfly.database.svc.cluster.local
              REDIS_PORT: "6379"
              # Dragonfly db0 is shared (paperless, forgejo, patchmon,
              # thanos). Paperless also runs Celery there, and two Celery apps
              # on one database consume each other's task queues. Keep
              # Dispatcharr on its own index.
              REDIS_DB: "5"
              TZ: "${TIMEZONE}"
              # The nfs-slow mount presents as 99:100, and the container cannot
              # chown it. Run as that owner instead of the image default 1000.
              PUID: "99"
              PGID: "100"
            envFrom: &envFrom
              - secretRef:
                  name: dispatcharr-db-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 2Gi
          # Background worker for EPG refresh, stream checks and other periodic
          # tasks. Same image, different entrypoint, shares the /data volume.
          celery:
            image:
              repository: ghcr.io/dispatcharr/dispatcharr
              tag: 0.30.0
            command: ["/app/docker/entrypoint.celery.sh"]
            env:
              DISPATCHARR_ENV: modular
              DISPATCHARR_PORT: *port
              DISPATCHARR_LOG_LEVEL: info
              REDIS_HOST: dragonfly.database.svc.cluster.local
              REDIS_PORT: "6379"
              # Dragonfly db0 is shared (paperless, forgejo, patchmon,
              # thanos). Paperless also runs Celery there, and two Celery apps
              # on one database consume each other's task queues. Keep
              # Dispatcharr on its own index.
              REDIS_DB: "5"
              TZ: "${TIMEZONE}"
              PUID: "99"
              PGID: "100"
              DJANGO_SETTINGS_MODULE: dispatcharr.settings
              PYTHONUNBUFFERED: "1"
            envFrom: *envFrom
            resources:
              requests:
                cpu: 25m
                memory: 256Mi
              limits:
                memory: 2Gi
          # ---------------------------------------------------------------
          # Co-located tools. These three were pulled into this pod to share
          # gluetun's network namespace. The tunnel is gone, but they stay
          # here: their Services and the M3U/EPG URLs stored in Dispatcharr's
          # database are built around this layout. See ../tools/README.md.
          #
          # Every container below still shares one network namespace, so ports
          # must be unique pod-wide. Already taken: 5656 + 8001 + 9999
          # (Dispatcharr internals) and 9191 (Dispatcharr). Two tools defaulted
          # to :3000 and were moved via their PORT env; their Services keep
          # port 3000 and retarget, so every URL stored in Dispatcharr's
          # database still resolves. Those moves stay as they are — undoing
          # them would rewrite URLs that are not in Git.
          #
          # Mind the ports a container binds beyond the one it serves: this bit
          # once, when webpage-hls's embedded WeatherStar on WS4KP_PORT
          # defaulted onto a port another container already held and
          # crashlooped it. Check the live listeners after adding anything
          # here, not just the Service:
          #   kubectl -n media exec deploy/dispatcharr -c app -- \
          #     grep " 0A " /proc/net/tcp /proc/net/tcp6
          # ---------------------------------------------------------------
          teamarr:
            image:
              repository: ghcr.io/pharaoh-labs/teamarr
              tag: 2.14.0@sha256:ee37f784fdaca84e8236c1c524273631c3257cb5c80817a1b317607ee3da8237
            env:
              TZ: "${TIMEZONE}"
              PORT: &teamarrPort 9195
              LOG_LEVEL: INFO
            probes:
              liveness: &teamarrProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *teamarrPort
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *teamarrProbes
            securityContext: &nfsUser
              # nfs-slow presents as 99:100 and cannot be chowned from the
              # container. Set per-container rather than pod-wide, because
              # Dispatcharr's own image starts as root and drops to PUID/PGID
              # itself.
              runAsUser: 99
              runAsGroup: 100
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
          webpage-hls:
            image:
              repository: ghcr.io/sethwv/ws4kp-to-hls
              tag: latest@sha256:a4347e3168696e4419cd6bc1e6525139b6d48217a3a5fa10fa2e4ac8ce13048b
            # Renders a webpage with a headless browser, hence the larger memory
            # limit and the writable cache dirs.
            env:
              TZ: "${TIMEZONE}"
              PORT: &hlsPort 3001
              # This image runs a *second* server: an embedded WeatherStar
              # 4000+ on WS4KP_PORT, which is the page it screenshots. The
              # image bakes that to 8080, which collided with another
              # container when this pod was busier; it stays moved because
              # nothing external references it. index.js uses this both to
              # listen and to build the http://localhost:<port> URL it renders.
              WS4KP_PORT: 8081
              DEFAULT_FPS: "30"
              SCREENSHOT_FORMAT: jpeg
              SCREENSHOT_QUALITY: "95"
              XDG_CONFIG_HOME: /tmp
              XDG_CACHE_HOME: /tmp
            probes:
              liveness: &hlsProbes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    # / returns 404 by design; /health is the real endpoint.
                    path: /health
                    port: *hlsPort
                  initialDelaySeconds: 60
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *hlsProbes
            resources:
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 2Gi
          game-thumbs:
            image:
              repository: ghcr.io/sethwv/game-thumbs
              tag: v2.2.0@sha256:7ffa6b25d43133ef760a357b6e66b93b04f80b509774a396e421bfba28b27ff3
            env:
              TZ: "${TIMEZONE}"
              # Image ships PORT=3000; src/index.js reads process.env.PORT.
              PORT: &thumbsPort 3002
            probes:
              liveness: &thumbsProbes
                enabled: true
                custom: true
                spec:
                  # This app answers 444 on every path except /health, so a
                  # socket check is the conservative option.
                  tcpSocket:
                    port: *thumbsPort
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *thumbsProbes
            resources:
              requests:
                cpu: 10m
                memory: 128Mi
              limits:
                memory: 512Mi
        pod:
          securityContext:
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
    # One Service per tool, all selecting this single pod. Every one carries
    # forceRename: with more than one service defined, app-template would
    # otherwise name them dispatcharr-<identifier> and break both the
    # HTTPRoutes and the M3U/EPG URLs stored in Dispatcharr's database.
    #
    # The two tools whose container ports moved keep their published port at
    # 3000 and retarget it, so no consumer sees a change.
    service:
      app:
        controller: dispatcharr
        forceRename: dispatcharr
        ports:
          http:
            port: *port
      # Dedicated LAN address for XC clients that cannot use the gateway.
      # dispatcharr.ewatkins.dev exists only in internal DNS, and set-top boxes
      # routinely ignore DHCP-supplied resolvers or force DoH, which leaves them
      # unable to find it at all; a literal IP sidesteps name resolution.
      #
      # Only 9191 is published; the tools keep their own ClusterIP Services.
      #
      # Plain HTTP, so XC credentials cross the LAN in the query string. That is
      # the trade for clients with no working DNS or TLS trust store.
      lan:
        controller: dispatcharr
        forceRename: dispatcharr-lan
        type: LoadBalancer
        externalTrafficPolicy: Cluster
        annotations:
          io.cilium/lb-ipam-ips: 192.168.40.101
        ports:
          http:
            port: *port
      teamarr:
        controller: dispatcharr
        forceRename: teamarr
        ports:
          http:
            port: *teamarrPort
      webpage-hls:
        controller: dispatcharr
        forceRename: webpage-hls
        ports:
          http:
            port: 3000
            targetPort: *hlsPort
      game-thumbs:
        controller: dispatcharr
        forceRename: game-thumbs
        ports:
          http:
            port: 3000
            targetPort: *thumbsPort
    persistence:
      data:
        existingClaim: dispatcharr-data
        advancedMounts:
          dispatcharr:
            app:
              - path: /data
            celery:
              - path: /data
      # The tool claims stay defined in their own directories under ../tools/,
      # so they remain owned by their original Flux Kustomization. nfs-slow
      # reclaims Delete, and moving a PVC between Kustomizations risks the old
      # one pruning it before the new one adopts it.
      teamarr-data:
        existingClaim: teamarr-data
        advancedMounts:
          dispatcharr:
            teamarr:
              - path: /app/data
      webpage-hls-cache:
        type: emptyDir
        advancedMounts:
          dispatcharr:
            webpage-hls:
              - path: /tmp
              - path: /streaming-app/cache
              - path: /home/node/.cache
      game-thumbs-cache:
        type: emptyDir
        advancedMounts:
          dispatcharr:
            game-thumbs:
              - path: /app/.cache
