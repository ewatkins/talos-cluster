---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dispatcharr-db-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        POSTGRES_DB: '{{ index . "dbname" }}'
        POSTGRES_HOST: '{{ index . "pgbouncer-host" }}'
        POSTGRES_PORT: '{{ index . "pgbouncer-port" }}'
        POSTGRES_USER: '{{ index . "user" }}'
        POSTGRES_PASSWORD: '{{ index . "password" }}'
  dataFrom:
    - extract:
        key: crunchy-postgres-17-pguser-dispatcharr
---
# Dispatcharr API key (Settings → API Keys) for in-cluster automation such as
# ./iptv-host-failover.yaml.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dispatcharr-api-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # A Dispatcharr API key (Settings → API Keys). Dispatcharr authenticates
        # these with the `X-API-Key` header — *not* `Authorization: Bearer`,
        # which returns 401 token_not_valid because that path expects a JWT
        # from /api/accounts/token/.
        DISPATCHARR_API_KEY: "{{ .DISPATCHARR_API_KEY }}"
  dataFrom:
    - extract:
        key: *name
