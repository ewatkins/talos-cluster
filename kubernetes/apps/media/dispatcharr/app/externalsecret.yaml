---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dispatcharr-db-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        POSTGRES_DB: '{{ index . "dbname" }}'
        POSTGRES_HOST: '{{ index . "pgbouncer-host" }}'
        POSTGRES_PORT: '{{ index . "pgbouncer-port" }}'
        POSTGRES_USER: '{{ index . "user" }}'
        POSTGRES_PASSWORD: '{{ index . "password" }}'
  dataFrom:
    - extract:
        key: crunchy-postgres-17-pguser-dispatcharr
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name gluetun-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Privado OpenVPN credentials — these are the ones from the Privado
        # dashboard under "Manual Configuration", not the email and password
        # used to sign in to the website.
        OPENVPN_USER: "{{ .OPENVPN_USER }}"
        OPENVPN_PASSWORD: "{{ .OPENVPN_PASSWORD }}"
        # Keycloak client secret for the VPN UI's SecurityPolicy. Envoy Gateway
        # requires this exact key name for oidc.clientSecret.
        client-secret: "{{ .CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: *name
