---
# Dispatcharr's auto channel sync owns one imported group, recreating its
# channels as the upstream provider rotates what it carries. It writes the
# provider's raw stream names straight onto the channels, which arrive padded
# and delimiter-separated:
#
#   NAME  | 12 - some trailing detail
#
# Renames made afterwards *do* survive a refresh — verified against a live
# refresh of the account — so this tidies them back up on a schedule rather
# than rebuilding the channels. That distinction matters: deleting and
# recreating them would mint new UUIDs, and the stream URLs in /output/m3u are
# built from those, so every client would need a re-sync on every run.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name dispatcharr-api-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # A Dispatcharr API key (Settings → API Keys). Dispatcharr authenticates
        # these with the `X-API-Key` header — *not* `Authorization: Bearer`,
        # which returns 401 token_not_valid because that path expects a JWT
        # from /api/accounts/token/.
        DISPATCHARR_API_KEY: "{{ .DISPATCHARR_API_KEY }}"
  dataFrom:
    - extract:
        key: *name
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatcharr-name-normalizer
  namespace: media
data:
  normalize-names.py: |
    #!/usr/bin/env python3
    """Tidy auto-synced channel names in one Dispatcharr channel group.

    Rewrites "PREFIX  | 07 - trailing detail" as "PREFIX 07 · trailing detail",
    collapsing the padding the provider ships and zero-padding the slot number.
    Separator entries the provider injects as pseudo-channels are skipped, as
    are names matching neither shape.

    Clock times in the trailing detail are shifted from the provider's Eastern
    listings to local Central and tagged "CT". That tag doubles as the guard
    that keeps this idempotent - an already-tagged time is left alone, so a
    re-run cannot walk the clock back an hour at a time.

    Already-tidy names are re-examined too, so a change to the time handling
    reaches channels a previous run normalised. Anything renamed by hand past
    the "PREFIX NN · detail" shape is left untouched.
    """
    import json, os, re, sys, urllib.request

    BASE  = os.environ.get("DISPATCHARR_URL",
                           "http://dispatcharr.media.svc.cluster.local:9191")
    KEY   = os.environ.get("DISPATCHARR_API_KEY") or sys.exit("DISPATCHARR_API_KEY not set")
    GROUP = int(os.environ.get("CHANNEL_GROUP_ID", "1859"))

    RAW = re.compile(
        r'^(?P<prefix>.+?)\s*\|\s*(?P<slot>\d{1,2}|4[kK])\s*-\s*(?P<rest>.*)$')
    TIDY = re.compile(
        r'^(?P<prefix>.+?)\s+(?P<slot>\d{2}|4K)(?:\s*·\s*(?P<rest>.*))?$')
    TIME = re.compile(r'\b(\d{1,2})(?::(\d{2}))?\s*(am|pm)\b', re.I)

    def shift(rest):
        """Eastern -> Central. An already-tagged time is returned unchanged."""
        if not rest or re.search(r'\bCT\b', rest):
            return rest
        def sub(m):
            h, mnt, ap = int(m.group(1)), m.group(2), m.group(3).lower()
            h24 = ((h % 12) + (12 if ap == "pm" else 0) - 1) % 24
            ap2 = "am" if h24 < 12 else "pm"
            h12 = h24 % 12 or 12
            return f"{h12}:{mnt}{ap2} CT" if mnt else f"{h12}{ap2} CT"
        return TIME.sub(sub, rest)

    def api(path, method="GET", payload=None):
        data = json.dumps(payload).encode() if payload is not None else None
        req = urllib.request.Request(BASE + path, data=data, method=method,
                                     headers={"X-API-Key": KEY,
                                              "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=30) as r:
            body = r.read()
        return json.loads(body) if body else {}

    def clean(name):
        n = " ".join(name.split())
        if n.startswith("#"):          # separator entry, not a real channel
            return None
        m = RAW.match(n)
        if m:
            slot = m.group("slot")
            slot = "4K" if slot.lower() == "4k" else f"{int(slot):02d}"
            rest = shift(m.group("rest").strip())
            out = f"{m.group('prefix')} {slot}"
            return f"{out} · {rest}" if rest else out
        m = TIDY.match(n)
        if m:                          # already tidy: re-check the time only
            rest = shift((m.group("rest") or "").strip())
            out = f"{m.group('prefix')} {m.group('slot')}"
            return f"{out} · {rest}" if rest else out
        return None                    # unrecognised: leave alone

    def main():
        chans = api("/api/channels/channels/?page_size=500")
        chans = chans["results"] if isinstance(chans, dict) else chans
        renamed = skipped = 0
        for c in chans:
            if c.get("channel_group_id") != GROUP:
                continue
            new = clean(c["name"])
            if new is None or new == c["name"]:
                skipped += 1
                continue
            api(f"/api/channels/channels/{c['id']}/", "PATCH", {"name": new})
            print(f"  {int(c['channel_number'])}  {c['name']!r} -> {new!r}")
            renamed += 1
        print(f"renamed {renamed}, unchanged {skipped}")

    if __name__ == "__main__":
        main()
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dispatcharr-name-normalizer
  namespace: media
spec:
  # Suspended 2026-09-21: teamarr now owns NFL Sunday Ticket. Its "NFL Sunday
  # Ticket" event group matches the US| NFL PPV feeds to real games and creates
  # per-game channels, named "Away at Home", in this same channel group (1859).
  # Dispatcharr's auto channel sync for the group is off and its channels were
  # deleted, so there is nothing left for this to tidy — and running it would
  # rename teamarr's channels. To go back: re-enable auto sync on the group,
  # drop teamarr's NFL group, and unsuspend.
  suspend: true
  # Midnight local. The account's own 24h refresh runs earlier in the evening,
  # so the day's rotation has already landed by the time this tidies it.
  schedule: "0 0 * * *"
  timeZone: America/Chicago
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: normalize
              # Stdlib only (urllib/json/re), so the plain upstream image is
              # enough — no pip install step and nothing to vendor.
              image: docker.io/library/python:3.13-alpine
              command: ["python3", "/scripts/normalize-names.py"]
              envFrom:
                - secretRef:
                    name: dispatcharr-api-secret
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 10m
                  memory: 64Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: scripts
              configMap:
                name: dispatcharr-name-normalizer
