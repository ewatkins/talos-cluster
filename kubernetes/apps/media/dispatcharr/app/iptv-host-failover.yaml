---
# Some IPTV providers serve one account from several interchangeable server
# hostnames (same login, same stream IDs). Dispatcharr stores one server_url
# per account and its failover only moves between *different streams*, so if
# the account's host dies every stream from that account fails at once.
#
# Editing server_url is not an option: stream identity is hashed on the URL
# (stream_settings.m3u_hash_key = "url"), so a host change makes the next
# refresh treat every stream as new and silently drops the backup streams
# attached to channels. Instead this rewrites the host at play time through the
# account's default profile (search ^https?://[^/]+ → active host), leaving the
# stored URLs untouched.
#
# The alternate hosts live in Dispatcharr, not here: add *disabled* profiles
# named "Failover 1", "Failover 2", … to an XC account, each with search
# ^https?://[^/]+ and replace set to one alternate host (e.g. http://host:80).
# Disabled profiles are never used for streaming. Any account with at least one
# such profile is managed; order follows the number in the name.
#
# Every run: if the primary (server_url) answers player_api with auth=1, use it
# (identity pattern). Otherwise keep the current alternate if it is healthy, or
# move to the first healthy alternate in order. A default profile carrying any
# other custom pattern is left alone. The check is a login, not a stream — it
# spends none of the account's connections.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatcharr-host-failover
  namespace: media
  annotations:
    # "$1" in the script is a regex backreference, not a Flux variable.
    kustomize.toolkit.fluxcd.io/substitute: disabled
data:
  host-failover.py: |
    #!/usr/bin/env python3
    """Point each XC account's default profile at a working server host."""
    import json
    import os
    import re
    import sys
    import urllib.parse
    import urllib.request

    API = os.environ.get("DISPATCHARR_URL", "http://dispatcharr.media.svc.cluster.local:9191").rstrip("/")
    KEY = os.environ["DISPATCHARR_API_KEY"]
    UA = "TiviMate/4.7.0"
    HOST_PATTERN = "^https?://[^/]+"
    IDENTITY = ("^(.*)$", "$1")
    FAILOVER = re.compile(r"^failover\s*(\d+)$", re.I)


    def api(method, path, body=None):
        data = json.dumps(body).encode() if body is not None else None
        req = urllib.request.Request(f"{API}{path}", data=data, method=method,
                                     headers={"X-API-Key": KEY, "Content-Type": "application/json"})
        with urllib.request.urlopen(req, timeout=30) as resp:
            return json.load(resp)


    def healthy(host, user, password):
        q = urllib.parse.urlencode({"username": user, "password": password})
        reason = "auth != 1"
        for _ in range(2):
            try:
                req = urllib.request.Request(f"{host}/player_api.php?{q}", headers={"User-Agent": UA})
                with urllib.request.urlopen(req, timeout=10) as resp:
                    if str(json.load(resp).get("user_info", {}).get("auth")) == "1":
                        return True
            except Exception as exc:  # noqa: BLE001 - any failure means unhealthy
                reason = f"{type(exc).__name__}: {exc}"[:80]
        print(f"  {host}: unhealthy ({reason})")
        return False


    def run(acct):
        name, aid = acct["name"], acct["id"]
        profiles = api("GET", f"/api/m3u/accounts/{aid}/profiles/")
        profiles = profiles.get("results", profiles) if isinstance(profiles, dict) else profiles
        default = next((p for p in profiles if p.get("is_default")), None)
        alternates = sorted(
            ((int(m.group(1)), (p.get("replace_pattern") or "").rstrip("/"))
             for p in profiles
             if (m := FAILOVER.match(p.get("name") or "")) and p.get("search_pattern") == HOST_PATTERN
             and p.get("replace_pattern")),
        )
        alternates = [host for _, host in alternates]
        if not alternates:
            return True
        if default is None:
            print(f"{name}: no default profile; skipping")
            return True

        detail = api("GET", f"/api/m3u/accounts/{aid}/")
        primary = (detail.get("server_url") or "").rstrip("/")
        user, password = detail.get("username"), detail.get("password")
        pattern = (default.get("search_pattern") or "", default.get("replace_pattern") or "")
        if pattern == IDENTITY:
            active = primary
        elif pattern[0] == HOST_PATTERN:
            active = pattern[1].rstrip("/")
        else:
            print(f"{name}: default profile has a custom pattern {pattern!r}; not touching it")
            return True

        def point(host):
            new = IDENTITY if host == primary else (HOST_PATTERN, host)
            api("PATCH", f"/api/m3u/accounts/{aid}/profiles/{default['id']}/",
                {"search_pattern": new[0], "replace_pattern": new[1]})
            print(f"{name}: SWITCHED {active} -> {host}")

        if healthy(primary, user, password):
            if active != primary:
                point(primary)
            else:
                print(f"{name}: primary healthy ({len(alternates)} alternates standing by)")
            return True
        if active != primary and healthy(active, user, password):
            print(f"{name}: primary down, staying on {active}")
            return True
        for host in alternates:
            if host != active and healthy(host, user, password):
                point(host)
                return True
        print(f"{name}: NO HEALTHY HOST (primary and all {len(alternates)} alternates failed)")
        return False


    if __name__ == "__main__":
        accounts = api("GET", "/api/m3u/accounts/")
        accounts = accounts.get("results", accounts) if isinstance(accounts, dict) else accounts
        results = [run(a) for a in accounts if a.get("account_type") == "XC" and a.get("is_active", True)]
        sys.exit(0 if all(results) else 1)
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: dispatcharr-host-failover
  namespace: media
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      backoffLimit: 0
      template:
        spec:
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534
            runAsGroup: 65534
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: failover
              # Stdlib only; no pip install step and nothing to vendor.
              image: docker.io/library/python:3.13-alpine
              command: ["python3", "/scripts/host-failover.py"]
              envFrom:
                - secretRef:
                    name: dispatcharr-api-secret
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities: { drop: ["ALL"] }
              resources:
                requests:
                  cpu: 10m
                  memory: 32Mi
                limits:
                  memory: 128Mi
          volumes:
            - name: scripts
              configMap:
                name: dispatcharr-host-failover
