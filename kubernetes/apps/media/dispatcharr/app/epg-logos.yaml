---
# Guide feed for Jellyfin (Service "dispatcharr-epg-logos", :9291).
#
# Jellyfin's "On Now" / Home Screen Sections Live TV cards show only the
# programme's own image, so most of them were blank placeholders (live sports
# and news carry no art) or show art that says nothing about the channel. This
# serves Dispatcharr's own /output/epg with each programme's <icon> pointed at
# the channel's logo, pre-composed onto a black 16:9 canvas with a margin
# (GET /logo/<dispatcharr logo id>.png), so the cards read as channels and
# need no per-card CSS padding.
#
# Two kinds of programme keep their own image:
#   - Teamarr matchup art (game-thumbs.ewatkins.dev)
#   - live sports events from the guide providers (a Sports category plus a
#     "Live" title or a <live/> flag), e.g. Gracenote's matchup art on CBS's
#     "Live: College Football"
#
# And a live game on a network channel takes Teamarr's art and "Away at Home"
# sub-title when Teamarr has matched it: Teamarr attaches the network
# channel's stream to its own team/event channel around the game, so a
# network channel that shares a stream with a Teamarr channel, airing a
# programme that overlaps that channel's game (category "Sports event"), is
# showing that game. Stream membership comes from Dispatcharr's API
# (DISPATCHARR_API_KEY, from dispatcharr-api-secret); without it, or for games
# Teamarr has not matched, the provider's art stays.
#
# Game listings that still have no sub-title (e.g. "Live: College Football",
# "From War Memorial Stadium in Laramie, Wyo.") get the matchup from ESPN's
# public scoreboard (./epg-espn.yaml, shared with epg-tz-fixer, which already
# applies it to the feeds it relabels).
#
# Jellyfin's XMLTV guide provider points at
#
#   http://dispatcharr-epg-logos.media.svc.cluster.local:9291/epg
#
# Neither endpoint takes a URL: /epg only fetches OUTPUT_EPG and /logo only
# fetches Dispatcharr logo ids, so this is not an open proxy. The container
# runs Dispatcharr's own image purely for its Python + Pillow.
apiVersion: v1
kind: ConfigMap
metadata:
  name: dispatcharr-epg-logos
  namespace: media
data:
  epg-logos.py: |
    #!/usr/bin/env python3
    import gzip
    import io
    import json
    import os
    import re
    import sys
    import threading
    import time
    import urllib.parse
    import urllib.request
    from datetime import datetime, timezone
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

    from PIL import Image

    sys.path.insert(0, "/shared")
    import espn_matchups  # ./epg-espn.yaml

    LISTEN = ("0.0.0.0", 9291)
    # The public URL, not 127.0.0.1:9191: Dispatcharr builds the logo URLs in
    # the feed from the request host.
    DISPATCHARR = "https://dispatcharr.ewatkins.dev"
    OUTPUT_EPG = DISPATCHARR + "/output/epg"
    LOGO_SRC = DISPATCHARR + "/api/channels/logos/{}/cache/"
    # What Jellyfin (another pod) fetches for a padded logo.
    LOGO_URL = "http://dispatcharr-epg-logos.media.svc.cluster.local:9291/logo/{}.png"
    TIMEOUT = 120

    CANVAS = (1280, 720)   # 16:9, matches Jellyfin's landscape cards
    MARGIN = 0.12          # fraction of each dimension left empty on each side
    LOGO_TTL = 24 * 3600

    CHANNEL = re.compile(rb'<channel id="([^"]+)">(.*?)</channel>', re.S)
    ICON_SRC = re.compile(rb'<icon src="([^"]*)"\s*/>')
    ICON_LINE = re.compile(rb'[ \t]*<icon src="[^"]*"\s*/>\n?')
    LOGO_ID = re.compile(rb'/api/channels/logos/(\d+)/cache/?$')
    PROGRAMME = re.compile(rb'(<programme\b[^>]*\bchannel="([^"]+)"[^>]*>)(.*?)(</programme>)', re.S)
    TITLE = re.compile(rb'<title[^>]*>([^<]*)</title>')
    SUB_TITLE = re.compile(rb'<sub-title[^>]*>[^<]*</sub-title>')
    CATEGORY = re.compile(rb'<category[^>]*>([^<]*)</category>')
    TIMES = re.compile(rb'\bstart="(\d{14}) ([+-]\d{4})"[^>]*\bstop="(\d{14}) ([+-]\d{4})"')
    TEAMARR_ART = b"game-thumbs.ewatkins.dev"
    API_KEY = os.environ.get("DISPATCHARR_API_KEY", "")

    def fetch(url, headers=None):
        req = urllib.request.Request(url, headers={"User-Agent": "epg-logos", **(headers or {})})
        with urllib.request.urlopen(req, timeout=TIMEOUT) as resp:
            body = resp.read()
        return gzip.decompress(body) if body[:2] == b"\x1f\x8b" else body

    def epg_channel_id(number):
        """Dispatcharr's output EPG keys channels by number: 2.0 -> "2", 12.2 -> "12.2"."""
        n = float(number)
        return (str(int(n)) if n == int(n) else repr(n)).encode()

    def channel_streams():
        """{epg channel id: set(stream ids)} from Dispatcharr's API, or {}."""
        if not API_KEY:
            return {}
        url = DISPATCHARR + "/api/channels/channels/?page_size=10000"
        out = {}
        while url:
            data = json.loads(fetch(url, {"X-API-Key": API_KEY}))
            rows, url = (data, None) if isinstance(data, list) else (data.get("results", []), data.get("next"))
            for c in rows:
                if c.get("channel_number") is not None and c.get("streams"):
                    out[epg_channel_id(c["channel_number"])] = set(c["streams"])
        return out

    def span(attrs):
        m = TIMES.search(attrs)
        if not m:
            return None
        def ts(stamp, off):
            t = datetime.strptime(stamp.decode(), "%Y%m%d%H%M%S").replace(tzinfo=timezone.utc).timestamp()
            sign = -1 if off[:1] == b"-" else 1
            return t - sign * (int(off[1:3]) * 3600 + int(off[3:5]) * 60)
        return ts(m.group(1), m.group(2)), ts(m.group(3), m.group(4))

    def teamarr_games(body):
        """{epg channel id: [(start, stop, icon line, sub-title line)]} for Teamarr game listings."""
        games = {}
        for m in PROGRAMME.finditer(body):
            inner = m.group(3)
            if TEAMARR_ART not in inner or b">Sports event<" not in inner:
                continue
            when, icon, sub = span(m.group(1)), ICON_SRC.search(inner), SUB_TITLE.search(inner)
            if when and icon:
                games.setdefault(m.group(2), []).append((*when, icon.group(0), sub.group(0) if sub else None))
        return games

    NOT_A_GAME = {b"sports talk", b"talk show", b"series"}

    def is_live_game(inner):
        """A provider's listing for an actual live game.

        Gracenote prefixes studio shows with "Live:" too ("Live: SEC Now"), so a
        game is: category Sports, no talk/series category, and the sport named
        in its other category appears in the title ("Live: College Football",
        categories Sports + Football)."""
        cats = [c.strip().lower() for c in CATEGORY.findall(inner)]
        if b"sports" not in cats or NOT_A_GAME.intersection(cats):
            return False
        title = (TITLE.search(inner) or [b"", b""])[1].lower()
        if not (title.startswith(b"live") or b"<live" in inner):
            return False
        return any(c != b"sports" and c in title for c in cats)

    def rewrite(body, streams):
        logos = {}
        for m in CHANNEL.finditer(body):
            icon = ICON_SRC.search(m.group(2))
            if not icon:
                continue
            src = icon.group(1)
            lid = LOGO_ID.search(src)
            if lid:
                src = LOGO_URL.format(lid.group(1).decode()).encode()
            logos[m.group(1)] = b'<icon src="' + src + b'" />'

        # Network channels sharing a stream with a Teamarr channel inherit its games.
        games = teamarr_games(body)
        shared = {}
        for tch, tgames in games.items():
            tstreams = streams.get(tch)
            if not tstreams:
                continue
            for ch, chstreams in streams.items():
                if ch != tch and ch not in games and chstreams & tstreams:
                    shared.setdefault(ch, []).extend(tgames)

        def teamarr_match(channel, attrs):
            when = span(attrs)
            if not when or channel not in shared:
                return None
            best, best_overlap = None, 0
            for g in shared[channel]:
                overlap = min(when[1], g[1]) - max(when[0], g[0])
                if overlap > best_overlap:
                    best, best_overlap = g, overlap
            return best

        counts = {"logo": 0, "kept": 0, "teamarr": 0}
        def fill(m):
            logo = logos.get(m.group(2))
            inner = m.group(3)
            if logo is None or TEAMARR_ART in inner:
                counts["kept"] += logo is not None
                return m.group(0)
            if is_live_game(inner):
                game = teamarr_match(m.group(2), m.group(1))
                if game:
                    counts["teamarr"] += 1
                    inner = ICON_LINE.sub(b"", inner)
                    if game[3] and not SUB_TITLE.search(inner):
                        title = TITLE.search(inner)
                        if title:
                            inner = inner[:title.end()] + b"\n    " + game[3] + inner[title.end():]
                    return m.group(1) + inner + b"  " + game[2] + b"\n  " + m.group(4)
                if b"<icon" in inner:
                    counts["kept"] += 1
                    return m.group(0)
            counts["logo"] += 1
            inner = ICON_LINE.sub(b"", inner)
            return m.group(1) + inner + b"  " + logo + b"\n  " + m.group(4)
        return PROGRAMME.sub(fill, body), counts

    _cache = {}
    _lock = threading.Lock()

    def padded_logo(logo_id):
        now = time.time()
        with _lock:
            hit = _cache.get(logo_id)
            if hit and now - hit[0] < LOGO_TTL:
                return hit[1]
        src = Image.open(io.BytesIO(fetch(LOGO_SRC.format(logo_id)))).convert("RGBA")
        box = (int(CANVAS[0] * (1 - 2 * MARGIN)), int(CANVAS[1] * (1 - 2 * MARGIN)))
        scale = min(box[0] / src.width, box[1] / src.height)
        src = src.resize((max(1, round(src.width * scale)), max(1, round(src.height * scale))), Image.LANCZOS)
        canvas = Image.new("RGBA", CANVAS, (0, 0, 0, 255))
        canvas.alpha_composite(src, ((CANVAS[0] - src.width) // 2, (CANVAS[1] - src.height) // 2))
        out = io.BytesIO()
        canvas.convert("RGB").save(out, "PNG", optimize=True)
        data = out.getvalue()
        with _lock:
            _cache[logo_id] = (now, data)
        return data

    class Handler(BaseHTTPRequestHandler):
        def do_GET(self):
            path = urllib.parse.urlsplit(self.path).path
            if path == "/healthz":
                return self.reply(200, b"ok", "text/plain")
            if path == "/epg":
                try:
                    body = fetch(OUTPUT_EPG)
                except Exception as exc:
                    self.log_message("output EPG fetch failed: %s", exc)
                    return self.reply(502, f"output EPG fetch failed: {exc}".encode(), "text/plain")
                try:
                    streams = channel_streams()
                except Exception as exc:  # degrade to logos + provider art
                    self.log_message("channel stream lookup failed: %s", exc)
                    streams = {}
                out, counts = rewrite(body, streams)
                out, espn = espn_matchups.add_matchups(out)  # never raises
                self.log_message("epg: %d programmes -> channel logo, %d kept own art, %d -> Teamarr matchup, %d -> ESPN matchup",
                                 counts["logo"], counts["kept"], counts["teamarr"], espn)
                return self.reply(200, out, "application/xml")
            m = re.fullmatch(r"/logo/(\d+)\.png", path)
            if m:
                try:
                    return self.reply(200, padded_logo(m.group(1)), "image/png")
                except Exception as exc:
                    self.log_message("logo %s failed: %s", m.group(1), exc)
                    return self.reply(502, b"logo fetch failed", "text/plain")
            return self.reply(404, b"not found", "text/plain")

        def reply(self, code, body, ctype):
            self.send_response(code)
            self.send_header("Content-Type", ctype)
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, fmt, *args):
            sys.stderr.write("epg-logos: " + (fmt % args) + "\n")

        def log_request(self, code="-", size="-"):
            pass

    if __name__ == "__main__":
        ThreadingHTTPServer(LISTEN, Handler).serve_forever()
