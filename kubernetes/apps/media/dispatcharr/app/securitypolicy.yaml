---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: dispatcharr-vpn-oidc
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: dispatcharr-vpn
  # The VPN UI re-serves gluetun's /v1/vpn/settings verbatim on its own
  # /api/health, and that payload contains the Privado username and password in
  # clear text. Without this policy anything on the LAN could read them.
  oidc:
    provider:
      issuer: https://keycloak.ewatkins.dev/realms/master
    clientID: gluetun-webui
    clientSecret:
      name: gluetun-secret
      namespace: media
    redirectURL: "https://gluetun.ewatkins.dev/oauth2/callback"
    scopes: ["openid", "profile", "email"]
