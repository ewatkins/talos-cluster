---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app epg-matcharr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      epg-matcharr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/jstevenscl/epgmatcharr
              tag: v0.4.00@sha256:446feb311b198418753c051a0111d50eac8060c16eb931a3d7cc7d05a0d36de3
            env:
              # The API token is set through the UI on first run. Env vars take
              # priority over UI settings, so DISPATCHARR_TOKEN is deliberately
              # left unset rather than pinned to an empty value.
              DISPATCHARR_URL: http://dispatcharr.media.svc.cluster.local:9191
              TZ: "${TIMEZONE}"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /status
                    port: &port 8281
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 5
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 512Mi
              limits:
                memory: 4Gi
        pod:
          securityContext:
            # nfs-slow presents as 99:100 and cannot be chowned from the
            # container, so run as that owner. Same as Dispatcharr itself.
            runAsUser: 99
            runAsGroup: 100
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: epg-matcharr
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: epg-matcharr-data
        globalMounts:
          - path: /app/data
