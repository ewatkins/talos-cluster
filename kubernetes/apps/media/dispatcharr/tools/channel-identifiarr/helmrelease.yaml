---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app channel-identifiarr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      channel-identifiarr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/egyptiangio/channelidentifiarr
              tag: 0.6.5@sha256:d883c0eb43e369fd78d59f11aaf1dcef8783ae663d92a088c7c07050b48adc23
            # EMBY_URL is deliberately unset - the Emby logo features do not apply
            # here. The Gracenote station IDs it populates are Emby-independent.
            env:
              TZ: "${TIMEZONE}"
              DATABASE_PATH: /data/channelidentifiarr.db
              DISPATCHARR_URL: http://dispatcharr.media.svc.cluster.local:9191
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 9192
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 256Mi
              limits:
                memory: 1Gi
        pod:
          securityContext:
            # nfs-slow presents as 99:100 and cannot be chowned from the
            # container. Same as Dispatcharr itself.
            runAsUser: 99
            runAsGroup: 100
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: channel-identifiarr
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: channel-identifiarr-data
        globalMounts:
          - path: /data
