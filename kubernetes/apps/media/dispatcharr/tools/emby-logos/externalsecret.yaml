---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name emby-logos-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Jellyfin API key. Unlike Dispatcharr, Jellyfin issues long-lived
        # keys (Dashboard -> API Keys), so this does not expire.
        EMBY_API_KEY: "{{ .JELLYFIN_API_KEY }}"
  dataFrom:
    - extract:
        key: *name
