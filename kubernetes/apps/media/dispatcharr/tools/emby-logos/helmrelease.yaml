---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app emby-logos
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      emby-logos:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/sethwv/emby-logo-tools
              tag: latest@sha256:caa355adc004362ebe13322068f354e2a80164e131b2d087be4334175285f0ce
            env:
              TZ: "${TIMEZONE}"
              # Jellyfin forked from Emby and kept the same API surface, so
              # this tool works against it unchanged - it just needs pointing
              # at Jellyfin rather than an Emby server.
              EMBY_SERVER_URL: http://jellyfin.media.svc.cluster.local:8096
              MODE: copy
              # Dry run confirmed the intended changes (LogoLight and
              # LogoLightColor per channel), so this now performs real uploads.
              DRY_RUN: "false"
              FIRST_ONLY: "false"
              FORCE: "false"
              # Empty processes everything. Set LIST_TAGS=true for one run to
              # see which tags exist before narrowing this down.
              TAGS: ""
              LIST_TAGS: "false"
              DEBUG_TAGS: "false"
              # Daily, after the Jellyfin guide refresh (03:00) and the
              # StreamFlow pipeline (04:00) have populated channels.
              CRON_SCHEDULE: "0 5 * * *"
              RUN_ONCE: "false"
            envFrom:
              - secretRef:
                  name: emby-logos-secret
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
        pod:
          securityContext:
            # Upstream runs this as root; it writes into the image at runtime.
            runAsUser: 0
            runAsGroup: 0
