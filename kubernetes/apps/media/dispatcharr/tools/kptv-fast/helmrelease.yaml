---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app kptv-fast
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      kptv-fast:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/kpirnie/kptv-fast
              tag: latest@sha256:1366e6ebaab8ed1a74fad471f2744743fa47fee7d43c0bb1a88ea8c4166ff2c5
            env:
              TZ: "${TIMEZONE}"
              DEBUG: "false"
              CACHE_DURATION: "7200"
              WARM_CACHE_ON_STARTUP: "true"
              WARM_EPG_ON_STARTUP: "true"
              ENABLED_PROVIDERS: all
              GIT_COUNTRY: "us,ca"
              LG_COUNTRY: "us,ca"
              WHALE_COUNTRY: "us,ca"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
            resources:
              # Building the combined EPG pulls >230MB of XML (lg 71MB, pluto
              # 60MB, plex 37MB, roku 36MB, ...) and parses it all in memory,
              # which OOMKilled the container at 1Gi. Trim ENABLED_PROVIDERS
              # if this ceiling ever becomes a problem.
              requests:
                cpu: 25m
                memory: 512Mi
              limits:
                memory: 6Gi
    service:
      app:
        controller: kptv-fast
        ports:
          http:
            port: *port
