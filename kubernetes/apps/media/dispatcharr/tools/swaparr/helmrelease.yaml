---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app swaparr
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      swaparr:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/mckenna654/swaparr
              tag: 1.1.3@sha256:450f8a7d46983cc94dac61261839b60acd542f11d2ed63b433ab8bb9b6582b9e
            # nginx-alpine writes to /etc/nginx/conf.d, /var/cache/nginx and
            # /var/run at startup, so the root filesystem is left writable.
            env:
              TZ: "${TIMEZONE}"
              NGINX_PORT: "8080"
              DISPATCHARR_URL: http://dispatcharr.media.svc.cluster.local:9191
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8080
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 256Mi
    service:
      app:
        controller: swaparr
        ports:
          http:
            port: *port
