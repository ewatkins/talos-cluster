---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: streamflow-timeout
  namespace: media
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: streamflow
  timeout:
    http:
      # Stream quality checks run ffmpeg against many sources in one request
      # and comfortably exceed Envoy's 15s default.
      requestTimeout: "1800s"
