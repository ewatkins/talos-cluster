---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app streamflow
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      streamflow:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/krinkuto11/streamflow
              tag: 2.5.6@sha256:fdf4c91b332c49ed5862a534cee75bb3eafa2e45aebd9ca1834697b551d3550d
            # Runs ffmpeg quality checks over every stream, so give it real memory
            # and disable the gateway timeout for long check runs.
            env:
              TZ: "${TIMEZONE}"
              API_PORT: "5000"
              DISPATCHARR_BASE_URL: http://dispatcharr.media.svc.cluster.local:9191
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 5000
                  initialDelaySeconds: 30
                  periodSeconds: 30
                  timeoutSeconds: 10
                  failureThreshold: 6
              readiness: *probes
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 4Gi
        pod:
          securityContext:
            # nfs-slow presents as 99:100 and cannot be chowned from the
            # container. Same as Dispatcharr itself.
            runAsUser: 99
            runAsGroup: 100
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: streamflow
        ports:
          http:
            port: *port
    persistence:
      data:
        existingClaim: streamflow-data
        globalMounts:
          - path: /app/data
