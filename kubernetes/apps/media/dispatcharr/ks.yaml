  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No gatus check: this is internal-only with no HTTPRoute.
  wait: false
  path: ./kubernetes/apps/media/dispatcharr/tools/iptv-epg
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
---
