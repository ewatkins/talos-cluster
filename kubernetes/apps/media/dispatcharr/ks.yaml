---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app dispatcharr
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/media
  dependsOn:
    - name: crunchy-postgres-17
    - name: crunchy-postgres-operator-secretstore
    # The six co-located tools. They ship the PVCs this pod mounts, so the
    # dependency runs this way round for them; reversing it would be a cycle.
    # It also fixes the cutover order — these Kustomizations prune the old
    # per-tool HelmReleases, and Helm will not adopt a Service still owned by
    # another release. See ./tools/README.md.
    - name: teamarr
    - name: webpage-hls
    - name: game-thumbs
  wait: false
  path: ./kubernetes/apps/media/dispatcharr/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app epg-matcharr
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No gatus check: the Dispatcharr tools are deliberately unmonitored.
  dependsOn:
    - name: dispatcharr
  wait: false
  path: ./kubernetes/apps/media/dispatcharr/tools/epg-matcharr
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app teamarr
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  # No gatus check: the Dispatcharr tools are deliberately unmonitored.
  # Carries the PVC and HTTPRoute; the container runs in the Dispatcharr pod,
  # which depends on this Kustomization rather than the other way round.
  wait: false
  path: ./kubernetes/apps/media/dispatcharr/tools/teamarr
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
