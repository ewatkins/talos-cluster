    name: talos-cluster
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: webpage-hls
      # / returns 404 by design; /health is the real endpoint.
      GATUS_PATH: /health
