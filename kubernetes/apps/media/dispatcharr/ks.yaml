# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app game-thumbs
  namespace: flux-system
spec:
  targetNamespace: media
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../../components/gatus/media
  dependsOn:
    - name: dispatcharr
  wait: false
  path: ./kubernetes/apps/media/dispatcharr/tools/game-thumbs
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: game-thumbs
      # This app answers 444 on every path, so 444 is the healthy response —
      # a connection failure is what indicates it is actually down.
      GATUS_STATUS: "444"
---
