---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app gluetun
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      retries: 3
  values:
    controllers:
      gluetun:
        annotations:
          reloader.stakater.com/auto: "true"
        # Recreate, not RollingUpdate: two pods would hold two simultaneous
        # Privado sessions and the Service would flap between two exit IPs
        # mid-rollout.
        strategy: Recreate
        containers:
          app:
            image:
              repository: docker.io/qmcgaw/gluetun
              tag: v3.41.1@sha256:1a5bf4b4820a879cdf8d93d7ef0d2d963af56670c9ebff8981860b6804ebc8ab
            env:
              # Privado is OpenVPN-only in gluetun; there is no native
              # WireGuard support for this provider.
              VPN_SERVICE_PROVIDER: privado
              VPN_TYPE: openvpn
              TZ: "${TIMEZONE}"
              # The reason this is a Deployment rather than a Dispatcharr
              # sidecar: consumers opt in per request by using the proxy, so
              # only UK sources ride the tunnel.
              HTTPPROXY: "on"
              HTTPPROXY_LISTENING_ADDRESS: ":8888"
              HTTPPROXY_STEALTH: "on"
              # Everything not in these subnets is forced through the tunnel.
              # Keeping the LAN, pod and service CIDRs on eth0 is what lets
              # CoreDNS and kubelet probes work while the VPN is up.
              FIREWALL_OUTBOUND_SUBNETS: 10.40.0.0/16,10.69.0.0/16,10.96.0.0/16
              # Ports the pod accepts from outside: the proxy and the UI. The
              # control server on :8000 is deliberately not listed, so it is
              # reachable only from inside this pod.
              FIREWALL_INPUT_PORTS: "8888,3000"
              # Pod-local only (see FIREWALL_INPUT_PORTS), so the control
              # server is left unauthenticated for the UI container to use.
              HTTP_CONTROL_SERVER_AUTH_DEFAULT_ROLE: '{"auth":"none"}'
            envFrom:
              - secretRef:
                  name: gluetun-secret
              # Exit selection, deliberately not reconciled by Flux so it can
              # be changed live. See ../README.md.
              - configMapRef:
                  name: gluetun-server
            # No probes on purpose. A readiness probe here would pull the whole
            # pod out of the Service when the tunnel drops, taking the UI —
            # the thing you reconnect from — down with it. Gluetun already
            # restarts its own tunnel on health failures, and the kill switch
            # means a broken tunnel fails closed rather than leaking.
            securityContext:
              capabilities:
                add: ["NET_ADMIN"]
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 512Mi
          # Live view of the tunnel (state, exit IP, city, provider) plus
          # stop/start buttons. Reaches the control server over localhost.
          ui:
            image:
              repository: docker.io/scuzza/gluetun-webui
              # Upstream only publishes 1.0.0 and rolling main-<sha> tags; this
              # is the head of main and Renovate cannot bump it automatically.
              tag: main-268a3f3@sha256:a7c2b4c77f26bb690debe6879cd7149d69710578b13e0dcdc08f6b9b6c7a7a14
            env:
              TZ: "${TIMEZONE}"
              PORT: &uiPort 3000
              TRUST_PROXY: "true"
              GLUETUN_CONTROL_URL: http://127.0.0.1:8000
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/health
                    port: *uiPort
                  initialDelaySeconds: 10
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 3
              readiness: *probes
            resources:
              requests:
                cpu: 10m
                memory: 32Mi
              limits:
                memory: 128Mi
    service:
      app:
        controller: gluetun
        ports:
          http-proxy:
            port: 8888
          ui:
            port: *uiPort
