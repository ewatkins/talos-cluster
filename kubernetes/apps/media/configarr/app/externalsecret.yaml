---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name configarr-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # The *arr API keys already live in the Notifiarr Bitwarden item
        SONARR_API_KEY: "{{ .DN_SONARR_0_API_KEY }}"
        RADARR_API_KEY: "{{ .DN_RADARR_0_API_KEY }}"
  dataFrom:
    - extract:
        key: notifiarr-secret
