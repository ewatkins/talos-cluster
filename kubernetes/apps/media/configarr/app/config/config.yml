# Configarr syncs TRaSH-Guides custom formats, quality profiles and quality
# definitions into Sonarr/Radarr. Docs: https://configarr.de/docs/configuration/config-file
#
# Profiles come straight from TRaSH-Guides (`source: TRASH`, by trash_id), which
# also applies each profile's default CF groups. reset_unmatched_scores zeroes
# any score TRaSH doesn't set, so the profiles always match the guide exactly.
# Put deliberate deviations from TRaSH below the include as custom_formats /
# quality_profiles overrides.
trashGuideUrl: https://github.com/TRaSH-Guides/Guides
recyclarrConfigUrl: https://github.com/recyclarr/config-templates
telemetry: false

sonarr:
  sonarr:
    base_url: http://sonarr.media.svc.cluster.local
    api_key: !env SONARR_API_KEY
    delete_unmanaged_custom_formats:
      enabled: false
    quality_definition:
      type: series
    include:
      - template: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        source: TRASH
      - template: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
        source: TRASH
    quality_profiles:
      - name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
      - name: WEB-2160p
        reset_unmatched_scores:
          enabled: true

radarr:
  radarr:
    base_url: http://radarr.media.svc.cluster.local
    api_key: !env RADARR_API_KEY
    delete_unmanaged_custom_formats:
      enabled: false
    quality_definition:
      type: sqp-streaming
    include:
      - template: 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
        source: TRASH
    quality_profiles:
      - name: "[SQP] SQP-1 (2160p)"
        reset_unmatched_scores:
          enabled: true
