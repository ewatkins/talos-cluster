# Configarr syncs TRaSH-Guides custom formats, quality profiles and quality
# definitions into Sonarr/Radarr. Docs: https://configarr.de/docs/configuration/config-file
#
# Profiles come straight from TRaSH-Guides (`source: TRASH`, by trash_id), which
# also applies each profile's default CF groups. reset_unmatched_scores zeroes
# any score TRaSH doesn't set, so the profiles always match the guide exactly.
# Put deliberate deviations from TRaSH below the include as custom_formats /
# quality_profiles overrides.
trashGuideUrl: https://github.com/TRaSH-Guides/Guides
recyclarrConfigUrl: https://github.com/recyclarr/config-templates
telemetry: false

sonarr:
  sonarr:
    base_url: http://sonarr.media.svc.cluster.local
    api_key: !env SONARR_API_KEY
    delete_unmanaged_custom_formats:
      enabled: false
    quality_definition:
      type: series
    include:
      - template: 72dae194fc92bf828f32cde7744e51a1 # WEB-1080p
        source: TRASH
      - template: d1498e7d189fbe6c7110ceaabb7473e6 # WEB-2160p
        source: TRASH
    quality_profiles:
      # Shows: WEB 1080p is the goal, but older shows that only exist as
      # HDTV/720p/DVD/SD are still grabbed (and upgraded if 1080p shows up).
      # TRaSH's WEB-1080p allows WEB 1080p only.
      - name: WEB-1080p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 1080p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: Bluray-720p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBDL-480p, WEBRip-480p]
          - name: DVD
          - name: SDTV
      # Same fallbacks as WEB-1080p, with WEB 2160p preferred on top.
      # TRaSH's WEB-2160p allows WEB 2160p only.
      - name: WEB-2160p
        reset_unmatched_scores:
          enabled: true
        upgrade:
          allowed: true
          until_quality: WEB 2160p
          until_score: 10000
        min_format_score: 0
        quality_sort: top
        qualities:
          - name: WEB 2160p
            qualities: [WEBDL-2160p, WEBRip-2160p]
          - name: WEB 1080p
            qualities: [WEBDL-1080p, WEBRip-1080p]
          - name: Bluray-1080p
          - name: HDTV-1080p
          - name: WEB 720p
            qualities: [WEBDL-720p, WEBRip-720p]
          - name: Bluray-720p
          - name: HDTV-720p
          - name: Bluray-576p
          - name: Bluray-480p
          - name: WEB 480p
            qualities: [WEBDL-480p, WEBRip-480p]
          - name: DVD
          - name: SDTV

radarr:
  radarr:
    base_url: http://radarr.media.svc.cluster.local
    api_key: !env RADARR_API_KEY
    delete_unmanaged_custom_formats:
      enabled: false
    quality_definition:
      type: sqp-streaming
    include:
      - template: 5128baeb2b081b72126bc8482b2a86a0 # [SQP] SQP-1 (2160p)
        source: TRASH
    quality_profiles:
      # Movies: 4K HDR preferred (HDR +500 from TRaSH), with 1080p/720p
      # fallbacks already allowed by SQP-1. TRaSH's min score of 1000 rejects
      # releases from unscored groups, which starves the fallbacks; keep 0.
      - name: "[SQP] SQP-1 (2160p)"
        reset_unmatched_scores:
          enabled: true
        min_format_score: 0
