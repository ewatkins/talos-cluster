---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app configarr
  namespace: &namespace media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      configarr:
        type: cronjob
        cronjob:
          schedule: "0 * * * *"
          timeZone: America/Chicago
          concurrencyPolicy: Forbid
          startingDeadlineSeconds: 600
          backoffLimit: 1
          successfulJobsHistory: 1
          failedJobsHistory: 3
        containers:
          app:
            image:
              repository: ghcr.io/raydak-labs/configarr
              tag: 1.40.0@sha256:f8f9f67ef4efda44c661d2d51defab9048087628ed3aa9eed4c9dcdb35c36ad3
            env:
              LOG_LEVEL: info
              TZ: America/Chicago
            envFrom:
              - secretRef:
                  name: configarr-secret
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 100
        fsGroup: 100
    persistence:
      config:
        type: configMap
        name: configarr-config
        globalMounts:
          - path: /app/config/config.yml
            subPath: config.yml
            readOnly: true
      # TRaSH-Guides / recyclarr template clones; re-cloned (sparse) each run
      repos:
        type: emptyDir
        globalMounts:
          - path: /app/repos
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
