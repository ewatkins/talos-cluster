---
# Chaptarr's main/log/cache databases live in the PG17 cluster rather than as
# SQLite files on NFS — see ../README.md for why. Host/port/user/password come
# from the operator-generated pguser secret; the three database names are set
# as plain env in the HelmRelease since one pguser secret only carries one
# `dbname`.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name chaptarr-db-secret
  namespace: media
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        CHAPTARR__POSTGRES__HOST: '{{ index . "pgbouncer-host" }}'
        CHAPTARR__POSTGRES__PORT: '{{ index . "pgbouncer-port" }}'
        CHAPTARR__POSTGRES__USER: '{{ index . "user" }}'
        CHAPTARR__POSTGRES__PASSWORD: '{{ index . "password" }}'
  dataFrom:
    - extract:
        key: crunchy-postgres-17-pguser-chaptarr
