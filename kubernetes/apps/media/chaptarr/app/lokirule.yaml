---
groups:
  - name: chaptarr
    rules:
      - alert: ChaptarrDatabaseIsLocked
        expr: |
          sum by (app) (count_over_time({app=~"chaptarr"} |~ "(?i)database is locked"[5m])) > 0
        for: 5m
        annotations:
          summary: >-
            {{ $labels.app }} is experiencing database issues
        labels:
          severity: critical

      - alert: ChaptarrDatabaseIsMalformed
        expr: |
          sum by (app) (count_over_time({app=~"chaptarr"} |~ "(?i)database disk image is malformed"[5m])) > 0
        for: 5m
        annotations:
          summary: >-
            {{ $labels.app }} is experiencing database issues
        labels:
          severity: critical
