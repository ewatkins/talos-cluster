---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app chaptarr
  namespace: &namespace media
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      chaptarr:
        containers:
          app:
            # No home-operations build exists for Chaptarr; this is the
            # project's own Docker Hub image.
            image:
              repository: docker.io/chaptarr/chaptarr
              tag: 0.9.965@sha256:bb00d67cbe1485d1cd61ef178362a29b42aa08f86b290841aab4b115ad2647a6
            env:
              # Chaptarr is a Readarr fork and keeps the same options surface,
              # under the Chaptarr: config section.
              CHAPTARR__APP__INSTANCENAME: Chaptarr
              CHAPTARR__APP__THEME: dark
              CHAPTARR__AUTH__METHOD: External
              CHAPTARR__AUTH__REQUIRED: DisabledForLocalAddresses
              CHAPTARR__LOG__LEVEL: info
              CHAPTARR__SERVER__PORT: &port 80
              CHAPTARR__UPDATE__BRANCH: develop
              TZ: America/Chicago
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /ping
                    port: *port
                    # Matches the other *arr apps: AllowedHosts rejects the
                    # pod-IP Host header the kubelet sends.
                    httpHeaders:
                      - name: Host
                        value: localhost
                  initialDelaySeconds: 30
                  periodSeconds: 10
                  timeoutSeconds: 30
                  failureThreshold: 5
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 99
        runAsGroup: 100
        fsGroup: 100
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        controller: chaptarr
        ports:
          http:
            port: *port
    ingress:
      app:
        enabled: false
    persistence:
      config:
        existingClaim: chaptarr-config
        globalMounts:
          - path: /config
      media:
        type: nfs
        server: storage.ewatkins.dev
        path: /mnt/user/arrdata
        globalMounts:
          - path: /mnt/arrdata
      tmp:
        type: emptyDir
