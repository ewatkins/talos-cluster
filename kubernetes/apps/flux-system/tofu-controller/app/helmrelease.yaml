---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tofu-controller
spec:
  chartRef:
    kind: OCIRepository
    name: tofu-controller
  interval: 1h
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Terraform objects live in their app's own namespace (e.g.
    # calagopus-wings) but read the one GitRepository in flux-system.
    allowCrossNamespaceRefs: true
    # No runner namespaces beyond the chart's default (flux-system): the
    # chart's tf-runner account is bound to read/write on every Secret in the
    # cluster. Each Terraform object brings its own namespace-scoped account
    # (`serviceAccountName`) instead.

    # The AWS primitive modules are not used here.
    awsPackage:
      install: false
    metrics:
      enabled: true
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 512Mi
