---
# Keycloak client credentials for the Flux Status web UI. Bitwarden Secrets
# Manager item `flux-web-client`, whose value is a JSON object:
#
#   { "client_id": "flux-web", "client_secret": "<from Keycloak → Clients → flux-web → Credentials>" }
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name flux-web-client
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
  dataFrom:
    - extract:
        key: *name
