---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    serviceMonitor:
      create: true
    # The Flux Status web UI runs as its own release (../web/, `web.serverOnly`)
    # so a bad sign-in config or a missing client secret can never take the
    # operator down with it. Off here, so the two releases don't both own the
    # flux-web-user / flux-web-admin ClusterRoles.
    web:
      enabled: false
