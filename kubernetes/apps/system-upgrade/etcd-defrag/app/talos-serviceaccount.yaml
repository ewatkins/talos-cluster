---
# Talos mints a talosconfig for this into a Secret of the same name. os:operator
# is the smallest role that may call EtcdDefragment; it cannot change machine
# config, reset or reboot. Requires os:operator in kubernetesTalosAPIAccess
# (talos/talconfig.yaml) and this namespace in its allowed namespaces.
apiVersion: talos.dev/v1alpha1
kind: ServiceAccount
metadata:
  name: etcd-defrag
spec:
  roles:
    - os:operator
