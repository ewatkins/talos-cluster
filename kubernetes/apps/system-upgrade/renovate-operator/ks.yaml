---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app renovate-operator
  namespace: flux-system
spec:
  targetNamespace: system-upgrade
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/internal
  dependsOn:
    - name: external-secrets-stores
  # Wait for readiness so the RenovateJob CRD exists before the jobs
  # Kustomization below tries to create a RenovateJob against it.
  wait: true
  path: ./kubernetes/apps/system-upgrade/renovate-operator/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster
  interval: 30m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: renovate
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app renovate-operator-jobs
  namespace: flux-system
spec:
  targetNamespace: system-upgrade
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: renovate-operator
  wait: false
  path: ./kubernetes/apps/system-upgrade/renovate-operator/jobs
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster
  interval: 30m
  timeout: 5m
