---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: talos-cluster
  namespace: system-upgrade
spec:
  # Renovate still reads .renovaterc.json5 and the .renovate/ presets from the
  # repo itself, so behaviour matches what the GitHub Action produced.
  # Each repo must also be granted to the GitHub App installation.
  discoveryFilters:
    - ewatkins/talos-cluster
    - ewatkins/drenaslia-pathfinder
  provider:
    name: github
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  image: ghcr.io/renovatebot/renovate:44.188.2
  parallelism: 1
  # Hourly, on the hour; a run over this repo takes ~5 minutes. Per-package
  # schedules in .renovate/ are evaluated by Renovate itself (America/Chicago).
  schedule: "0 * * * *"
  secretRef: renovate-secret
  extraEnv:
    - name: LOG_LEVEL
      value: info
    - name: RENOVATE_PLATFORM
      value: github
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
