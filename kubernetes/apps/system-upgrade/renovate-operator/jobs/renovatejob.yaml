---
apiVersion: renovate-operator.mogenius.com/v1alpha1
kind: RenovateJob
metadata:
  name: talos-cluster
  namespace: system-upgrade
spec:
  # Renovate still reads .renovaterc.json5 and the .renovate/ presets from the
  # repo itself, so behaviour matches what the GitHub Action produced.
  discoveryFilters:
    - ewatkins/talos-cluster
  provider:
    name: github
  # renovate: datasource=docker depName=ghcr.io/renovatebot/renovate
  image: ghcr.io/renovatebot/renovate:44.48.3
  parallelism: 1
  # 8pm America/Chicago daily. The operator evaluates this in its TZ (set on the
  # deployment), so it stays at 8pm local across DST rather than drifting.
  schedule: "0 20 * * *"
  secretRef: renovate-secret
  extraEnv:
    - name: LOG_LEVEL
      value: info
    - name: RENOVATE_PLATFORM
      value: github
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
