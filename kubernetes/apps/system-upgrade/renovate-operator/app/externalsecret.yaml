---
# The GitHub App private key, pulled from Bitwarden. This is the same "bot" app
# the GitHub Actions workflows used via BOT_APP_ID / BOT_APP_PRIVATE_KEY.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name renovate-github-app
  namespace: system-upgrade
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        private_key_pem: "{{ .RENOVATE_PRIVATE_KEY | b64dec }}"
  dataFrom:
    - extract:
        key: renovate-operator
---
# Mints a short-lived installation token from the App credentials. ESO refreshes
# it before it expires, so Renovate never sees a long-lived credential.
apiVersion: generators.external-secrets.io/v1alpha1
kind: GithubAccessToken
metadata:
  name: renovate-github-token
  namespace: system-upgrade
spec:
  # The CRD requires strings, but Kustomize drops the quotes around a bare
  # ${VAR} before Flux substitutes, leaving a bare number that fails the typed
  # dry-run. So the quotes are carried inside the values in cluster-secrets.
  appID: ${SECRET_RENOVATE_APP_ID}
  installID: ${SECRET_RENOVATE_INSTALLATION_ID}
  auth:
    privateKey:
      secretRef:
        name: renovate-github-app
        key: private_key_pem
---
# The secret the RenovateJob consumes.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name renovate-secret
  namespace: system-upgrade
spec:
  refreshInterval: 30m
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        RENOVATE_TOKEN: "{{ .token }}"
        GITHUB_COM_TOKEN: "{{ .token }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: GithubAccessToken
          name: renovate-github-token
