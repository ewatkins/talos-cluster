---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: renovate-operator
spec:
  chartRef:
    kind: OCIRepository
    name: renovate-operator
  interval: 1h
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # Without this the chart names everything renovate-operator-renovate-operator.
    fullnameOverride: renovate-operator
    replicaCount: 1

    crd:
      install: true
      mode: hook

    config:
      # Keep failed jobs around for debugging, reap successful ones after a day.
      deleteSuccessfulJobs: false
      jobTTLSecondsAfterFinished: 86400
      defaultJobActiveDeadlineSeconds: 1800

    # The scheduler uses time.Local, so RenovateJob cron expressions are
    # evaluated in this zone. The binary is built with -tags timetzdata, so the
    # tz database is embedded and this resolves even on the scratch image.
    # Without it schedules would run in UTC and drift an hour across DST.
    extraEnv:
      - name: TZ
        value: "${TIMEZONE}"

    logging:
      level: info
      format: json

    metrics:
      enabled: true
      serviceMonitor:
        enabled: true

    resources:
      requests:
        cpu: 25m
        memory: 128Mi
      limits:
        memory: 512Mi
