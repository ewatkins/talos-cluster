---
# The same GitHub App as talos-runner (Bitwarden item talos-runner); the app's
# installation must include the calagopus-anvil repo.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name anvil-runner
  namespace: actions-runner-system
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: anvil-runner-secret
    template:
      engineVersion: v2
      data:
        github_app_id: "{{ .ACTIONS_RUNNER_APP_ID }}"
        github_app_installation_id: "{{ .ACTIONS_RUNNER_INSTALLATION_ID }}"
        github_app_private_key: "{{ .ACTIONS_RUNNER_PRIVATE_KEY | b64dec }}"
  dataFrom:
    - extract:
        key: talos-runner-secret
