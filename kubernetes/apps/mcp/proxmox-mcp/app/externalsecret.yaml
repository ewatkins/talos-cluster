---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name proxmox-mcp-secret
  namespace: mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Secret half of the Proxmox API token mcp@pve!mcp
        PROXMOX_TOKEN_VALUE: "{{ .token_value }}"
        # Bearer token every MCP client must send on the streamable-http endpoint
        MCP_API_KEY: "{{ .mcp_api_key }}"
        # Token an agent has to pass to run a high-risk (destructive) tool
        COMMAND_POLICY_HIGH_RISK_APPROVAL_TOKEN: "{{ .approval_token }}"
  dataFrom:
    - extract:
        key: *name
