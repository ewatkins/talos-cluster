---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app netbox-mcp
  namespace: flux-system
spec:
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  dependsOn:
    - name: netbox
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: mcp
  interval: 1h
  path: ./kubernetes/apps/mcp/netbox-mcp/app
  prune: true
  retryInterval: 2m
  sourceRef:
    kind: GitRepository
    name: talos-cluster
    namespace: flux-system
  targetNamespace: mcp
  timeout: 5m
