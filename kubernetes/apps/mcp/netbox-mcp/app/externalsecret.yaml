---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name netbox-mcp-secret
  namespace: mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # NetBox API token — create it read-only; the server only ever GETs
        NETBOX_TOKEN: "{{ .NETBOX_TOKEN }}"
        # Bearer token clients must present to reach /mcp. Without it the
        # HTTP transport is unauthenticated and exposes everything the
        # NetBox token can read to anyone who can reach the port.
        MCP_AUTH_TOKEN: "{{ .MCP_AUTH_TOKEN }}"
  dataFrom:
    - extract:
        key: *name
