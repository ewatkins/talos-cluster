---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name unifi-network-mcp-secret
  namespace: mcp
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Local UniFi admin account (Ubiquiti SSO accounts do not work)
        UNIFI_USERNAME: "{{ .username }}"
        UNIFI_PASSWORD: "{{ .password }}"
        # Optional: unlocks firewall policy ordering and a few settings endpoints
        UNIFI_API_KEY: "{{ .api_key }}"
  dataFrom:
    - extract:
        key: *name
