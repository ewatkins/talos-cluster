---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name awx-postgres-configuration
  namespace: development
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Key names are fixed by the operator's postgres_configuration_secret
        # contract. Pointed at the primary service, not pgbouncer: the AWX
        # dispatcher relies on LISTEN/NOTIFY, which does not survive a pooler.
        host: '{{ index . "host" }}'
        port: '{{ index . "port" }}'
        database: '{{ index . "dbname" }}'
        username: '{{ index . "user" }}'
        password: '{{ index . "password" }}'
        sslmode: prefer
        type: unmanaged
  dataFrom:
    - extract:
        key: crunchy-postgres-17-pguser-awx
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name awx-secret
  namespace: development
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # Both secret_key_secret and admin_password_secret on the AWX CR point
        # here. The operator looks each secret up by name and reads one key out
        # of it, and mounts SECRET_KEY with an explicit `items` projection, so
        # co-locating them is invisible to AWX.
        #
        # Django SECRET_KEY. AWX encrypts every stored credential with it, so
        # rotating it makes all of them unrecoverable — keep it stable.
        secret_key: "{{ .secret_key }}"
        # Initial password for the admin user; only read on first boot.
        password: "{{ .password }}"
  dataFrom:
    - extract:
        key: *name
