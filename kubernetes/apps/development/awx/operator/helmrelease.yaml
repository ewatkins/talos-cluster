---
# yaml-language-server: $schema=https://kube-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: awx-operator
spec:
  interval: 30m
  chart:
    spec:
      chart: awx-operator
      version: 3.2.1
      sourceRef:
        kind: HelmRepository
        name: awx-operator
        namespace: flux-system
  maxHistory: 2
  install:
    crds: CreateReplace
    remediation:
      retries: 3
  upgrade:
    crds: CreateReplace
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    # The chart can deploy its own sample AWX; the real one is a CR in ../app so
    # it can be reviewed and diffed like any other manifest.
    AWX:
      enabled: false
    # Container-level overrides; the key must match the container name in the
    # chart's controller Deployment. The chart requests 32Mi for awx-manager,
    # which is well under what an Ansible-based operator actually uses while
    # reconciling an AWX; everything else the chart sets is left alone.
    operator-controller-containers:
      awx-manager:
        resources:
          requests:
            cpu: 50m
            memory: 256Mi
          limits:
            memory: 1Gi
