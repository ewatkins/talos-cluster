---
# OIDC client secret for the Envoy SecurityPolicy (it reads the `client-secret` key).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: drenaslia-pathfinder
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: drenaslia-pathfinder-secret
    template:
      engineVersion: v2
      data:
        client-secret: "{{ .OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        # Bitwarden entry from before the Pathfinder rename
        key: drenaslia-leveling-secret
---
# Pull secret for the private ghcr.io/ewatkins/drenaslia-pathfinder image.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: drenaslia-pathfinder-ghcr
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: drenaslia-pathfinder-ghcr
    template:
      type: kubernetes.io/dockerconfigjson
      engineVersion: v2
      data:
        .dockerconfigjson: '{"auths":{"ghcr.io":{"auth":"{{ printf "ewatkins:%s" .GHCR_TOKEN | b64enc }}"}}}'
  dataFrom:
    - extract:
        # Bitwarden entry from before the Pathfinder rename
        key: drenaslia-leveling-secret
---
# Postgres for the API container: each Keycloak user's saved site data (it creates its own table).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name drenaslia-pathfinder-db
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # straight to the primary rather than pgbouncer: the API's driver uses prepared statements
        DATABASE_URL: '{{ index . "uri" }}'
  dataFrom:
    - extract:
        key: crunchy-postgres-pguser-pathfinder-admin
