---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app drenaslia-pathfinder
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      drenaslia-pathfinder:
        # two pods on different nodes, so a node going down doesn't take the site with it
        replicas: 2
        # start the new pod and wait for it to be ready before stopping the old one, so
        # updates don't take the site down
        strategy: RollingUpdate
        rollingUpdate:
          unavailable: 0
          surge: 1
        containers:
          app:
            # Built by .github/workflows/image.yaml in ewatkins/drenaslia-pathfinder on every
            # push to main as 1.0.<run number>; Renovate opens and automerges the bump.
            image:
              repository: ghcr.io/ewatkins/drenaslia-pathfinder
              tag: 1.0.39
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: *port
                  periodSeconds: 5
                  timeoutSeconds: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 64Mi
    defaultPodOptions:
      enableServiceLinks: false
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: *app
      imagePullSecrets:
        - name: drenaslia-pathfinder-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      # nginx-unprivileged keeps its pid file and temp paths in /tmp
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
