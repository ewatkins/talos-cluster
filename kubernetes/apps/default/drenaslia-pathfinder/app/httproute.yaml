---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drenaslia-pathfinder
  namespace: default
  annotations:
    external-dns.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - "pathfinder.ewatkins.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31449600; includeSubDomains"
      backendRefs:
        - name: drenaslia-pathfinder
          port: 8080
---
# The userscript (Pathfinder Sync), without the Keycloak login: Tampermonkey downloads it (and
# checks it for updates) from its own background page, which doesn't carry the login cookie. The
# SecurityPolicy targets the route above, so this exact path is the only one left open.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drenaslia-pathfinder-userscript
  namespace: default
  annotations:
    external-dns.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - "pathfinder.ewatkins.dev"
  rules:
    - matches:
        - path:
            type: Exact
            value: /drenaslia-pathfinder.user.js
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31449600; includeSubDomains"
      backendRefs:
        - name: drenaslia-pathfinder
          port: 8080
---
# The status endpoint (api/main.go), without the Keycloak login, for uptime checks: it answers ok
# with the image's and the userscript's versions. Like the userscript route, this exact path is the
# only one it opens.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drenaslia-pathfinder-status
  namespace: default
  annotations:
    external-dns.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - "pathfinder.ewatkins.dev"
  rules:
    - matches:
        - path:
            type: Exact
            value: /api/status
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31449600; includeSubDomains"
      backendRefs:
        - name: drenaslia-pathfinder
          port: 8080
