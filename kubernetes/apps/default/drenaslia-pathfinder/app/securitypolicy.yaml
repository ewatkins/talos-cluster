---
# Keycloak login at the gateway; replaces the oauth2-proxy container from docker-compose.
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: SecurityPolicy
metadata:
  name: drenaslia-pathfinder-oidc
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: drenaslia-pathfinder
  oidc:
    provider:
      issuer: https://keycloak.ewatkins.dev/realms/master
    clientID: drenaslia-pathfinder
    clientSecret:
      name: drenaslia-pathfinder-secret
      namespace: default
    redirectURL: "https://pathfinder.ewatkins.dev/oauth2/callback"
    logoutPath: /oauth2/sign_out
    # pass the access token on, so the API knows who's saving (it checks the signature itself),
    # and refresh it when it expires, so saves keep working through a long session
    forwardAccessToken: true
    refreshToken: true
    scopes: ["openid", "profile", "email"]
