---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name pterodactyl-panel-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Both must be carried over verbatim from the LXC's
        # /var/www/pterodactyl/.env. APP_KEY decrypts every stored secret
        # (Wings node tokens, 2FA seeds, API keys); HASHIDS_SALT encodes the
        # server identifiers in URLs. A fresh value for either breaks the
        # migrated data.
        APP_KEY: "{{ .app_key }}"
        HASHIDS_SALT: "{{ .hashids_salt }}"
  dataFrom:
    - extract:
        key: *name
---
# Same Bitwarden item the mariadb-operator User reads in the database
# namespace; the panel reuses that account rather than a dedicated one.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name pterodactyl-db-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        DB_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: pterodactyl-secret
