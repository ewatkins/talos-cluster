---
# Same Bitwarden item the mariadb-operator User reads in the database
# namespace. That one only templates `password`; the panel also needs the two
# app fields, which live alongside it.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name pterodactyl-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Both must be carried over verbatim from the LXC's
        # /opt/pterodactyl-panel/.env. APP_KEY decrypts every stored secret
        # (Wings node tokens, 2FA seeds, API keys, the SMTP password);
        # HASHIDS_SALT encodes the server identifiers in URLs. A fresh value
        # for either breaks the migrated data.
        APP_KEY: "{{ .app_key }}"
        HASHIDS_SALT: "{{ .hashids_salt }}"
        DB_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: *name
