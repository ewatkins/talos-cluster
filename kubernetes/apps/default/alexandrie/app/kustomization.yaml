---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - externalsecret.yaml
  - pvc.yaml
  - helmrelease.yaml
  - httproute.yaml
# Mounted into the theme sidecar. disableNameSuffixHash keeps the name stable,
# so the reloader annotation on the controller is what restarts the pod when
# either file changes.
configMapGenerator:
  - name: alexandrie-theme
    files:
      - nginx.conf=./nginx.conf
      - theme.css=./theme.css
      - theme.js=./theme.js
generatorOptions:
  disableNameSuffixHash: true
  annotations:
    kustomize.toolkit.fluxcd.io/substitute: disabled
