---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: alexandrie
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - "wiki.ewatkins.dev"
  rules:
    # The Go API owns /api; everything else is the Nuxt frontend. Gateway API
    # resolves the longer prefix first, so rule order is not load-bearing.
    - matches:
        - path:
            type: PathPrefix
            value: /api
      filters: &filters
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31449600; includeSubDomains"
      backendRefs:
        - name: alexandrie
          port: 8201
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters: *filters
      backendRefs:
        - name: alexandrie
          port: 8200
