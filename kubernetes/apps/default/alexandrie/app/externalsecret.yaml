---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name alexandrie-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        # iDrive e2 (Minio-compatible), buckets `notes` / `notes-backups`. The
        # backend forces path-style addressing on its public/signing client, so
        # MINIO_PUBLIC_URL is the bare endpoint and object paths are
        # <endpoint>/<bucket>/<key>.
        MINIO_ACCESSKEY: "{{ .s3_access_key_id }}"
        MINIO_SECRETKEY: "{{ .s3_secret_access_key }}"
  dataFrom:
    - extract:
        key: *name
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name alexandrie-db-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        DATABASE_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: *name
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name alexandrie-smtp
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Alexandrie hardcodes implicit TLS on port 465, so it takes a bare host
        # with no port/secure knobs. Used only for password-reset mail.
        SMTP_HOST: "{{ .smtp_host }}"
        SMTP_MAIL: "{{ .smtp_username }}"
        SMTP_PASSWORD: "{{ .smtp_password }}"
  dataFrom:
    - extract:
        key: smtp
