---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name alexandrie-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        JWT_SECRET: "{{ .jwt_secret }}"
        # One keypair, two consumers: the backend authenticates to RustFS with
        # the MINIO_* names, RustFS itself takes the same values as its root
        # credentials under the RUSTFS_* names. Both containers mount this
        # secret wholesale, so the values must match by construction.
        #
        # These are now self-hosted credentials with no meaning outside the
        # cluster -- any high-entropy pair works. The field names are held over
        # from the iDrive e2 attempt.
        #
        # The backend forces path-style addressing on its public/signing
        # client, so MINIO_PUBLIC_URL is the bare endpoint and object paths are
        # <endpoint>/<bucket>/<key>.
        MINIO_ACCESSKEY: "{{ .s3_access_key_id }}"
        MINIO_SECRETKEY: "{{ .s3_secret_access_key }}"
        RUSTFS_ACCESS_KEY: "{{ .s3_access_key_id }}"
        RUSTFS_SECRET_KEY: "{{ .s3_secret_access_key }}"
  dataFrom:
    - extract:
        key: *name
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name alexandrie-db-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        DATABASE_PASSWORD: "{{ .password }}"
  dataFrom:
    - extract:
        key: *name
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name alexandrie-smtp
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Alexandrie hardcodes implicit TLS on port 465, so it takes a bare host
        # with no port/secure knobs. Used only for password-reset mail.
        SMTP_HOST: "{{ .smtp_host }}"
        SMTP_MAIL: "{{ .smtp_username }}"
        SMTP_PASSWORD: "{{ .smtp_password }}"
  dataFrom:
    - extract:
        key: smtp
