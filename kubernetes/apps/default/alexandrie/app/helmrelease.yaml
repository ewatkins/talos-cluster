---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app alexandrie
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      alexandrie:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          # Go/Gin API. Serves everything under /api and owns the schema
          # migrations, so it must reach the Galera primary directly rather
          # than load balancing writes across the cluster.
          backend:
            image:
              repository: ghcr.io/smaug6739/alexandrie-backend
              tag: v8.14.0
            env:
              BACKEND_PORT: &apiPort 8201
              GIN_MODE: release
              TZ: America/Chicago
              FRONTEND_URL: "https://notes.ewatkins.dev"
              COOKIE_DOMAIN: notes.ewatkins.dev
              ALLOW_UNSECURE: "false"
              # Native registration only. The OIDC path does not consult
              # this -- createUserFromOIDC() is reached from the callback and
              # has no signup gate -- so anyone Keycloak authenticates still
              # gets an account provisioned on first login.
              CONFIG_DISABLE_SIGNUP: "true"
              # OIDC-only. The backend returns 403 from POST /api/auth for
              # every username/password attempt; the frontend copy below
              # greys the form out to match. Password reset still works, and
              # still goes nowhere useful for an OIDC account.
              CONFIG_DISABLE_NATIVE_LOGIN: "true"
              # The only way to hold the admin role. LoadAppAdmins() runs on
              # every boot and demotes any admin not listed here, so this is
              # the authoritative set -- removing an ID revokes on next
              # restart. OIDC and native signups both land on the regular role
              # regardless of who registered first.
              #
              # Quoted because these are snowflakes: unquoted, YAML reads them
              # as integers. Split on "," with no trimming, so no spaces.
              ADMIN_ACCOUNTS: "748635670972596225,748637072314728452"
              # Keycloak. Providers are read from indexed OIDC_<n>_* vars; the
              # backend discovers endpoints and negotiates scopes from
              # CONFIG_URL, so only these four are needed. PROVIDER_NAME is
              # lowercased into the callback path (/auth/oidc/keycloak/...) and
              # shown on the login button. The secret arrives via envFrom.
              #
              # Discovery runs once at startup behind a sync.Once: if Keycloak
              # is unreachable then, the provider is dropped with an error in
              # the log and does not come back until the pod restarts.
              OIDC_1_PROVIDER_NAME: Keycloak
              OIDC_1_CLIENT_ID: alexandrie
              OIDC_1_CONFIG_URL: "https://keycloak.ewatkins.dev/realms/master/.well-known/openid-configuration"
              DATABASE_HOST: mariadb-primary.database.svc.cluster.local
              DATABASE_PORT: "3306"
              DATABASE_NAME: alexandrie
              DATABASE_USER: alexandrie
              # In-cluster RustFS, not iDrive e2. The backend calls
              # SetBucketPolicy on boot and os.Exit(1)s if it fails, and e2
              # refuses that call on a bucket-scoped key (the only kind it
              # issues) -- so nothing hosted there can satisfy this app.
              # RustFS is what upstream's compose ships, so the call is known
              # to work against it. It creates `notes` (public-read) and
              # `notes-backups` (private) itself; the -backups suffix is
              # hardcoded in the backend, not configurable.
              #
              # Internal traffic is plaintext inside the cluster; the browser
              # reaches the same store over TLS at MINIO_PUBLIC_URL. The
              # signing client keys off that URL's scheme independently, so
              # MINIO_SECURE only governs the internal hop.
              MINIO_ENDPOINT: alexandrie-rustfs.default.svc.cluster.local:9000
              MINIO_PUBLIC_URL: "https://s3-notes.ewatkins.dev"
              MINIO_SECURE: "false"
              MINIO_BUCKET: notes
              SMTP_MAIL_FROM: "alexandrie@ewatkins.dev"
            envFrom:
              - secretRef:
                  name: alexandrie-secret
              - secretRef:
                  name: alexandrie-db-secret
              - secretRef:
                  name: alexandrie-smtp
            # No HTTP health endpoint is exposed, so probe the listener itself.
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *apiPort
                  periodSeconds: 30
                  failureThreshold: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *apiPort
                  periodSeconds: 10
                  failureThreshold: 3
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *apiPort
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 512Mi
          # Nuxt/Nitro SSR. The NUXT_PUBLIC_* values are baked into the client
          # bundle at container start, so they must be the browser-facing URLs.
          # useApi() appends /api itself, hence BASE_API is the bare origin.
          frontend:
            image:
              repository: ghcr.io/smaug6739/alexandrie-frontend
              tag: v8.14.0
            env:
              PORT: &httpPort 8200
              TZ: America/Chicago
              NUXT_PUBLIC_BASE_URL: "https://notes.ewatkins.dev"
              NUXT_PUBLIC_BASE_API: "https://notes.ewatkins.dev"
              # Deliberately a different hostname from the app: the service
              # worker registers its CDN cache as `url.origin === BASE_CDN`,
              # so sharing an origin with the frontend would put the whole app
              # behind a network-first cache strategy.
              NUXT_PUBLIC_BASE_CDN: "https://s3-notes.ewatkins.dev"
              # Path-style addressing, so this segment is the bucket name and
              # must track MINIO_BUCKET above.
              NUXT_PUBLIC_CDN_ENDPOINT: /notes/
              # Mirrors the backend CONFIG_DISABLE_NATIVE_LOGIN above -- the
              # two are separate variables read by separate processes and
              # have to be flipped together. This one only disables the
              # inputs and prints "login disabled"; the fields stay visible.
              #
              # CONFIG_HIDE_NATIVE_LOGIN, which would remove them, does not
              # work in v8.14.0: nuxt.config declares `configHideNativeLogin`
              # but LoginBase.vue reads `config.public.configHideLoginForm`,
              # and Nuxt only maps env onto keys that are declared. Undefined
              # either way, so the flag is left unset rather than set and
              # silently ignored.
              NUXT_PUBLIC_CONFIG_DISABLE_NATIVE_LOGIN: "true"
              # So the form is hidden by never staying on the page: OIDCProviders
              # calls loginWithProvider() from onMounted and /login bounces
              # straight to Keycloak. Value is lowercased into the API path, and
              # matches OIDC_1_PROVIDER_NAME above.
              #
              # No redirect loop -- the callback lives at /login/oidc/callback,
              # a separate page that does not mount OIDCProviders.
              #
              # If Keycloak is ever down there is no login page to fall back to,
              # since native login is disabled anyway. Recovery is unsetting
              # this and CONFIG_DISABLE_NATIVE_LOGIN.
              NUXT_PUBLIC_CONFIG_OIDC_PROVIDER_AUTO_REDIRECT: keycloak
              # Frontend half of CONFIG_DISABLE_SIGNUP above: page middleware
              # redirects /signup to /login. Same split as native login --
              # the backend enforces, this only hides.
              NUXT_PUBLIC_CONFIG_DISABLE_SIGNUP_PAGE: "true"
              NUXT_PUBLIC_CONFIG_DISABLE_LANDING_PAGE: "true"
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *httpPort
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *httpPort
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 192Mi
              limits:
                memory: 768Mi
          # Injects theme.css into every HTML response on its way out, which is
          # the only way to make a theme instance-wide: Alexandrie's own style
          # injection is a per-user account preference, mounted solely by
          # pages/dashboard.vue, so it never touches the login page and does
          # not exist for a browser that has not signed in.
          #
          # This is what the gateway routes to; the Nuxt container above is
          # reachable only on loopback within the pod.
          theme:
            image:
              repository: docker.io/nginxinc/nginx-unprivileged
              tag: 1.31.5-alpine
            probes:
              liveness: &themeProbe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /__theme.css
                    port: &themePort 8202
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *themeProbe
            resources:
              requests:
                cpu: 10m
                memory: 16Mi
              limits:
                memory: 64Mi
      # S3-compatible object store for wiki media. Its own controller rather
      # than a container in the pod above: it owns a ReadWriteOnce claim, and
      # keeping it separate means an app restart does not interrupt asset
      # serving.
      rustfs:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: docker.io/rustfs/rustfs
              tag: 1.0.0-rc.4
            env:
              TZ: America/Chicago
              RUSTFS_VOLUMES: /data
              RUSTFS_CONSOLE_ENABLE: "false"
              RUSTFS_LOG_LEVEL: info
            envFrom:
              - secretRef:
                  name: alexandrie-secret
            probes:
              liveness: &rustfsProbe
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: &rustfsPort 9000
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *rustfsProbe
              startup:
                enabled: true
                custom: true
                spec:
                  tcpSocket:
                    port: *rustfsPort
                  failureThreshold: 30
                  periodSeconds: 10
            resources:
              requests:
                cpu: 25m
                memory: 128Mi
              limits:
                memory: 1Gi
        pod:
          securityContext:
            # nfs-fast presents as 99:100 and cannot be chowned from the
            # container. The image defaults to uid 10001; its entrypoint makes
            # no uid assumptions, so running as the share owner is safe.
            runAsUser: 99
            runAsGroup: 100
            fsGroup: 100
            fsGroupChangePolicy: OnRootMismatch
    # forceRename on both: with more than one service defined, app-template
    # names them <release>-<identifier>, which would rename the `alexandrie`
    # Service out from under the HTTPRoute.
    service:
      app:
        controller: *app
        forceRename: alexandrie
        ports:
          # The gateway talks to the theme sidecar, not to Nuxt directly.
          http:
            port: *themePort
          api:
            port: *apiPort
      rustfs:
        controller: rustfs
        forceRename: alexandrie-rustfs
        ports:
          http:
            port: *rustfsPort
    persistence:
      theme:
        type: configMap
        name: alexandrie-theme
        advancedMounts:
          alexandrie:
            theme:
              - path: /etc/nginx/nginx.conf
                subPath: nginx.conf
                readOnly: true
              - path: /etc/alexandrie/theme.css
                subPath: theme.css
                readOnly: true
              - path: /etc/alexandrie/theme.js
                subPath: theme.js
                readOnly: true
      cdn:
        existingClaim: alexandrie-cdn
        advancedMounts:
          rustfs:
            app:
              - path: /data
      logs:
        type: emptyDir
        advancedMounts:
          rustfs:
            app:
              - path: /logs
    ingress:
      app:
        enabled: false
