# Injects theme.css into every HTML response from the Nuxt frontend.
#
# Alexandrie's own style injection is a per-user account preference and never
# runs on the public pages, so an instance-wide default has to be added to the
# markup on the way out. This sidecar is the only thing the gateway talks to;
# the Nuxt container stays on loopback.
worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log off;
  sendfile on;

  # The unprivileged image runs as uid 101 with no writable /var/run.
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  server {
    listen 8202;
    server_name _;

    # Served to the browser by the <link> injected below. Kept as its own
    # request rather than an inline <style> so the CSS stays a plain file in
    # Git with no escaping, and so the browser can cache it.
    location = /__theme.css {
      alias /etc/alexandrie/theme.css;
      types { }
      default_type text/css;
      add_header Cache-Control "public, max-age=300";
    }

    location / {
      proxy_pass http://127.0.0.1:8200;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;

      # sub_filter works on the response body, so the upstream must not
      # compress it. Nitro honours this and sends the HTML in plain text;
      # the gateway compresses again on the way to the browser.
      proxy_set_header Accept-Encoding "";

      # Last thing in <head>, so it lands after Nuxt's own stylesheets.
      sub_filter '</head>' '<link rel="stylesheet" href="/__theme.css"></head>';
      sub_filter_types text/html;
      sub_filter_once on;
    }
  }
}
