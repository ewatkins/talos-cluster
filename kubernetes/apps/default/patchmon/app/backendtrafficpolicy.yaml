---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: patchmon-idle-timeout
  namespace: default
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: patchmon
  timeout:
    http:
      # patchmon closes idle keep-alives at 60s; Gatus polls every 60s, so envoy
      # would sometimes reuse a connection the server was closing (503 UC).
      connectionIdleTimeout: "30s"
