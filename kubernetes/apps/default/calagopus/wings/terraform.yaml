---
# The Wings VMs, one per game mode, defined in terraform/wings and applied by
# tofu-controller. Plans wait for approval (see approvePlan below and
# ../WINGS.md).
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: calagopus-wings
  namespace: calagopus-wings
spec:
  interval: 1h
  path: ./terraform/wings
  sourceRef:
    kind: GitRepository
    name: talos-cluster
    namespace: flux-system
  # Empty: plan, then wait. Approve in the cluster, not in Git:
  #   kubectl -n calagopus-wings patch terraform calagopus-wings --type merge \
  #     -p '{"spec":{"approvePlan":"<plan ID>"}}'
  # A Git commit cannot approve: the controller sees the new revision before
  # Flux applies the approval and replaces the pending plan. Flux later resets
  # this field to "", which matches no plan.
  approvePlan: ""
  # The plan as text, in ConfigMap tfplan-default-calagopus-wings.
  storeReadablePlan: human
  # Removing this object must never delete the VMs (or their game data).
  destroyResourcesOnDeletion: false
  # Namespace-scoped; see rbac.yaml.
  serviceAccountName: calagopus-wings-runner
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: calagopus-wings-secret
      volumes:
        - name: known-hosts
          configMap:
            name: calagopus-wings-known-hosts
      volumeMounts:
        - name: known-hosts
          mountPath: /home/runner/.ssh/known_hosts
          subPath: known_hosts
          readOnly: true
