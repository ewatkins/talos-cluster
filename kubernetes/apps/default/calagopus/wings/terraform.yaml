---
# The Wings VMs, one per game mode, defined in terraform/wings and applied by
# tofu-controller when a change is merged (see approvePlan below and
# ../WINGS.md).
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: calagopus-wings
  namespace: calagopus-wings
spec:
  interval: 1h
  path: ./terraform/wings
  sourceRef:
    kind: GitRepository
    name: talos-cluster
    namespace: flux-system
  # Merging is the approval: every plan from main is applied. Review it on the
  # PR first, where the branch planner posts it as a comment (see
  # flux-system/tofu-controller). Power state and node placement are left to
  # Proxmox (ignore_changes in terraform/wings), so rollbacks and HA moves
  # are not undone here.
  approvePlan: auto
  # The plan as text, in ConfigMap tfplan-default-calagopus-wings.
  storeReadablePlan: human
  # Removing this object must never delete the VMs (or their game data).
  destroyResourcesOnDeletion: false
  # Namespace-scoped; see rbac.yaml.
  serviceAccountName: calagopus-wings-runner
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: calagopus-wings-secret
      volumes:
        - name: known-hosts
          configMap:
            name: calagopus-wings-known-hosts
      volumeMounts:
        - name: known-hosts
          mountPath: /home/runner/.ssh/known_hosts
          subPath: known_hosts
          readOnly: true
