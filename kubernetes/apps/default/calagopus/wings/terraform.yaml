---
# The Wings VMs, one per game mode, defined in terraform/wings and applied by
# tofu-controller. Plans wait for approval: commit the plan ID shown by
# `kubectl -n calagopus-wings get terraform calagopus-wings` as `approvePlan`. See
# ../WINGS.md.
apiVersion: infra.contrib.fluxcd.io/v1alpha2
kind: Terraform
metadata:
  name: calagopus-wings
  namespace: calagopus-wings
spec:
  interval: 1h
  path: ./terraform/wings
  sourceRef:
    kind: GitRepository
    name: talos-cluster
    namespace: flux-system
  # Empty: plan, then wait for a committed approval. Set to the plan ID to
  # apply that plan; a stale ID matches nothing and is harmless.
  approvePlan: "plan-main-b9f0382091"
  # The plan as text, in ConfigMap tfplan-default-calagopus-wings.
  storeReadablePlan: human
  # Removing this object must never delete the VMs (or their game data).
  destroyResourcesOnDeletion: false
  # Namespace-scoped; see rbac.yaml.
  serviceAccountName: calagopus-wings-runner
  runnerPodTemplate:
    spec:
      envFrom:
        - secretRef:
            name: calagopus-wings-secret
      volumes:
        - name: known-hosts
          configMap:
            name: calagopus-wings-known-hosts
      volumeMounts:
        - name: known-hosts
          mountPath: /home/runner/.ssh/known_hosts
          subPath: known_hosts
          readOnly: true
