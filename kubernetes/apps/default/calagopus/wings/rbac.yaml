---
# The runner pod's identity. The chart's own `tf-runner` account is bound to a
# ClusterRole with read/write on every Secret in the cluster; this one can
# touch Secrets, ConfigMaps and Leases in this namespace only, which is all the
# runner needs: state (kubernetes backend), its lock, and the plan.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: calagopus-wings-runner
  namespace: calagopus-wings
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: calagopus-wings-runner
  namespace: calagopus-wings
rules:
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: calagopus-wings-runner
  namespace: calagopus-wings
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: calagopus-wings-runner
subjects:
  - kind: ServiceAccount
    name: calagopus-wings-runner
    namespace: calagopus-wings
