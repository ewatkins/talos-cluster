---
# Credentials the OpenTofu runner uses against Proxmox. Both are scoped down;
# see terraform/wings/README.md for what each can and cannot do.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name calagopus-wings-secret
  namespace: calagopus-wings
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # terraform@pve!tofu=<secret>
        PROXMOX_VE_API_TOKEN: "{{ .proxmox_api_token }}"
        # The SFTP-only `tofu-snippets` user on pve01 (cloud-init uploads).
        # Stored base64-encoded (`base64 -w0`) so the multi-line key fits in
        # one JSON string; the provider wants it decoded.
        PROXMOX_VE_SSH_PRIVATE_KEY: "{{ .ssh_private_key | b64dec }}"
  dataFrom:
    - extract:
        key: tofu-wings-secret
