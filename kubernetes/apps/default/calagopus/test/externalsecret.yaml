---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name calagopus-test-secret
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Encrypts the node tokens the panel stores, so it must outlive the
        # namespace (the database does) and never change.
        APP_ENCRYPTION_KEY: "{{ .encryption_key }}"
  dataFrom:
    - extract:
        key: calagopus-test-secret
---
# The seed Job's admin login; kept out of the panel's environment.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name calagopus-test-admin
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        ADMIN_EMAIL: "{{ .admin_email }}"
        ADMIN_PASSWORD: "{{ .admin_password }}"
  dataFrom:
    - extract:
        key: calagopus-test-secret
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name calagopus-test-db-secret
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Session-mode pgBouncer, as for the production panel.
        DATABASE_URL: '{{ index . "pgbouncer-uri" }}'
  dataFrom:
    - extract:
        key: crunchy-postgres-17-pguser-calagopus-test
