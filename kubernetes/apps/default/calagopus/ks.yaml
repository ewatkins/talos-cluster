---
# yaml-language-server: $schema=https://lds-schemas.pages.dev/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app calagopus
  namespace: flux-system
spec:
  targetNamespace: default
  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  components:
    - ../../../../components/gatus/internal
  dependsOn:
    - name: external-secrets-stores
    - name: crunchy-postgres-17
    - name: crunchy-postgres-operator-secretstore
    # Only for the read-only import account; see ./README.md.
    - name: mariadb-cluster
  path: ./kubernetes/apps/default/calagopus/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: talos-cluster
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 5m
  postBuild:
    substitute:
      APP: *app
      GATUS_SUBDOMAIN: calagopus
