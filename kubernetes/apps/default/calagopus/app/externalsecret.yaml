---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name calagopus-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # A fresh random value (`openssl rand -base64 32`), deliberately not
        # Pterodactyl's APP_KEY. Every secret the panel stores (Wings node
        # tokens, 2FA seeds, backup credentials) is encrypted with it, so it
        # must be in Bitwarden before the first boot and never change after.
        APP_ENCRYPTION_KEY: "{{ .encryption_key }}"
  dataFrom:
    - extract:
        key: *name
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name calagopus-db-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Through pgBouncer, which runs in session mode on this cluster, so
        # sqlx's prepared statements are safe.
        DATABASE_URL: '{{ index . "pgbouncer-uri" }}'
  dataFrom:
    - extract:
        key: crunchy-postgres-17-pguser-calagopus
