---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name calagopus-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # A fresh random value (`openssl rand -base64 32`), deliberately not
        # Pterodactyl's APP_KEY. Every secret the panel stores (Wings node
        # tokens, 2FA seeds, backup credentials) is encrypted with it, so it
        # must be in Bitwarden before the first boot and never change after.
        APP_ENCRYPTION_KEY: "{{ .encryption_key }}"
  dataFrom:
    - extract:
        key: *name
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name calagopus-db-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Through pgBouncer, which runs in session mode on this cluster, so
        # sqlx's prepared statements are safe.
        DATABASE_URL: '{{ index . "pgbouncer-uri" }}'
  dataFrom:
    - extract:
        key: crunchy-postgres-17-pguser-calagopus
---
# The environment file `calagopus-panel import pterodactyl --environment`
# reads. Mounted at /import/ptero.env; only used during the migration and
# removed with the Pterodactyl decommission (see ../README.md).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name calagopus-import-env
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      data:
        # APP_URL becomes the imported panel URL setting, so it is the new
        # hostname rather than Pterodactyl's. APP_KEY is Pterodactyl's and is
        # needed to decrypt what the importer reads (node tokens, 2FA seeds).
        # The database account is read-only: the importer cannot change the
        # Pterodactyl database even by mistake.
        ptero.env: |
          APP_URL=https://calagopus.ewatkins.dev
          APP_KEY={{ .ptero_app_key }}
          DB_HOST=mariadb-primary.database.svc.cluster.local
          DB_PORT=3306
          DB_DATABASE=pterodactyl
          DB_USERNAME=calagopus-import
          DB_PASSWORD="{{ .import_password }}"
  dataFrom:
    - extract:
        key: pterodactyl-secret
      rewrite:
        - regexp:
            source: "(.*)"
            target: "ptero_$1"
    - extract:
        key: calagopus-import-secret
      rewrite:
        - regexp:
            source: "(.*)"
            target: "import_$1"
