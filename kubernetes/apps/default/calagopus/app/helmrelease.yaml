---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app calagopus
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      calagopus:
        # DATABASE_MIGRATE runs the schema migrations on every boot; two pods
        # overlapping during a rollout would race them.
        strategy: Recreate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          # Panel only. Wings stays on the VLAN 50 VMs: it needs a Docker
          # daemon, which Talos does not have. See ../README.md and
          # ../WINGS.md.
          app:
            # The heavy image carries the Rust and Node toolchains, so the
            # panel can recompile itself when an extension is installed.
            # Without extensions its supervisor runs the stock binary.
            image:
              repository: ghcr.io/calagopus/panel
              tag: 1.2.6-heavy@sha256:34c1ea771a84c237ad5f351426eaebeb834ddaff4cfa1e88a467a7720dd4dcf9
            env:
              TZ: UTC
              PORT: "8000"
              APP_DEBUG: "false"
              # The only replica, so it also runs the background tasks.
              APP_PRIMARY: "true"
              DATABASE_MIGRATE: "true"
              APP_LOG_DIRECTORY: /var/log/calagopus
              # Off for now: browsers keep reaching Wings directly at
              # wing-*.ewatkins.dev:8080 through the internal gateway, as
              # they did with Pterodactyl.
              APP_ENABLE_WINGS_PROXY: "false"
              APP_USE_DECRYPTION_CACHE: "true"
              APP_USE_INTERNAL_CACHE: "true"
              # TLS ends at the internal gateway; trust its X-Forwarded-For so
              # logins and rate limits see the real client address.
              APP_TRUSTED_PROXIES: 10.69.0.0/16
              # Shared Dragonfly. Every key is prefixed `calagopus::`, which
              # keeps it apart from the other tenants.
              REDIS_URL: redis://dragonfly.database.svc.cluster.local:6379
              REDIS_KEY_PREFIX: calagopus
            envFrom:
              - secretRef:
                  name: calagopus-secret
              - secretRef:
                  name: calagopus-db-secret
            # The frontend is served from `/`; the startup probe covers the
            # migrations, which run before the listener comes up.
            probes:
              liveness: &probe
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 8000
                  periodSeconds: 30
                  failureThreshold: 3
              readiness: *probe
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: *port
                  failureThreshold: 60
                  periodSeconds: 10
            resources:
              requests:
                cpu: 50m
                memory: 128Mi
              # Extension builds run cargo in this container and spike RAM.
              # Build jobs are sized at one per 2 GiB of this limit.
              limits:
                memory: 6Gi
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      # The filesystem storage driver (avatars, uploaded assets). On nfs-fast
      # so it survives a node loss and is covered by the NAS backups.
      data:
        type: persistentVolumeClaim
        # Created as the only PVC, so named after the release. Pinned so the
        # build volume below does not rename it to calagopus-data, which
        # would replace it with an empty one.
        forceRename: calagopus
        storageClass: nfs-fast
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /var/lib/calagopus
      # The heavy image's build state: compiled binaries, merged
      # translations, uploaded extension archives and their migrations.
      # Kept so a restart reuses the last build instead of recompiling.
      build:
        type: persistentVolumeClaim
        storageClass: nfs-fast
        accessMode: ReadWriteOnce
        size: 5Gi
        globalMounts:
          - path: /app/binaries
            subPath: binaries
          - path: /app/translations
            subPath: translations
          - path: /app/extensions
            subPath: extensions
          - path: /app/repo/database/extension-migrations
            subPath: extension-migrations
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/log/calagopus
    ingress:
      app:
        enabled: false
