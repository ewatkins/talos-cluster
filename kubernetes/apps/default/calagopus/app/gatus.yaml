---
# Game servers on VLAN 50, pinged from inside the cluster. The addresses are
# private and shown on the page on purpose; dont-resolve-failed-conditions
# keeps the reply (MOTD, player sample, raw packet bytes) off the page when a
# check fails.
#
# Java checks send a Server List Ping: handshake (protocol 0, host
# "localhost", port 0, next state status) then a status request. The server
# answers with its status JSON; Paper puts the MOTD first, so match on
# "description", which always lands inside the 1 KiB Gatus reads. Protocol
# and port are 0 because servers ignore them for a status ping, and YAML
# escapes above \x7f are re-encoded as UTF-8, which would corrupt the packet.
#
# The Bedrock check sends a RakNet unconnected ping (0x01, time 0, magic,
# guid 0) to Geyser on the proxy, after a PROXY v2 header (Geyser takes the
# player address from it, like Velocity). The bytes go above \x7f, so the
# body is !!binary; Geyser answers with an unconnected pong ("MCPE;...").
#
# Velocity has haproxy-protocol = true (the Oracle relay sends a PROXY v2
# header), so it drops any connection that doesn't start with one; the
# velocity check sends a PROXY v1 line first. The backends behind Velocity
# don't use PROXY, so their checks are unchanged.
#
# The relay-* checks go the way players do: mc.ewatkins.dev, the Oracle relay
# VM, then back in through the home port forwards to Velocity/Geyser.
apiVersion: v1
kind: ConfigMap
metadata:
  name: minecraft-gatus-ep
  labels:
    gatus.io/enabled: "true"
data:
  config.yaml: |
    endpoints:
      - name: velocity
        group: Minecraft
        url: tcp://192.168.50.100:25565
        body: "PROXY TCP4 127.0.0.1 192.168.50.100 1 25565\r\n\x0f\x00\x00\x09localhost\x00\x00\x01\x01\x00"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
          - '[BODY] == pat(*"description"*)'
        ui: { dont-resolve-failed-conditions: true }
        alerts:
          - type: pushover
      - name: lobby
        group: Minecraft
        url: tcp://192.168.50.99:25565
        body: "\x0f\x00\x00\x09localhost\x00\x00\x01\x01\x00"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
          - '[BODY] == pat(*"description"*)'
        ui: { dont-resolve-failed-conditions: true }
        alerts:
          - type: pushover
      - name: homestead
        group: Minecraft
        url: tcp://192.168.50.20:25565
        body: "\x0f\x00\x00\x09localhost\x00\x00\x01\x01\x00"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
          - '[BODY] == pat(*"description"*)'
        ui: { dont-resolve-failed-conditions: true }
        alerts:
          - type: pushover
      - name: iridium
        group: Minecraft
        url: tcp://192.168.50.30:25565
        body: "\x0f\x00\x00\x09localhost\x00\x00\x01\x01\x00"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
          - '[BODY] == pat(*"description"*)'
        ui: { dont-resolve-failed-conditions: true }
        alerts:
          - type: pushover
      - name: atlas
        group: Minecraft
        url: tcp://192.168.50.10:25565
        body: "\x0f\x00\x00\x09localhost\x00\x00\x01\x01\x00"
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
          - '[BODY] == pat(*"description"*)'
        ui: { dont-resolve-failed-conditions: true }
        alerts:
          - type: pushover
      - name: velocity-bedrock
        group: Minecraft
        url: udp://192.168.50.100:19132
        body: !!binary DQoNCgANClFVSVQKIRIADH8AAAHAqDJkAAFKvAEAAAAAAAAAAAD//wD+/v7+/f39/RI0VngAAAAAAAAAAA==
        interval: 1m
        conditions:
          - "[CONNECTED] == true"
          - "[BODY] == pat(*MCPE;*)"
        ui: { dont-resolve-failed-conditions: true }
        alerts:
          - type: pushover
      - name: relay-java
        group: Minecraft
        url: tcp://mc.ewatkins.dev:25565
        body: "\x0f\x00\x00\x09localhost\x00\x00\x01\x01\x00"
        interval: 2m
        conditions:
          - "[CONNECTED] == true"
          - '[BODY] == pat(*"description"*)'
        ui: { dont-resolve-failed-conditions: true }
        alerts:
          - type: pushover
      - name: relay-bedrock
        group: Minecraft
        url: udp://mc.ewatkins.dev:19132
        body: !!binary AQAAAAAAAAAAAP//AP7+/v79/f39EjRWeAAAAAAAAAAA
        interval: 2m
        conditions:
          - "[CONNECTED] == true"
          - "[BODY] == pat(*MCPE;*)"
        ui: { dont-resolve-failed-conditions: true }
        alerts:
          - type: pushover
