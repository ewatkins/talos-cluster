---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app drenaslia-leveling
  namespace: default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      drenaslia-leveling:
        containers:
          app:
            # Built by .github/workflows/image.yaml in ewatkins/drenaslia-leveling on every
            # push to main as 1.0.<run number>; Renovate opens and automerges the bump.
            image:
              repository: ghcr.io/ewatkins/drenaslia-leveling
              tag: 1.0.27@sha256:a50d712e0dbf32686051a80c1934859e02155659832d42b05407a9dc9cccfe1a
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /healthz
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: [ALL] }
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 64Mi
    defaultPodOptions:
      enableServiceLinks: false
      imagePullSecrets:
        - name: drenaslia-leveling-ghcr
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
    service:
      app:
        controller: *app
        ports:
          http:
            port: *port
    persistence:
      # nginx-unprivileged keeps its pid file and temp paths in /tmp
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
