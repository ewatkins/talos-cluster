---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drenaslia-leveling
  namespace: default
  annotations:
    external-dns.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - "drenaslia.ewatkins.dev"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31449600; includeSubDomains"
      backendRefs:
        - name: drenaslia-leveling
          port: 8080
---
# The userscript, without the Keycloak login: Tampermonkey downloads it (and checks it for
# updates) from its own background page, which doesn't carry the login cookie. The
# SecurityPolicy targets the route above, so this exact path is the only one left open.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: drenaslia-leveling-userscript
  namespace: default
  annotations:
    external-dns.kubernetes.io/target: "internal.ewatkins.dev"
spec:
  parentRefs:
    - name: internal
      namespace: network
      sectionName: https
  hostnames:
    - "drenaslia.ewatkins.dev"
  rules:
    - matches:
        - path:
            type: Exact
            value: /drenaslia-levels.user.js
      filters:
        - type: ResponseHeaderModifier
          responseHeaderModifier:
            add:
              - name: Strict-Transport-Security
                value: "max-age=31449600; includeSubDomains"
      backendRefs:
        - name: drenaslia-leveling
          port: 8080
