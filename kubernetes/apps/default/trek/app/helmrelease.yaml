---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: trek
spec:
  interval: 1h
  chart:
    spec:
      chart: trek
      version: 4.2.1
      sourceRef:
        kind: HelmRepository
        name: trek
        namespace: flux-system
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    image:
      repository: mauriceboe/trek
      tag: 4.2.1
    service:
      type: ClusterIP
      port: 3000
    env:
      NODE_ENV: production
      PORT: 3000
      TZ: America/Chicago
      APP_URL: https://trek.ewatkins.dev
      ALLOWED_ORIGINS: https://trek.ewatkins.dev
      FORCE_HTTPS: "false"
      TRUST_PROXY: "1"
    existingSecret: trek-secret
    existingSecretKey: ENCRYPTION_KEY
    persistence:
      enabled: true
      data:
        size: 2Gi
        storageClassName: nfs-slow
      uploads:
        size: 5Gi
        storageClassName: nfs-slow
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 512Mi
    ingress:
      enabled: false
  postRenderers:
    - kustomize:
        patches:
          - target:
              kind: Deployment
              name: trek
            patch: |
              - op: add
                path: /spec/template/metadata/labels/app.kubernetes.io~1name
                value: trek
              # The chart hardcodes both probes and sets no timeoutSeconds, so
              # Kubernetes defaults them to 1s. Brief hypervisor-wide VM stalls
              # (seen cluster-wide, multiple nodes at once) blow a 1s deadline
              # and liveness then kills a perfectly healthy container after
              # 3x30s. Give the probes room to ride out a stall.
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe/timeoutSeconds
                value: 5
              - op: add
                path: /spec/template/spec/containers/0/livenessProbe/failureThreshold
                value: 5
              - op: add
                path: /spec/template/spec/containers/0/readinessProbe/timeoutSeconds
                value: 5
              - op: add
                path: /spec/template/spec/containers/0/readinessProbe/failureThreshold
                value: 3
