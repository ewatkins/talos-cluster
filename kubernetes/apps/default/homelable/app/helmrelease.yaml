---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app homelable
  namespace: &namespace default
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  maxHistory: 2
  install:
    remediation:
      retries: 3
  upgrade:
    cleanupOnFail: true
    remediation:
      strategy: rollback
      retries: 3
  values:
    controllers:
      homelable:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/pouzor/homelable-backend
              tag: 3.3.5@sha256:61cdcc68330e1eb58cd7cb0a2c67685c046d26ee3fd64a0cf49ec4a689811fa0
            env:
              TZ: ${TIMEZONE}
              SQLITE_PATH: /app/data/homelab.db
              CORS_ORIGINS: '["https://homelab.ewatkins.dev"]'
              # SCANNER_RANGES is deliberately absent: it is one of the
              # values persisted to scan_config.json on the PVC, and that file
              # wins at startup, so declaring it here only ever lied about what
              # the app scans. Manage the ranges from Settings in the UI.
              # OIDC via Keycloak. This is exclusive: it replaces the local
              # AUTH_USERNAME / AUTH_PASSWORD_HASH login rather than adding to
              # it. OIDC_CLIENT_SECRET comes from the homelable-secret
              # Bitwarden entry through envFrom below. The backend fails to
              # start if any required value is missing, SECRET_KEY is under 32
              # bytes, or CORS_ORIGINS contains a wildcard.
              AUTH_MODE: oidc
              OIDC_DISCOVERY_URL: https://keycloak.ewatkins.dev/realms/master/.well-known/openid-configuration
              OIDC_CLIENT_ID: homelable
              # Must match the Keycloak client's redirect URI exactly, path included
              OIDC_REDIRECT_URI: https://homelab.ewatkins.dev/api/v1/auth/oidc/callback
              OIDC_SCOPES: "openid profile email"
              OIDC_COOKIE_SECURE: "true"
              # Proxmox VE auto-sync. The importer reads /nodes, which returns
              # every cluster member, so pointing at pve01 pulls pve02 and
              # pve03 (and their VMs/LXC) in as well. Keep the FQDN here: the
              # PVE cert is not valid for the bare 10.35.1.1 address, so the
              # bare IP would force PROXMOX_VERIFY_TLS off.
              # PROXMOX_TOKEN_SECRET comes from homelable-secret via envFrom.
              PROXMOX_HOST: pve01.ewatkins.dev
              PROXMOX_PORT: "8006"
              PROXMOX_VERIFY_TLS: "true"
              # Must match the token created in Proxmox exactly (user@realm!tokenid)
              PROXMOX_TOKEN_ID: homelable@pve!homelable
              # Note: these two are also persisted to scan_config.json on the
              # PVC once auto-sync is touched in the UI, and the file wins at
              # startup — treat them as first-boot defaults, not binding config.
              PROXMOX_SYNC_ENABLED: "true"
              PROXMOX_SYNC_INTERVAL: "3600"
              # Read-only stats at /api/v1/stats/summary for the homepage
              # widget, gated on the X-API-Key header. Enabled by the presence
              # of HOMEPAGE_API_KEY, which arrives via envFrom.
            envFrom:
              - secretRef:
                  name: homelable-secret
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/v1/health
                    port: 8000
                  initialDelaySeconds: 15
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 6
              readiness: *probes
            securityContext:
              # PSS baseline forbids adding NET_RAW; run unprivileged instead —
              # nmap falls back to TCP-connect scans and ping uses ICMP datagram
              # sockets via the ping_group_range sysctl below.
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 512Mi
          frontend:
            image:
              repository: ghcr.io/pouzor/homelable-frontend
              tag: 3.3.5@sha256:720b0d3f9b5083b6cbf63ddb667510609ed9f6914531a82a981c848c22286f42
            securityContext:
              allowPrivilegeEscalation: false
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 128Mi
          mcp:
            image:
              repository: ghcr.io/pouzor/homelable-mcp
              tag: 3.3.5@sha256:9c09208179487a3e8e6cb3c8f66c6fbc18978e08f90f08d6d7779cf94888c4dc
            env:
              TZ: ${TIMEZONE}
              BACKEND_URL: http://127.0.0.1:8000
            envFrom:
              - secretRef:
                  name: homelable-secret
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
              allowPrivilegeEscalation: false
              capabilities:
                drop: ["ALL"]
            resources:
              requests:
                cpu: 5m
              limits:
                memory: 256Mi
    defaultPodOptions:
      enableServiceLinks: false
      securityContext:
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        sysctls:
          # Allow unprivileged ICMP echo (ping status checks) without NET_RAW
          - name: net.ipv4.ping_group_range
            value: "0 2147483647"
    service:
      app:
        controller: *app
        ports:
          http:
            port: 80
          api:
            port: 8000
          mcp:
            port: 8001
    persistence:
      data:
        existingClaim: homelable-data
        advancedMounts:
          homelable:
            app:
              - path: /app/data
      nginx-conf:
        type: configMap
        name: homelable-nginx
        advancedMounts:
          homelable:
            frontend:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
