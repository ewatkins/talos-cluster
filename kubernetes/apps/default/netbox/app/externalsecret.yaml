---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name netbox-db-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: crunchy-postgres
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        DB_HOST: '{{ index . "pgbouncer-host" }}'
        DB_PORT: '{{ index . "pgbouncer-port" }}'
        DB_NAME: '{{ index . "dbname" }}'
        DB_USER: '{{ index . "user" }}'
        DB_PASSWORD: '{{ index . "password" }}'
  dataFrom:
    - extract:
        key: crunchy-postgres-pguser-netbox-admin
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: &name netbox-secret
  namespace: default
spec:
  refreshInterval: 15m
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secrets-manager
  target:
    name: *name
    template:
      engineVersion: v2
      metadata:
        annotations:
          reloader.stakater.com/match: "true"
      data:
        # Django SECRET_KEY — at least 50 random characters
        SECRET_KEY: "{{ .SECRET_KEY }}"
        SUPERUSER_PASSWORD: "{{ .SUPERUSER_PASSWORD }}"
        SUPERUSER_API_TOKEN: "{{ .SUPERUSER_API_TOKEN }}"
        # Peppers the v2 API token hashes; must be at least 50 characters
        API_TOKEN_PEPPER_1: "{{ .API_TOKEN_PEPPER_1 }}"
  dataFrom:
    - extract:
        key: *name
