---
apiVersion: v1
kind: ConfigMap
metadata:
  name: netbox-sso
  namespace: default
data:
  # Loaded by netbox-docker alongside configuration.py (every *.py in
  # /etc/netbox/config is merged into the NetBox configuration).
  sso.py: |
    # Endpoint, client ID and secret are plain SOCIAL_AUTH_OIDC_* env vars on
    # the HelmRelease; this file holds what env vars can't express.

    # TLS terminates at Envoy, so Django sees plain HTTP and would otherwise
    # hand Keycloak an http:// redirect URI.
    SOCIAL_AUTH_REDIRECT_IS_HTTPS = True

    # Keycloak is the only way in through the UI. The local admin account
    # still exists; set this to False to bring its login form back.
    LOGIN_FORM_HIDDEN = True

    # Button label and MDI icon on the login page
    SOCIAL_AUTH_BACKEND_ATTRS = {
        'oidc': ('Login with Keycloak', 'fingerprint'),
    }

    # NetBox has no custom-CSS setting, but the login banner is rendered as raw
    # HTML above the login card, so a <style> block there restyles the SSO
    # button. The selector follows the button's link target; if a NetBox upgrade
    # changes the login markup the button just falls back to the stock look.
    BANNER_LOGIN = """
    <style id="sso-style">
    /* The banner holds nothing visible; drop the gap its wrapper would leave */
    div.mb-5.text-center:has(> #sso-style) { display: none; }

    a.btn[href^="/oauth/login/oidc/"] {
      display: flex; align-items: center; justify-content: center; gap: .6rem;
      padding: calc(.85rem - 1px) 1.25rem;
      font-size: 1.05rem; font-weight: 600; letter-spacing: .01em;
      /* --tblr-primary is NetBox's teal, and switches shade with the theme */
      color: var(--tblr-primary);
      background: color-mix(in srgb, var(--tblr-primary) 12%, transparent);
      border: 1px solid color-mix(in srgb, var(--tblr-primary) 35%, transparent);
      border-radius: 10px;
      box-shadow: none;
      transition: background .15s ease, border-color .15s ease;
    }
    a.btn[href^="/oauth/login/oidc/"] .mdi { font-size: 1.5rem; line-height: 1; margin: 0; }
    a.btn[href^="/oauth/login/oidc/"]:hover {
      color: var(--tblr-primary);
      background: color-mix(in srgb, var(--tblr-primary) 20%, transparent);
      border-color: color-mix(in srgb, var(--tblr-primary) 55%, transparent);
    }
    a.btn[href^="/oauth/login/oidc/"]:active { background: color-mix(in srgb, var(--tblr-primary) 28%, transparent); }
    a.btn[href^="/oauth/login/oidc/"]:focus-visible { outline: 3px solid color-mix(in srgb, var(--tblr-primary) 45%, transparent); outline-offset: 2px; }
    </style>
    """

    # NetBox's default pipeline plus the superuser sync below
    SOCIAL_AUTH_PIPELINE = (
        'social_core.pipeline.social_auth.social_details',
        'social_core.pipeline.social_auth.social_uid',
        'social_core.pipeline.social_auth.social_user',
        'social_core.pipeline.user.get_username',
        'social_core.pipeline.user.create_user',
        'social_core.pipeline.social_auth.associate_user',
        'netbox.authentication.user_default_groups_handler',
        'social_core.pipeline.social_auth.load_extra_data',
        'social_core.pipeline.user.user_details',
        'keycloak_auth.sync_superuser',
    )

  # Mounted into /opt/netbox/netbox so the pipeline can import it by name.
  keycloak_auth.py: |
    import logging

    import jwt

    logger = logging.getLogger('netbox.auth.keycloak')

    CLIENT_ID = 'netbox'
    ADMIN_ROLE = 'admin'


    def sync_superuser(backend, user=None, response=None, *args, **kwargs):
        """
        Mirror the Keycloak client role `admin` (on the `netbox` client) onto
        the NetBox superuser flag at every SSO login. Users without the role
        are still created, but hold no permissions until granted some.
        """
        if backend.name != 'oidc' or user is None or not response:
            return

        # The access token came straight from the token endpoint over TLS, so
        # its claims are read without re-verifying the signature.
        try:
            claims = jwt.decode(response['access_token'], options={'verify_signature': False})
        except (KeyError, jwt.PyJWTError) as e:
            logger.warning(f"Could not read roles for {user}: {e!r}; leaving superuser flag unchanged")
            return

        roles = claims.get('resource_access', {}).get(CLIENT_ID, {}).get('roles', [])
        is_admin = ADMIN_ROLE in roles
        if user.is_superuser != is_admin:
            logger.info(f"Setting is_superuser={is_admin} for {user}")
            user.is_superuser = is_admin
            user.save(update_fields=['is_superuser'])
