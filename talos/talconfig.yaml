---
clusterName: great-lakes
# renovate: datasource=docker depName=ghcr.io/siderolabs/installer
talosVersion: v1.13.9
# renovate: datasource=docker depName=ghcr.io/siderolabs/kubelet
kubernetesVersion: v1.37.0
endpoint: https://192.168.40.10:6443
allowSchedulingOnControlPlanes: true
cniConfig:
  name: none
additionalApiServerCertSans:
  - cluster.local
clusterPodNets:
  - 10.69.0.0/16
clusterSvcNets:
  - 10.96.0.0/16
patches:
  - |-
    machine:
      kubelet:
        nodeIP:
          validSubnets:
            - 192.168.40.0/24
        extraMounts:
          - destination: /var/openebs/local
            type: bind
            source: /var/openebs/local
            options:
              - rbind
              - rshared
              - rw
        extraArgs:
          rotate-server-certificates: "true"
        extraConfig:
          # Prune unused images well before the ~85% DiskPressure eviction
          # threshold; the kubelet default (85/80) races eviction. huron hit
          # 75% with 530 cached images before this was added.
          imageGCHighThresholdPercent: 70
          imageGCLowThresholdPercent: 60
      nodeLabels:
        topology.kubernetes.io/zone: homelab
# Addressing is static and selected by MAC rather than interface name:
# predictable names are not stable across nodes (tahoe enumerates its NIC as
# ens18, everyone else as ens19). An earlier `interface: ens19` + `dhcp: false`
# block emitted no address/route documents at all, so nodes silently fell back
# to DHCP; erie booted without a lease on 2026-08-15 and sat unreachable for
# 51h with no static fallback.
nodes:
  - hostname: superior
    ipAddress: 192.168.40.11
    controlPlane: true
    installDisk: /dev/sda
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: bc:24:11:be:77:01
        dhcp: false
        mtu: 9000
        addresses:
          - 192.168.40.11/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.40.1
        vip:
          ip: 192.168.40.10
  - hostname: huron
    ipAddress: 192.168.40.12
    controlPlane: true
    installDisk: /dev/sda
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: bc:24:11:be:77:02
        dhcp: false
        mtu: 9000
        addresses:
          - 192.168.40.12/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.40.1
        vip:
          ip: 192.168.40.10
  - hostname: michigan
    ipAddress: 192.168.40.13
    controlPlane: true
    installDisk: /dev/sda
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: bc:24:11:be:77:03
        dhcp: false
        mtu: 9000
        addresses:
          - 192.168.40.13/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.40.1
        vip:
          ip: 192.168.40.10
  - hostname: erie
    ipAddress: 192.168.40.14
    controlPlane: false
    installDisk: /dev/sda
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: bc:24:11:be:77:04
        dhcp: false
        mtu: 9000
        addresses:
          - 192.168.40.14/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.40.1
  - hostname: ontario
    ipAddress: 192.168.40.15
    controlPlane: false
    installDisk: /dev/sda
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: bc:24:11:be:77:05
        dhcp: false
        mtu: 9000
        addresses:
          - 192.168.40.15/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.40.1
  - hostname: tahoe
    ipAddress: 192.168.40.16
    controlPlane: false
    installDisk: /dev/sda
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: bc:24:11:be:77:06
        dhcp: false
        mtu: 9000
        addresses:
          - 192.168.40.16/24
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.40.1
controlPlane:
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/intel-ucode
          - siderolabs/i915
          - siderolabs/qemu-guest-agent
  nameservers:
    - 10.0.0.1
  certSANs:
    # Node IPs
    - 192.168.40.11
    - 192.168.40.12
    - 192.168.40.13
    # Load balancers / VIPs
    - 192.168.40.10
    # Pod/Service Networks
    - 10.69.0.0/16
    - 10.96.0.0/16
  machineFiles:
    - content: |-
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
        [plugins."io.containerd.cri.v1.runtime"]
          cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
          device_ownership_from_security_context = true
      permissions: 0
      path: /etc/cri/conf.d/20-customization.part
      op: create
  disableSearchDomain: true
  patches:
    - |-
      machine:
        disks:
          - device: /dev/sdb
            partitions:
              - mountpoint: /var/lib/etcd
    - |-
      cluster:
        apiServer:
          extraArgs:
            feature-gates: MutatingAdmissionPolicy=true
            runtime-config: admissionregistration.k8s.io/v1beta1=true
        controllerManager:
          extraArgs:
            bind-address: "0.0.0.0"
        scheduler:
          extraArgs:
            bind-address: "0.0.0.0"
        etcd:
          extraArgs:
            listen-metrics-urls: "http://0.0.0.0:2381"
          advertisedSubnets:
            - 192.168.40.0/24
    - |-
      machine:
        sysctls:
          fs.inotify.max_queued_events: "65536"
          fs.inotify.max_user_instances: "8192"
          fs.inotify.max_user_watches: "524288"
          net.core.rmem_max: "2500000"
          net.core.wmem_max: "2500000"
    - |-
      machine:
        features:
          kubernetesTalosAPIAccess:
            enabled: true
            allowedRoles:
                - os:admin
            allowedKubernetesNamespaces:
                - actions-runner-system
                - system-upgrade
          kubePrism:
            enabled: true
            port: 7445
          hostDNS:
            enabled: true
            resolveMemberNames: true
            forwardKubeDNSToHost: false
worker:
  nameservers:
    - 10.0.0.1
  certSANs:
    # Node IPs
    - 192.168.40.14
    - 192.168.40.15
    - 192.168.40.16
    # Pod/Service Networks
    - 10.69.0.0/16
    - 10.96.0.0/16
  machineFiles:
    - content: |-
        [plugins."io.containerd.cri.v1.images"]
          discard_unpacked_layers = false
        [plugins."io.containerd.cri.v1.runtime"]
          cdi_spec_dirs = ["/var/cdi/static", "/var/cdi/dynamic"]
          device_ownership_from_security_context = true
      permissions: 0
      path: /etc/cri/conf.d/20-customization.part
      op: create
  disableSearchDomain: true
  schematic:
    customization:
      systemExtensions:
        officialExtensions:
          - siderolabs/intel-ucode
          - siderolabs/i915
          - siderolabs/qemu-guest-agent
  patches:
    - |-
      machine:
        sysctls:
          fs.inotify.max_queued_events: "65536"
          fs.inotify.max_user_instances: "8192"
          fs.inotify.max_user_watches: "524288"
          net.core.rmem_max: "2500000"
          net.core.wmem_max: "2500000"
    - |-
      machine:
        features:
          kubePrism:
            enabled: true
            port: 7445
          hostDNS:
            enabled: true
            resolveMemberNames: true
            forwardKubeDNSToHost: false
